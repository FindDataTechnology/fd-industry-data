name: flowers-kifc
label: 昆明花卉交易中心拍卖价格
source_url: http://www.kifc.cn
functions:
  - command: get_daily_prices
    description: 每日花卉拍卖价格数据
    category: commodity-pricing
    frequency: daily
    columns:
      - name: date
        type: str
        description: 交易日期
      - name: flower_name
        type: str
        description: 花卉品种
      - name: price
        type: float
        description: 拍卖价格（元/支）
