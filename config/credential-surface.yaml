# 凭据面登记（change fix-crawl-reliability-floor）
#
# 三层各管一段，互不代偿：
#   声明面  spiders/*/manifest.yaml 的 `requires_env`  —— 单元运行时读哪些键
#   登记面  本文件                                     —— 谁不是单元依赖、谁还等着补
#   值面    secrets/fd-industry-source-keys.env        —— 键的实际取值（不入 git）
#
# check_credential_declarations.py 双向对账：声明了但值面没有 ⇒ 红；
# 值面有但无人声明且未在此登记 ⇒ 红。
#
# 为什么 *_PASSWORD 要单列：它们是注册账号密码，供人去门户换 key。单元不读它们，
# 不登记就会被对账报成「无人声明的键」——那是假红。

schema: credential-surface/v1

# 值面里存在、但不是任何单元运行依赖的键。
non_unit_keys:
  - key: COMTRADE_PASSWORD
    reason: UN Comtrade 注册账号密码，供人去门户换订阅 key；单元只读 COMTRADE_API_KEY
  - key: ENTSOE_PASSWORD
    reason: ENTSOE 账号密码，人工审批源；单元只读 ENTSOE_SECURITY_TOKEN
  - key: ESTAT_PASSWORD
    reason: e-Stat 账号密码；单元只读 ESTAT_APP_ID
  - key: OCM_PASSWORD
    reason: OpenChargeMap 账号密码；单元只读 OCM_API_KEY

# 声明了但值面还缺的键：报「待补」（提示，不报红），并列出跟进方。
pending_keys:
  - key: COMTRADE_SUBSCRIPTION_KEY
    declared_by: [un-comtrade]
    action: 需人工去 UN Comtrade 门户注册订阅后取号，填入 secrets/fd-industry-source-keys.env
    since: "2026-11-21"
