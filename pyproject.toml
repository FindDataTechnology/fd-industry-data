[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fd-industry-data"
dynamic = ["version"]
description = "Industry data sources crawler collection using Scrapling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FindDataOfficial" }]
dependencies = [
    # <0.5 pin (fix-flower-auction-scrapling-drift, 2026-11-04): scrapling 0.5
    # removed the Dynamic session family (AsyncDynamicSession et al.) from
    # scrapling.fetchers — an engine swap (Camoufox→Chrome CDP), not a rename.
    # fd_industry_data.browser and the spiders are written against the 0.4 API
    # (verified intact through 0.4.15). Bump only with a behavioral migration.
    "scrapling[fetchers]>=0.4,<0.5",
    # BIFF (.xls) workbook reading for fd_industry_data.tabular — the one
    # tabular format with no stdlib path. xlrd 2.x is .xls-only (xlsx goes
    # through stdlib zipfile+ElementTree), pure Python, ~96KB, zero deps.
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# infra-telemetry 独立镜像线（add-infra-factory-fleet 组1）：fastmcp+uvicorn 只进
# 此 extra，不动 runner 依赖面（gitops-crawl-runtime D3：加依赖=运行时装版决策）。
telemetry = ["fastmcp>=3", "uvicorn>=0.30"]

[tool.setuptools.dynamic]
version = { attr = "fd_industry_data.__version__" }

[tool.setuptools.packages.find]
include = ["fd_industry_data*", "spiders*", "infra_telemetry*"]

[tool.setuptools.package-data]
fd_industry_data = ["sites.yaml"]

[project.scripts]
fd-runner = "fd_industry_data.runner_cli:main"
infra-telemetry = "infra_telemetry.server:main"

[project.entry-points."fd_open_data_mcp.datasources"]
fd-industry-data = "fd_industry_data.catalog:CATALOG"

[tool.pytest.ini_options]
markers = [
  "online: hits real external APIs (rate-limited, polite pool) — run explicitly",
]
