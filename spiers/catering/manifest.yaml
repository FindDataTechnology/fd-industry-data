name: catering
label: 中国餐饮行业协会数据
source_url: http://www.chinaca.org/
description: 餐饮行业数据、食品服务统计、市场趋势、消费行为
functions:
  - command: get_catering_data
    description: 获取餐饮行业统计数据和市场动态
    category: industry-data
    frequency: monthly
    columns:
      statistics:
        - name: period
          type: str
          description: 统计期间
        - name: category
          type: str
          description: 类别（英文）
        - name: category_cn
          type: str
          description: 类别（中文）
        - name: indicator_name
          type: str
          description: 指标名称（revenue/store_count/consumer_spending）
        - name: value
          type: float
          description: 数值
        - name: unit
          type: str
          description: 单位
        - name: growth_rate
          type: float
          description: 增长率
        - name: region
          type: str
          description: 地区
      news:
        - name: date
          type: str
          description: 发布日期
        - name: title
          type: str
          description: 标题
        - name: content
          type: str
          description: 内容摘要
        - name: category
          type: str
          description: 类别（news/policy/analysis/data/delivery/prepared_food）
