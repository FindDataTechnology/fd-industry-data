name: caam
label: 中国汽车工业协会数据
source_url: http://www.caam.org.cn/
description: 汽车产销统计数据、品牌销量排名、进出口数据、行业趋势分析
functions:
  - command: get_caam_data
    description: 获取汽车产销统计数据、销量排名和行业新闻动态
    category: industry-data
    frequency: monthly
    columns:
      production:
        - name: period
          type: str
          description: 统计期间（年/月）
        - name: vehicle_type
          type: str
          description: 车辆类型（英文）
        - name: vehicle_type_cn
          type: str
          description: 车辆类型（中文）
        - name: production_volume
          type: float
          description: 产量
        - name: production_unit
          type: str
          description: 产量单位（辆/万辆）
        - name: growth_rate_yoy
          type: float
          description: 同比增长率
        - name: growth_rate_mom
          type: float
          description: 环比增长率
        - name: brand
          type: str
          description: 品牌
        - name: category
          type: str
          description: 类别
      sales:
        - name: period
          type: str
          description: 统计期间
        - name: vehicle_type
          type: str
          description: 车辆类型（英文）
        - name: vehicle_type_cn
          type: str
          description: 车辆类型（中文）
        - name: sales_volume
          type: float
          description: 销量
        - name: sales_unit
          type: str
          description: 销量单位
        - name: growth_rate_yoy
          type: float
          description: 同比增长率
        - name: brand
          type: str
          description: 品牌
        - name: ranking
          type: int
          description: 排名
      news:
        - name: date
          type: str
          description: 发布日期
        - name: title
          type: str
          description: 标题
        - name: content
          type: str
          description: 内容摘要
        - name: category
          type: str
          description: 类别（news/production/sales/trade/nev/analysis）
