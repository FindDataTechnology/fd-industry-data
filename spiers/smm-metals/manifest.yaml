name: smm-metals
label: 上海有色金属网(SMM)金属价格数据
source_url: https://www.smm.cn
description: 每日有色金属现货价格、期货结算价、市场分析数据
functions:
  - command: get_smm_prices
    description: 获取有色金属每日现货价格（铜、铝、锌、铅、镍、锡）
    category: market-data
    frequency: daily
    columns:
      - name: date
        type: str
        description: 日期
      - name: metal
        type: str
        description: 金属名称（英文）
      - name: metal_cn
        type: str
        description: 金属名称（中文）
      - name: symbol
        type: str
        description: 金属符号（CU/AL/ZN/PB/NI/SN）
      - name: price_low
        type: float
        description: 最低价
      - name: price_high
        type: float
        description: 最高价
      - name: price_avg
        type: float
        description: 均价
      - name: price_change
        type: float
        description: 涨跌额
      - name: price_change_pct
        type: float
        description: 涨跌幅（%）
      - name: unit
        type: str
        description: 单位（元/吨）
      - name: currency
        type: str
        description: 货币（CNY）
      - name: source_url
        type: str
        description: 数据来源URL
      - name: scraped_at
        type: str
        description: 爬取时间
