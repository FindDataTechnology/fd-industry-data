name: cnki-academic-data
label: 中国知网 (CNKI) - 学术文献元数据
source_url: https://www.cnki.net/
score: 90
functions:
  - command: get_paper_metadata
    description: 获取学术论文元数据（标题、作者、摘要、关键词、引用数）
    category: academic-papers
    frequency: daily
    auth_required: false
    columns:
      - name: title
        type: str
        description: 论文标题
      - name: authors
        type: str
        description: 作者列表
      - name: source_journal
        type: str
        description: 来源期刊
      - name: publish_date
        type: str
        description: 发表日期
      - name: abstract
        type: str
        description: 摘要
      - name: keywords
        type: str
        description: 关键词
      - name: citation_count
        type: int
        description: 被引次数
      - name: download_count
        type: int
        description: 下载次数
  - command: get_journal_metadata
    description: 获取期刊元数据（名称、ISSN、CN号、出版单位）
    category: journals
    frequency: monthly
    auth_required: false
    columns:
      - name: journal_name
        type: str
        description: 期刊名称
      - name: issn
        type: str
        description: ISSN号
      - name: cn_number
        type: str
        description: CN号
      - name: publisher
        type: str
        description: 出版单位
      - name: category
        type: str
        description: 学科分类
  - command: get_publication_stats
    description: 获取平台 publication 统计数据
    category: platform-stats
    frequency: monthly
    auth_required: false
    columns:
      - name: stat_date
        type: str
        description: 统计日期
      - name: category
        type: str
        description: 类别
      - name: indicator
        type: str
        description: 指标名称
      - name: value
        type: float
        description: 指标值
      - name: unit
        type: str
        description: 单位
auth_notes:
  full_text: 需要机构或个人订阅
  api_access: 需要与CNKI签订正式协议
  public_data: 标题、摘要、引用数、期刊元数据、平台统计
