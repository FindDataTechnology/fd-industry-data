name: ifind-5ifin
label: 同花顺iFinD金融数据
source_url: https://www.5ifin.com
description: 金融新闻、股票行情、行业数据、基金排名数据
functions:
  - command: get_ifind_data
    description: 获取同花顺iFinD公开数据（新闻、行情、行业、基金）
    category: market-data
    frequency: daily
    columns:
      - name: title
        type: str
        description: 标题
      - name: summary
        type: str
        description: 摘要
      - name: category
        type: str
        description: 分类
      - name: source
        type: str
        description: 来源
      - name: publish_date
        type: str
        description: 发布日期
      - name: source_url
        type: str
        description: 数据来源URL
      - name: scraped_at
        type: str
        description: 爬取时间
