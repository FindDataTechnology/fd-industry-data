name: mot-highway
label: 交通运输部公路管理数据
source_url: http://www.mot.gov.cn/
description: 公路交通数据、车辆流量统计、基础设施数据、投资统计
functions:
  - command: get_mot_highway_data
    description: 获取公路交通流量、基础设施和投资数据
    category: industry-data
    frequency: monthly
    columns:
      traffic:
        - name: period
          type: str
          description: 统计期间
        - name: indicator
          type: str
          description: 指标名称（英文）
        - name: indicator_cn
          type: str
          description: 指标名称（中文）
        - name: value
          type: float
          description: 数值
        - name: unit
          type: str
          description: 单位（亿人/万人/亿吨/亿人公里等）
        - name: growth_rate
          type: float
          description: 同比增长率
        - name: category
          type: str
          description: 类别（passenger/freight/general）
      infrastructure:
        - name: period
          type: str
          description: 统计期间
        - name: indicator
          type: str
          description: 指标名称（英文）
        - name: indicator_cn
          type: str
          description: 指标名称（中文）
        - name: value
          type: float
          description: 数值
        - name: unit
          type: str
          description: 单位（万公里/公里/座/个）
        - name: growth_rate
          type: float
          description: 同比增长率
        - name: category
          type: str
          description: 类别（expressway/national/provincial/rural/general）
        - name: region
          type: str
          description: 地区
      investment:
        - name: period
          type: str
          description: 统计期间
        - name: indicator
          type: str
          description: 指标名称（英文）
        - name: indicator_cn
          type: str
          description: 指标名称（中文）
        - name: value
          type: float
          description: 数值
        - name: unit
          type: str
          description: 单位（亿元/万元）
        - name: growth_rate
          type: float
          description: 同比增长率
        - name: category
          type: str
          description: 类别（construction/maintenance/general）
      news:
        - name: date
          type: str
          description: 发布日期
        - name: title
          type: str
          description: 标题
        - name: content
          type: str
          description: 内容摘要
        - name: category
          type: str
          description: 类别（news/highway/investment/policy/construction/toll）
