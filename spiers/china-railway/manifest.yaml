name: china-railway
label: 中国国家铁路集团数据
source_url: http://www.china-railway.com.cn/
description: 铁路货运数据、旅客运输量、基础设施统计、投资数据
functions:
  - command: get_china_railway_data
    description: 获取铁路货运、客运、投资和基础设施数据
    category: industry-data
    frequency: monthly
    columns:
      freight:
        - name: period
          type: str
          description: 统计期间
        - name: indicator
          type: str
          description: 指标名称（英文）
        - name: indicator_cn
          type: str
          description: 指标名称（中文）
        - name: value
          type: float
          description: 数值
        - name: unit
          type: str
          description: 单位（万吨/亿吨/万吨公里）
        - name: growth_rate
          type: float
          description: 同比增长率
        - name: category
          type: str
          description: 类别（general/container/coal）
      passenger:
        - name: period
          type: str
          description: 统计期间
        - name: indicator
          type: str
          description: 指标名称（英文）
        - name: indicator_cn
          type: str
          description: 指标名称（中文）
        - name: value
          type: float
          description: 数值
        - name: unit
          type: str
          description: 单位（万人/亿人/万人公里）
        - name: growth_rate
          type: float
          description: 同比增长率
        - name: category
          type: str
          description: 类别（general/seasonal/hsr）
      investment:
        - name: period
          type: str
          description: 统计期间
        - name: indicator
          type: str
          description: 指标名称（英文）
        - name: indicator_cn
          type: str
          description: 指标名称（中文）
        - name: value
          type: float
          description: 数值
        - name: unit
          type: str
          description: 单位（亿元/万公里/公里）
        - name: growth_rate
          type: float
          description: 同比增长率
        - name: category
          type: str
          description: 类别（general/infrastructure/equipment/hsr）
      news:
        - name: date
          type: str
          description: 发布日期
        - name: title
          type: str
          description: 标题
        - name: content
          type: str
          description: 内容摘要
        - name: category
          type: str
          description: 类别（news/freight/passenger/investment/hsr/policy）
