# 全量单元测试（openspec: relay-alert-channel 组 1 前置）。
#
# 为什么这条 CI 之前不存在：本仓有 14 条 workflow，全是告警 cron / 出片这类
# 「跑起来才有意义」的作业，没有一条跑 tests/。于是 2071 个用例只在开发者本机跑过
# ——「本机绿」既不是证据，也保不住下一次改动。
#
# 两个取舍：
#  · scrapling 是重依赖（浏览器栈），测试不需要它。装包用 `--no-deps`，
#    只有确实要跑的模块才装。缺模块的用例会 collect error，那正是要看见的信号。
#  · fd_open_data_mcp 在 PyPI 上（0.5.64），装正式版而不是拉兄弟仓——
#    拉兄弟仓会让 CI 依赖两个仓的相对路径，而独立 clone 时那条路径不存在。
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 每日 21:17 CST 跑一次 online 组。默认 push/PR 不跑它们（见下方 -m 过滤），
    # 但「声明了 run explicitly」不等于「永远不跑」——真要没人跑，那 6 个用例
    # 就是死代码，上游契约变了也没人知道。2026-11-21 欧洲 PMC 一次 503 让整轮
    # 2111 个用例判红，这条排程就是把它挪到单独的信号里。
    - cron: "17 13 * * *"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          # 按 pyproject 的真实依赖装（带 extras）。裸 scrapling 试过，不够：
          # test_eurostat_hotel_series 动态加载 spiders/*/spider.py，那些模块在
          # import 期就拉 scrapling 的 fetcher 栈（curl_cffi）。测的是「spider 能否
          # 装配」，所以依赖面必须与生产一致，而不是裁剪到「单测看起来不需要」。
          #
          # fd_open_data_mcp 装 PyPI 正式版：拉兄弟仓会让 CI 依赖两个仓的相对路径，
          # 独立 clone 时那条路径不存在。
          pip install -e .
          pip install pytest fd-open-data-mcp

      # online 组打真实第三方 API（europepmc / arXiv / MIT OCW / Apple），
      # marker 自己写着「run explicitly」。2026-11-21 之前这里是无条件
      # `pytest tests/ -q`，等于让 6 个外部依赖的用例替整轮 2111 个用例背书：
      # 欧洲 PMC 回一次 503，全绿的代码也判红。默认排除，靠上面的每日排程单跑。
      - name: 跑 tests/（离线组）
        run: python -m pytest tests/ -q -m "not online"

      - name: 跑 tests/（online 组）
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # online 组失败不掩盖离线组结果：两条是分开的 step，红在哪一步看得见。
        # 上游临时 503 仍然会让这一步红——那正是「外部依赖今天不健康」该有的信号。
        run: python -m pytest tests/ -q -m online

      - name: CaaS 权威表一致性（跨面合规闸）
        run: |
          # 闸本身在 fd-industry-data/scripts/；独立 clone 时根 openspec/ 不存在，
          # 它会如实报 UNCOVERED 而不是假绿。
          python scripts/check_caas_conformance.py

      # 两条纯静态可靠性闸（change fix-crawl-reliability-floor）。都不连库、不联网：
      # 凭据对账读清单+值面镜像，limit 语义读清单+豁免/基线。值面在仓外，CI
      # 里没有 secrets/fd-industry-source-keys.env ⇒ 该闸会退出 2（判不出），
      # 所以 CI 只跑它的 --self-test（纯函数，不读盘）。
      - name: 可靠性闸自证
        run: |
          python scripts/check_credential_declarations.py --self-test
          python scripts/check_limit_semantics.py --self-test

      - name: limit_kind 语义闸（真盘面）
        run: python scripts/check_limit_semantics.py

      # 源登记表漂移闸（change derive-source-registries）。只读源码与盘面：
      # L3 可达性表 2026-09-12 生成，95 条里 59 条指向的单元目录已不在仓里，
      # 却仍被当 unreachable 引用。本闸把「已归档」与「打不通」分开，并要求
      # same_source_as 双向一致。红只在同源声明坏 / 新单元未登记。
      # L3 可达性表在 output/（gitignored 的本地/分析产物），新克隆里不存在 ⇒
      # 漂移判定在 CI 里**无输入可判**。跑它的 --self-test（纯函数）而不是硬跑，
      # 否则这道闸每天红在「判不出」上——永久红等于没有闸。
      # 真判定在本地/分析机上跑：python3 scripts/check_registry_drift.py
      - name: 源登记表漂移闸自证
        run: python scripts/check_registry_drift.py --self-test

      # 漏斗文档-代码一致性（change structure-scout-candidates）。文档曾长期写着
      # 「candidates 是 unknown」而代码 2026-11-10 就接通了——那是另一种假信号：
      # 判据看着缺少、实际已可用。只核 candidates/landed/lit 三个离线可读的数。
      - name: 漏斗文档-代码一致性
        run: python scripts/onboarding_funnel.py --check-doc

