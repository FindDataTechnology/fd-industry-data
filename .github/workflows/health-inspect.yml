# 自愈闭环 · 巡检器（spider-self-heal-l2）
#
# 流程：读中央库 crawl_runs（只读）→ 分诊出单落 reports/health-tickets/ →
#       SUBMIT 给萬星 spider-heal Agent Service → STATUS 回读同步生命周期 → 回写提交。
#
# 自包含设计：不使用任何 actions（避免 runner 经代理下载 action 的偶发 TLS 失败），
# 全部步骤为 shell + 内建 python3；每次全新浅克隆（免疫工作区残留状态）。
# 网络经 fd-health-proxy（mihomo 出口）；所有 git 网络操作带重试。
#
# 依赖（一次性，见 docs/health-loop.md「运维配置」）：
#   - self-hosted runner（labels: self-hosted, fd-health；k8s Deployment fd-health-runner）
#   - secrets: FD_CENTRAL_PG_DSN（中央库只读）、WANXING_SPIDER_HEAL_KEY（finddata 调用键）
#   - vars（可选）: WANXING_SPIDER_HEAL_URL、FD_HEALTH_CONFIG
name: health-inspect

on:
  schedule:
    - cron: "17 19 * * *" # 每日 03:17 CST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅出单不 SUBMIT（校准期用）"
        type: boolean
        default: false

concurrency:
  group: health-inspect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  inspect:
    runs-on: [self-hosted, fd-health]
    # 预算算式（2026-10-12 实测标定）：每个新单 SUBMIT ≈ 2-5 分钟（真回合），
    # 每张未终态单的 STATUS 回读 ≈ 2-4 分钟（键每轮唯一 → 真回合，见 inspector
    # _status_idem_key）。3 新单 + 3 存量单曾跑满 19m54s 撞穿旧的 20 分钟上限
    # → 45 分钟给「数个新单 + 全部存量回读」留余量。超大单批（数十张）走人工
    # 批量通道，不指望本工作流一次跑完。
    timeout-minutes: 45
    steps:
      - name: Checkout (shell clone, retry)
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf src
          for i in 1 2 3 4 5; do
            if git clone --depth=1 \
                 "https://x-access-token:${{ github.token }}@github.com/FindDataTechnology/fd-industry-data.git" src; then
              break
            fi
            echo "clone attempt $i failed; retrying in 8s"
            rm -rf src
            sleep 8
          done
          test -d src/.git

      # 裁决通道（fleet-lifecycle-adjudication）：同源 manual 终态工单 >= 2 即升级
      # 人工裁决——建卷宗 output/adjudication/cases/<src>.md + 队列 queue.json，
      # 升级源冻结新工单派发（apply_freeze，在工单生成入口接线）。
      # output/ 不入 git：工单语料在仓里，扫描每次从全量工单确定性重derive（幂等）。
      - name: Adjudication scan — manual 重复工单升级（N=2）
        working-directory: src
        run: |
          python3 scripts/adjudicate.py scan
          # 队列摘要：job summary + 日志（条目数与新升级源名见上方 scan 输出）
          python3 scripts/adjudicate.py summary >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          python3 scripts/adjudicate.py list

      # 看门狗：告警系统自己停了，没人会知道——沉默与「没有事件」长得一样。
      # 为什么放这里：health-inspect 与 banking-alerts 是两个独立工作流，前者坏不会
      # 连累后者；反过来 banking-alerts 停摆时，这一步仍在跑，于是能发现它。
      # 只看「最近一次报告日期」这一个可复核事实，不推测原因。
      # continue-on-error：看门狗红了不该拖垮巡检主流程（它只是信号源）。
      - name: Watchdog — 银行告警是否还在按期出报告
        working-directory: src
        continue-on-error: true
        run: |
          set -uo pipefail
          LIMIT_DAYS="${FD_ALERT_STALE_DAYS:-3}"
          latest=$(ls -1d reports/banking-alerts/*/ 2>/dev/null \
                   | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | tail -1)
          if [ -z "$latest" ]; then
            echo "::error title=银行告警从未产出::reports/banking-alerts/ 下没有任何日期目录"
            echo "### 银行告警：从未产出报告" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$latest" +%s) ) / 86400 ))
          echo "最近一次银行告警报告：$latest（$age 天前，阈值 ${LIMIT_DAYS} 天）"
          if [ "$age" -gt "$LIMIT_DAYS" ]; then
            echo "::error title=银行告警已停摆::$latest 距今 $age 天（阈值 ${LIMIT_DAYS}）"
            {
              echo "### 银行告警：已 $age 天没有报告（阈值 ${LIMIT_DAYS} 天）"
              echo ""
              echo "沉默**不等于**没有事件。按序排查："
              echo "1. \`gh run list --workflow banking-alerts.yml\` 最近几次的结论；"
              echo "2. 结论 success 但没写报告 ⇒ 看日志里有没有 exit 3（缺 DSN 或缺 SELECT 权限）；"
              echo "3. 工作流根本没被调度 ⇒ GitHub 会因长期无活动停用 schedule 工作流，重启用即可。"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi
          echo "看门狗：正常"

      - name: Inspector (emit) — 只落单不投递
        working-directory: src
        env:
          FD_CENTRAL_PG_DSN: ${{ secrets.FD_CENTRAL_PG_DSN }}
          WANXING_SPIDER_HEAL_KEY: ${{ secrets.WANXING_SPIDER_HEAL_KEY }}
          WANXING_SPIDER_HEAL_URL: ${{ vars.WANXING_SPIDER_HEAL_URL || 'https://platform.finddatatech.cloud/api/wanxing/v1/a2a/packs-kkcie7nlrhluo4likpnn0w-spider-heal' }}
          # 巡检范围收敛（add-fleet-lifecycle-adjudication 1.3）：vars.FD_HEALTH_CONFIG
          # 未配置时回落仓内 scope 文件——跨仓特殊 Job（law 线/适配器/observer）不属
          # 本巡检判定范围，其遥测走 report_special_run/federation-observer 面
          FD_HEALTH_CONFIG: ${{ vars.FD_HEALTH_CONFIG || 'config/health-scope.json' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python3 scripts/health_inspect.py --from-pg --emit $ARGS

      # 落仓门（fix-health-ticket-landing-race）：工单必须先推到远端可见。
      # 此前同一进程既写盘又投递，agent 回 GitHub 读到 404 → 拒收转人工，
      # 2026-10-06 / 10-11 各烧掉一批工单。
      - name: Commit & push tickets (landing gate)
        working-directory: src
        run: |
          git config user.name  "fd-health-bot"
          git config user.email "fd-health-bot@finddatatech.cloud"
          git add reports/health-tickets
          if git diff --cached --quiet; then
            echo "no ticket changes"
            exit 0
          fi
          git commit -m "health: tickets $(date -u +%F)"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $i failed; rebase+retry in 8s"
            git pull --rebase origin main || true
            sleep 8
          done
          echo "push failed after retries"; exit 1

      - name: Deliver (SUBMIT/STATUS) — 落仓之后
        working-directory: src
        env:
          FD_CENTRAL_PG_DSN: ${{ secrets.FD_CENTRAL_PG_DSN }}
          WANXING_SPIDER_HEAL_KEY: ${{ secrets.WANXING_SPIDER_HEAL_KEY }}
          WANXING_SPIDER_HEAL_URL: ${{ vars.WANXING_SPIDER_HEAL_URL || 'https://platform.finddatatech.cloud/api/wanxing/v1/a2a/packs-kkcie7nlrhluo4likpnn0w-spider-heal' }}
          FD_HEALTH_CONFIG: ${{ vars.FD_HEALTH_CONFIG || 'config/health-scope.json' }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python3 scripts/health_inspect.py --from-pg --deliver --submit-new --sync-status $ARGS \
            --summary-file reports/health-tickets/last-run.json

      # if: always() — 前一步被超时取消时也要保住已得回执（2026-10-12 实证：
      # 取消会把整轮 STATUS 回读白丢，工单停在旧状态等下一轮）。
      - name: Commit delivery receipts
        if: always()
        working-directory: src
        run: |
          git config user.name  "fd-health-bot"
          git config user.email "fd-health-bot@finddatatech.cloud"
          git add reports/health-tickets
          if git diff --cached --quiet; then
            echo "no ticket changes"
            exit 0
          fi
          git commit -m "health: tickets $(date -u +%F)"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $i failed; rebase+retry in 8s"
            git pull --rebase origin main || true
            sleep 8
          done
          echo "push failed after retries"; exit 1