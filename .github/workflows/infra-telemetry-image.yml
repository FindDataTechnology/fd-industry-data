# infra-telemetry 镜像发布 — GitHub Actions → TCR（hkccr，公开仓免费线）
#
# 形状=health-runner-image.yml 同模：只在观测面变更时构建（区别于 image.yml 全量触发）。
# 部署侧接线见 fd-infra-deploy/all-services/prod/infra-telemetry.yaml + PORTS.md 台账。
name: infra-telemetry-image

on:
  push:
    paths:
      - "infra_telemetry/**"
      - ".github/workflows/infra-telemetry-image.yml"
  workflow_dispatch:

concurrency:
  group: infra-telemetry-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata
  IMAGE_NAME: infra-telemetry
  DOCKERFILE: infra_telemetry/Dockerfile

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
