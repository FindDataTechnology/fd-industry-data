# infra-telemetry 镜像发布 — GitHub Actions → TCR（hkccr，公开仓免费线）
#
# 形状=health-runner-image.yml 同模：只在观测面变更时构建（区别于 image.yml 全量触发）。
# 部署侧接线见 fd-infra-deploy/all-services/prod/infra-telemetry.yaml + PORTS.md 台账。
name: infra-telemetry-image

on:
  push:
    paths:
      - "infra_telemetry/**"
      - ".github/workflows/infra-telemetry-image.yml"
  workflow_dispatch:

concurrency:
  group: infra-telemetry-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata
  IMAGE_NAME: infra-telemetry
  DOCKERFILE: infra_telemetry/Dockerfile

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          # 只推滚动 main；不可变 tag 由内容闸门按 digest 追加（见 image.yml 注释）。
          tags: |
            type=raw,value=main

      - id: prev
        name: 读 main 当前 digest（内容基线）
        run: |
          img="$REGISTRY/$NAMESPACE/$IMAGE_NAME"
          cur=$(docker buildx imagetools inspect "$img:main" \
                --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          echo "digest=$cur" >> "$GITHUB_OUTPUT"
          echo "main 当前 digest: ${cur:-<不存在，本次为首次构建>}"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: true
          # 硬约束：开了 attestation，同内容两次构建 digest 必然不同，闸门永久失效。
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 内容闸门：digest 变了才铸 sha-<commit>，让「同内容多 tag」结构上不可能。
      - name: 内容变了才铸不可变 tag
        env:
          NEW: ${{ steps.build.outputs.digest }}
          OLD: ${{ steps.prev.outputs.digest }}
        run: |
          set -euo pipefail
          img="$REGISTRY/$NAMESPACE/$IMAGE_NAME"
          [ -n "$NEW" ] || { echo "::error::构建未产出 digest"; exit 1; }
          if [ "$NEW" = "$OLD" ]; then
            echo "内容未变（$NEW）：不铸新 tag"
            {
              echo "### 内容未变，未产出新 tag"
              echo ""
              echo "本次构建与 \`main\` 当前指向完全一致。"
              echo ""
              echo "- 可直接 pin：\`$img@$NEW\`"
              echo "- 滚动引用：\`$img:main\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create -t "$img:$tag" "$img@$NEW"
          echo "已铸 $tag → $NEW"
          {
            echo "### 内容有变化，已铸不可变 tag"
            echo ""
            echo "| 字段 | 值 |"
            echo "|---|---|"
            echo "| tag | \`$tag\` |"
            echo "| digest | \`$NEW\` |"
            echo "| 上一内容 digest | \`${OLD:-<无>}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
