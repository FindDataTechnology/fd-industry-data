# github → gitee 单向镜像（2026-11-19 立）
#
# **为什么需要它**：本仓有**两个远端，各自承担一半职责**，而两者之间没有任何同步。
#
#   | 角色 | gitee | github |
#   |---|---|---|
#   | 集群读内容（ArgoCD `repoURL`） | ✅ 部署真源 | ❌ 不读 |
#   | CI（告警/巡检/出片） | ❌ 无 Actions | ✅ 13 个工作流 |
#   | 告警/巡检回写 | ❌ | ✅ `git push origin HEAD:main` |
#
# 后果是分叉会**结构性**地重长：人工往 gitee 推的代码 github 不知道，CI 往 github
# 推的状态文件 gitee 不知道。2026-11-19 实测两侧差了 36 / 33 个提交（含一批只存在于
# github 的健康巡检改造与只存在于 gitee 的波抽取排期），手工 merge 才收口一次。
#
# **方向为什么是 github → gitee 单向**：
#   * gitee 不能被放弃 —— ArgoCD 从它读，这是国内集群的硬约束；
#   * github 不能被放弃 —— `runs-on: [self-hosted, fd-health]` 的 runner 只在 github；
#   * 所以让 github 当**唯一的写入口**，gitee 作它的镜像。人工改代码请推 github
#     （`git push origin main`），本工作流会在几分钟内带过去。
#
# **不做双向**：双向同步在两边同时有提交时必然产生冲突，而冲突发生在 CI 里没人看着，
# 症状是「某一侧的提交静默消失」。单向 + 单一写入口不会。
#
# ── 凭据为什么是 PAT 而不是 SSH key（2026-11-19 实测后定的）──────────────
#
# 原本写的是 SSH 部署公钥，实测发现**gitee 的部署公钥只能 clone/pull，不能 push**
# （仓库设置页原文：「部署公钥配置后的机器，只支持 clone 与 pull 等只读操作」）。
# 而唯一能推的 SSH key 是组织账号 key —— 把它交给 Actions 等于对全组织仓开放写权限。
#
# 改用**私人访问令牌（PAT）**：gitee 支持「仓库级私人令牌」，只对指定仓库生效，
# 权限可只勾 `projects`。实测该令牌能 clone 也能 push（探针分支建了又删）。
#
# 凭据：`GITEE_TOKEN`（GitHub Actions secret）。**缺失即失败，不静默跳过**——
# 一个「配了但没生效」的镜像闸比没有更糟（会让人以为 github 的提交已经过去了）。
name: mirror-to-gitee

on:
  push:
    branches: [main]
  # 允许手工补推（镜像漏了一轮时）
  workflow_dispatch:

# 同分支只保留最新一轮。**必须 cancel-in-progress**：告警工作流每 5 分钟就可能推一次，
# 排队等前一轮会把镜像延迟累积成小时级。
concurrency:
  group: mirror-to-gitee-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mirror:
    # 用 GitHub 托管 runner（不占 fd-health 那台自建机的槽位——它要跑巡检）。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check credential is configured
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            cat >&2 <<'EOF'
          镜像失败：GITEE_TOKEN 未配置。

          这不是「跳过」，是「镜像没发生」——请到
          Settings → Secrets and variables → Actions 添加 GITEE_TOKEN
          （gitee「仓库级私人令牌」，只勾 projects，仅对 fd-industry-data 生效）。
          配好之前，gitee 不会自动跟上 github。
          EOF
            exit 1
          fi

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # gitee 侧需要完整历史：推一个浅克隆会让 gitee 的 history 变浅。
          fetch-depth: 0

      - name: Push to gitee (fast-forward only)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          # 令牌走 URL，但**不回显**：`set -x` 关掉，且 git 的错误信息里 URL 会被
          # 脱敏。把 remote 写成变量而不是 echo 出来。
          remote="https://oauth2:${GITEE_TOKEN}@gitee.com/FindDataTechnology/fd-industry-data.git"

          git remote add gitee "$remote"
          git fetch --no-tags gitee main || {
            echo "镜像失败：gitee 侧还看不到 main（新仓或令牌权限不足）" >&2; exit 1; }

          ahead=$(git rev-list --count gitee/main..HEAD)
          behind=$(git rev-list --count HEAD..gitee/main)
          echo "本提交相对 gitee/main：领先 $ahead 个、落后 $behind 个"

          if [ "$behind" -ne 0 ]; then
            cat >&2 <<EOF
          镜像中止：gitee/main 上有 $behind 个 github 没有的提交。

          这正是本工作流要防的形态——但它**不能自动决定**谁对：
          gitee 是部署真源（ArgoCD 读它），那些提交可能已经在生产生效。
          请人工在本地 merge 两侧后推 github，本工作流会把合并结果带过去。

          以下是 gitee 独有的提交：
          EOF
            git log --oneline HEAD..gitee/main | head -30 >&2
            exit 1
          fi

          if [ "$ahead" -eq 0 ]; then
            echo "gitee 已是最新，无需推送"
            exit 0
          fi

          # 到这里：gitee 是 HEAD 的祖先 ⇒ 普通 fast-forward 推送。
          # 不带 --force：先把「绝不覆盖」写成默认行为，而不是靠人记得不加。
          git push gitee HEAD:refs/heads/main
          echo "已镜像 $ahead 个提交到 gitee/main"

      - name: Remove credential from git config
        if: always()
        run: |
          # runner 是临时的，但仍清掉：fork PR 或 debug 步骤里 `git remote -v` 会泄令牌。
          git remote remove gitee 2>/dev/null || true
