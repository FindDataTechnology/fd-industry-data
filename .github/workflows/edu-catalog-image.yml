# edu-catalog 镜像发布 — GitHub Actions → TCR（hkccr）
# 形状=infra-telemetry-image.yml 同模：观测面变更才构建；tag=commit sha + main。
name: edu-catalog-image

on:
  push:
    paths:
      - "edu_catalog/**"
      - "spiders/education_catalog_core/**"
      - "spiders/__init__.py"
      - ".github/workflows/edu-catalog-image.yml"
  workflow_dispatch:

concurrency:
  group: edu-catalog-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata
  IMAGE_NAME: edu-catalog
  DOCKERFILE: edu_catalog/Dockerfile

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
