# 酒店行业监控宇宙（首批 33 家）— add-hotel-vertical 任务 3.6 真源
#
# entity_type 一律 `stock`。
#
# 代码约定（与餐饮线一致，注册脚本按此解析）：
#   * A股：裸 6 位数字（600754）
#   * 港股：5 位数字 + `.HK`（00069.HK）
#   * 台股：4 位数字 + `.TW`（2707.TW）
#   * 日股：4 位数字 + `.T`（9722.T）
#   * 美股：裸 ticker（MAR）
#   * 欧股：交易所后缀（AC.PA / WTB.L）—— 本批只登记，无车道
#
# segment 口径（六类，互斥，不模糊归类）：
#   luxury-upscale     高端/奢华全服务（含观光饭店）
#   midscale           中端（含有限服务连锁、生活方式品牌）
#   economy-budget     经济型/平价（含特许经营为主）
#   serviced-apartment 服务式公寓/分时度假
#   resort-casino      度假村/娱乐综合体
#   OTA-platform       分销平台（与运营商不同业态，只作对照不做合并聚合）
#
# 本批 resort-casino 无实体：原候选复星旅游文化 01992 已退市（见 verified 段）。
#
# verified 字段口径（**不造数纪律**）：
#   ticker    = 票符本身经上游核实（A股经东财公告列表、港股经 HKEX prefix.do、
#               美股经 SEC company_tickers.json）
#   lanes     = 数据车道可达性经实测
#   unverified= 上游不可达，票符未核（台股 TWSE openapi 超时、日股无 EDINET key、
#               欧股平台无车道）——读路径 MUST 呈现不可得，不得据此出数

