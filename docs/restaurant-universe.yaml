# 餐饮行业监控宇宙（首批 35 家）— task 3.1 真源
#
# entity_type 一律 `stock`（fd-open-data-protocol/vocabulary/entity_types.yaml:
# "Listed equity issues, keyed by exchange-suffixed ticker"）。
#
# 代码约定（本文件定义，注册脚本按此解析；已存在的实体**复用不重建**）：
#   * A股：沿用库里既有惯例 = 裸 6 位数字（002186），不带 .SZ/.SH 后缀；
#   * 港股：5 位数字 + `.HK`（06862.HK），与库里 0700.HK / 9988.HK 同形；
#   * 台股：4 位数字 + `.TW`（2727.TW）；
#   * 日股：4 位数字 + `.T`（7550.T，TSE 通用后缀）；
#   * 美股：裸 ticker（MCD）。
#
# segment 口径（四类，互斥，不模糊归类）：
#   full-service    正餐（有服务到桌/翻台率口径的公司）
#   limited-service 快休闲/快餐（含披萨外卖、火锅快取、盖饭快餐）
#   cafe-teahouse   咖啡/茶饮/烘焙门店（现制饮品为主）
#   prepared-food   预制/卤味/速冻（工厂生产 + 零售渠道，非门店现制）
#
# lanes = 该公司的数据车道（波2 分层结果，见 change 提案）：
#   cninfo-operating      交易所经营公告（既有单元，零新建）
#   fd-cn-report          A股财报（既有车道，仅引用）
#   twse-monthly-revenue  台股月营收（既有单元，当前上游不可达 → 见 tasks 1.4）
#   hkex-disclosure       港股披露易（本波新建）
#   sec-edgar-facts       美股 XBRL company facts（本波新建）
#   jp-tdnet              日股 TDNet 適時開示（本波新建，公开无键；替代需 key 的 EDINET API v2）
#
# SEC 边界注记（2026-10-07 侦察簿裁决）：A股/台股车道为**既有车道引用**，
# 本能力不新建解析 A股财报全文的爬虫单元；港股/美股/日股在平台此前无车道，
# 新建不构成与既有财报线的重叠（裁决理由=防重叠）。

