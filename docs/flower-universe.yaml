#
# 代码约定（沿用 docs/hotel-universe.yaml / docs/restaurant-universe.yaml）：
#   * A股：裸 6 位数字（002200），不带 .SZ/.SH 后缀；
#   * 日股：4 位数字 + `.T`（1377.T）；
#   * 美股：裸 ticker（FLWS）。
#
# ── 分层口径（spec: 宇宙分纯花卉层与邻接层，分层依据为主营构成证据）────────
#   tier: pure-flower  = 主营收入以花卉/观赏植物为核心
#   tier: adjacency    = 有可核验的花卉相关业务分部（园艺用品/温室/园林苗木）
#   仅凭名称、品牌或行业标签含花卉字样**不得**作为纳入依据。
#
# ── segment 闭集（不模糊归类、不允许同义异写）───────────────────────────
#   cutflower-trade        切花贸易（种球/切花流通与交易）
#   breeding-propagation   种苗育种（育种、种子、组培繁殖）
#   horticultural-supplies 园艺用品（基质、肥料、花盆、园艺耗材）
#   greenhouse-equipment   温室设施（温室结构、补光、灌溉、环境控制设备）
#   greenhouse-grower      温室种植（受控环境农业种植主体）
#   landscape-nursery      园林苗木（苗木种植、租摆、绿化施工中的苗木分部）
#
# ── 车道（lanes）与 region 必须一致 ───────────────────────────────────
#   US → sec-edgar-facts（既有单元）
#   JP → edinet-api（**无 key，车道不可用**；ticker 亦未上游核实）
#   CN → stock-zygc（既有单元，东财 F10 主营构成，含 segment_type 分部）
#   分部深抽取（三通道）另见 change awaken-flower-report-ingest 的
#   `xbrl-segment-extraction`（US 10-K instance）与 `stock-zygc`（A股）。
#
# ── flower_revenue_share 口径（spec: 未披露即显式不可得）────────────────
#   取值来自可得的分部披露（主营构成或等价结构化披露），单位=小数（0.0023 = 0.23%）。
#   `null` = **显式不可得**（当期未披露或口径不可比），不是 0，也不得用估算补齐。
#   以该字段排序的排名/占比图必须排除 null 实体。
#
# ── 验证状态 ─────────────────────────────────────────────────────────
#   verified.ticker   票符是否上游核实
#   verified.segments 分部/主营构成是否已实测
#   未核实项在读取面须呈现「不可得」，不得静默渲染成数字。

