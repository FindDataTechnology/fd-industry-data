{{- /*
Rendered once per data source by the fd-industry ApplicationSet.
`source`/`schedule`/`memoryLimit`/`cpuLimit`/`site` come from the source's
spiders/<src>/manifest.yaml (flat v2 fields); `image`, `namespace`,
`gitTokenSecret` and DB wiring come from the ApplicationSet template.
A source without a `schedule` renders zero resources (silent by design).
A source routed to a non-tencent (docker) site renders nothing here — its
cadence is owned by that site's dispatcher tick, never by a cluster CronJob.
Absent manifest fields arrive via `helm --set` as the literal "<no value>",
so both empty and that sentinel must mean "off".
*/ -}}
{{- $site := .Values.site | default "tencent" }}
{{- /* 排期时区（harden-crawl-delivery 1.3）：显式钉死，不依赖控制器本地时区。
       缺省与迁移前集群的实际行为一致（Asia/Shanghai），所以补齐声明不改变触发时刻；
       真按 UTC 设计的源在 manifest 里写 schedule_tz: UTC。 */ -}}
{{- $tz := .Values.scheduleTz | default "Asia/Shanghai" }}
{{- if eq (toString $tz) "<no value>" }}{{ $tz = "Asia/Shanghai" }}{{- end }}
{{- /* 停用语义（harden-crawl-delivery 6.1 裁决 A）：parked / enabled=false 的源
       **仍然渲染**一个 suspend: true 的 CronJob，而不是不渲染。
       原因（2026-11-09 实测）：渲染结果为空时 ArgoCD 会拒绝自动同步——
       "auto-sync will wipe out all resources"——于是旧 CronJob 原样留下继续跑，
       bls / cncotton 就是这样每天仍在触发。挂起后既不再起 Job，也让「停用」
       成为可观测的显式状态，且不会触发清空保护。 */ -}}
{{- $sched := .Values.schedule }}
{{- if or (eq (toString $sched) "<no value>") (eq (toString $sched) "") }}{{ $sched = "" }}{{- end }}
{{- $parked := or (eq (toString .Values.parked) "true") (eq (toString .Values.enabled) "false") }}
{{- if and (or $sched $parked) (eq $site "tencent") }}
apiVersion: batch/v1
kind: CronJob
metadata:
  {{- /*
  `metadata.name` 必须是 RFC 1123 子域名：只允许小写字母/数字/`-`/`.`。
  而 `source` 是 spiders 目录名，其中 9 个带下划线（education_openalex 等）——
  直接拼进 name 会被 apiserver 拒绝（`Invalid value: "fd-industry-education_openalex"`），
  于是那 5 个 education 应用长期卡在 `Missing`，从未真正部署过。
  只在这里做替换：下面的 label 与 args 仍用原始 `source`（label 值允许下划线，
  且 dispatcher 按 `fd-industry/source` 标签选 pod，改它会打断调度）。
  */}}
  name: fd-industry-{{ .Values.source | replace "_" "-" }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: fd-industry-appset
    fd-industry/source: {{ .Values.source }}
spec:
  {{- /* 挂起源没有 schedule 可用（manifest 已清空），但 CronJob.spec.schedule 是必填。
         取一个永不发生的日期（2 月 31 日）占位：suspend: true 下它永远不会落 Job。 */}}
  schedule: "{{ if $sched }}{{ $sched }}{{ else }}0 0 31 2 *{{ end }}"
  timeZone: {{ $tz | quote }}
  suspend: {{ $parked }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.deadlineSeconds | default 7200 }}
      {{- /*
      backoffLimit 缺省 1：日报/小时报源一次抖动，下一个窗口自然重来。
      但**季/年/月**频的源不能沿用这个默认——`backoffLimit: 1` 意味着一次抖动
      就是整窗空档（2026-11-13 实测：`33 1 10 * *` 的 nifdc-batchcert 失败一次，
      按线上模板原样复跑却是 Completed / rows=100，属瞬时故障；月度 schedule 下
      那就是缺一个月且无人知晓）。低频源在自己的 manifest 里写
      `backoff_limit: 3`，模板据此抬重试；不写就是 1，行为不变。
      */}}
      {{- /* 兼容两种入参名：manifest 侧 snake_case、AppSet 侧 camelCase */}}
      backoffLimit: {{ .Values.backoffLimit | default .Values.backoff_limit | default 1 }}
      template:
        metadata:
          labels:
            fd-industry/source: {{ .Values.source }}
        spec:
          restartPolicy: Never
          initContainers:
            # Same image as the runner: it ships git, and the node only needs
            # to pull one image (public mirrors are unreachable from chengsi).
            - name: checkout
              image: {{ .Values.image }}
              env:
                - name: GITEE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.gitTokenSecret }}
                      key: token
              command:
                - sh
                - -c
                - |
                  set -e
                  # 成本埋点（harden-crawl-delivery 5.1）：clone 与 pod 启动的耗时
                  # 只有这里看得见 —— runner 起来时 clone 已经结束。写进 /content/.timings，
                  # runner 读到就并入 crawl_runs.metrics，读不到就不写该键（不填 0）。
                  #
                  # 必须用 POSIX 的 date +%s，不能用 bash 的 $SECONDS：init 容器跑的是
                  # `sh -c`（dash），$SECONDS 在 dash 里为空，写出来是 `clone_seconds=`，
                  # runner 端 float("") 抛错后静默跳过 —— 实测 2026-11-09 首版就是这样
                  # 一条都没有落库。
                  _T0=$(date +%s)
                  # 不用 --filter=blob:none（2026-11-13 实测）：部分克隆把 `sparse-checkout set`
                  # 变成了对 gitee 的 promisor 懒拉取，而那一跳经常抖——三个源分别死在
                  # `curl 56 GnuTLS recv error (-110)` ×2 与 `HTTP 504`，全都卡在同一个
                  # blob（`fd_industry_data/__init__.py`，小文件，不是体积问题）。
                  # 本仓 size-pack 只有 3.4MiB，filter 省不下什么，却把一次 fetch 拆成了
                  # 「先拿树、再逐个懒取 blob」，失败面反而变大。故整包一次取完。
                  # 重试三次兜 TLS 抖动：并发会话/网关抖动是瞬时故障，不该让一次抓取失败。
                  _n=0
                  until git clone --depth 1 --sparse \
                      "https://FindDataTechnology:${GITEE_TOKEN}@gitee.com/FindDataTechnology/fd-industry-data.git" /content
                  do
                    _n=$((_n + 1))
                    if [ "$_n" -ge 3 ]; then
                      echo "clone failed after ${_n} attempts" >&2
                      exit 1
                    fi
                    echo "clone attempt ${_n} failed, retrying in 5s" >&2
                    rm -rf /content
                    sleep 5
                  done
                  cd /content
                  # spiders/ 是爬虫本体；fd_industry_data/ 与 universes/ 是**运行时依赖**：
                  # 部分单元在模块作用域 import `fd_industry_data.universes`（车道默认宇宙，
                  # 真源是仓库根的 universes/*.yaml）。只检 spiders/ 会让这些单元在镜像
                  # 尚未包含该模块时直接 ImportError——实测 2026-11-08
                  # fd-industry-eastmoney-disclosure-plan 连续两次失败。
                  git sparse-checkout set spiders/ fd_industry_data/ universes/
                  git rev-parse HEAD > /content/.commit
                  _T1=$(date +%s)
                  printf 'clone_seconds=%s\npod_start_to_first_row_seconds=%s\n' \
                    "$((_T1 - _T0))" "$((_T1 - _T0))" > /content/.timings
              volumeMounts:
                - name: content
                  mountPath: /content
          containers:
            - name: runner
              image: {{ .Values.image }}
              args: ["{{ .Values.source }}", "--limit", "{{ .Values.limit | default 100 }}", "--window-auto"]
              workingDir: /content
              env:
                - name: FD_CONTENT_DIR
                  value: /content/spiders
                # 注册表显式指到 checkout，而不是靠 registry_root() 自己摸：
                # pip 安装后 fd_industry_data 在 site-packages，而 universes/ 只存在于
                # /content（initContainer sparse-checkout）与镜像的 /app —— 从 __file__
                # 向上找永远命不中 site-packages 那一串。实测 2026-11-08/09/10
                # eastmoney-disclosure-plan 连续四次 UniverseRegistryError。
                # 代码侧也已让 registry_root() 追加「进程工作目录祖先」，此变量是
                # 对现役镜像（尚未含该修复）的兜底，出片后可保留无害。
                - name: FD_UNIVERSE_DIR
                  value: /content/universes
                - name: FD_CONTENT_COMMIT
                  value: /content/.commit
                - name: FD_IMAGE_TAG
                  value: {{ .Values.image | quote }}
                - name: FD_CRAWL_DB_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.dbSecret | default "fd-industry-db" }}
                      key: url
                - name: FD_SCHEMA_MANAGED
                  value: "1"
                {{- /* 落库上限（writer cap）与行数上限同步。
                       背景：writer 默认只落 1000 行（FD_WRITER_MAX_ITEMS 缺省 1000），
                       而 `--limit` 只控制"单元返回多少行"，不控制"能落多少行"。
                       实测 2026-11-11：mct-star-hotel 声明 limit: 20000、runner 报
                       rows_written=8482，但 crawl_items 只有 1000 行；本批的
                       nrdl-national-catalog（年度快照 3911 行）同样会被截到 1000。
                       因此当源声明的 limit ≥ 1000（快照类源的特征）时，把落库上限
                       抬到同一个值；limit 缺省（100）或较小的增量源**行为完全不变**，
                       避免影响既有的 160+ 源。 */ -}}
                {{- $lim := .Values.limit | default "" }}
                {{- if and $lim (ne (toString $lim) "<no value>") (ge (int (toString $lim)) 1000) }}
                - name: FD_WRITER_MAX_ITEMS
                  value: {{ $lim | quote }}
                {{- end }}
              # Wave B keyed 源：密钥经集群 secret 注入（fd-industry ns 手工维护，
              # 轮换=覆盖该 secret 即生效；非 git 内容，不在本清单内声明值）
              envFrom:
                - secretRef:
                    name: fd-industry-source-keys
                    optional: true
                {{- $egressSecret := .Values.egressSecret | default "" }}
                {{- if and $egressSecret (ne $egressSecret "<no value>") }}
                - secretRef:
                    name: {{ $egressSecret }}
                    optional: true
                {{- end }}
              resources:
                limits:
                  memory: {{ .Values.memoryLimit | default "384Mi" }}
                  cpu: {{ .Values.cpuLimit | default "300m" }}
                requests:
                  memory: {{ .Values.memoryLimit | default "384Mi" }}
                  cpu: 100m
              volumeMounts:
                - name: content
                  mountPath: /content
          volumes:
            - name: content
              emptyDir: {}
{{- end }}
