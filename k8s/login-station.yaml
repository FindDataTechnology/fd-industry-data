# Login station (login-station-console): Job template + RBAC + env secrets.
#
# Stations run on xinru-master (fd-mcp ns) so the panel — same cluster — can
# reverse-proxy the noVNC channel without any NodePort/public exposure.
# The panel creates one Job per login request via its own ServiceAccount
# (station-launcher RBAC below) and tracks it in crawl_login_stations.
#
# One-time setup on xinru-master:
#   sudo k3s kubectl apply -f login-station.yaml        (RBAC + secrets refs)
#   # secrets (fd-mcp ns): fd-industry-db / fd-industry-rustfs /
#   # platform-session-key — same values as tencent; created at deploy time.
apiVersion: v1
kind: ServiceAccount
metadata: {name: station-launcher, namespace: fd-mcp}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: station-launcher, namespace: fd-mcp}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: station-launcher, namespace: fd-mcp}
subjects:
  - {kind: ServiceAccount, name: fd-panel, namespace: fd-mcp}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: station-launcher}
---
# Station Job template (rendered by the panel per login request):
#   name: login-<src>-<alias>-<rand>, namespace: fd-mcp
#   image: runner (station-capable tag)
#   command: ["python3", "scripts/login_station.py", "--station", "<src>", "<alias>"]
#   env: FD_CRAWL_DB_URL/RUSTFS_*/PLATFORM_SESSION_KEY (secrets),
#        STATION_ID, PROXY_URL (identity egress), FD_SCHEMA_MANAGED=1,
#        FD_STATION_DEADLINE_SECONDS=1500
#   + a ClusterIP Service selecting the job pod, port 6080 (noVNC web),
#     which the panel reverse-proxies at /panel/auth/station/<id>/
