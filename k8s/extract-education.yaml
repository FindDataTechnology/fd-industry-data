# education 目录传导桥（change automate-education-catalog-ingest）
#
# 把五个 education 源的 `crawl_items` 传导进对外目录
# `education_catalog.catalog_items`。**为什么必须有这个 CronJob**：采集 CronJob
# 天天跑、天天报 success，但目录此前只有两个手工脚本写入，停在 2026-11-04——
# 采集侧 success 而目录 18 天不动，正是「目录新鲜度经源原生增量维持」这条 spec
# 要防的静默断链。
#
# 部署在 `mcp` 命名空间（与 fd-pharma-observations 同理）：写 `education_catalog`
# 需 `fd` 角色，其 DSN 已在 `mcp/fd-mcp-env`；建在 fd-industry 就要复制凭据。
#
# 脚本从 ConfigMap 来（`scripts/render_extract_education_configmap.py` 渲染，
# 打包 extract_education.py + _semextract.py + edu_catalog/normalize.py），
# pod 不碰 git、不用 gitee token。
#
# 部署（两个文件一起 apply）：
#   python3 scripts/render_extract_education_configmap.py     # 脚本改了就重渲染
#   scp k8s/extract-education-configmap.yaml k8s/extract-education.yaml fd-deploy:/tmp/ \
#     && ssh fd-deploy "sudo k3s kubectl apply \
#          -f /tmp/extract-education-configmap.yaml -f /tmp/extract-education.yaml"
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fd-education-catalog-ingest
  namespace: mcp
  labels:
    fd-industry/component: education-catalog-ingest
spec:
  # 每日 06:30（Asia/Shanghai）：五个采集源里日更的 oa-fulltext 在 04:42、podcast 每 6h；
  # 06:30 落在日更之后，覆盖当夜产出；oer（周一）/openalex（月）/cc-courses（月）按各自
  # 节奏采回后的次日即被传导。日更廉价（读约 6k crawl_items、upsert 数百行，秒级）。
  schedule: "30 6 * * *"
  timeZone: "Asia/Shanghai"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 1
      template:
        metadata:
          labels:
            fd-industry/component: education-catalog-ingest
        spec:
          restartPolicy: Never
          containers:
            - name: ingest
              image: ccr.ccs.tencentyun.com/finddata/fd-industry-runner:sha-d99474d
              command: ["python3", "/src/scripts/extract_education.py", "--apply"]
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: PYTHONPATH
                  value: "/src"
                # 写 education_catalog 需要 `fd` 角色（与 pharma 抽取同源：fd-mcp-env）
                - name: FD_OPEN_DATA_DSN
                  valueFrom:
                    secretKeyRef:
                      name: fd-mcp-env
                      key: FD_OPEN_DATA_MCP_DATABASE_URL
              resources:
                limits:
                  memory: 256Mi
                  cpu: 300m
                requests:
                  memory: 128Mi
                  cpu: 100m
              volumeMounts:
                - name: src
                  mountPath: /src
                  readOnly: true
          volumes:
            - name: src
              configMap:
                name: fd-education-ingest-src
                items:
                  - key: extract_education.py
                    path: scripts/extract_education.py
                  - key: _semextract.py
                    path: scripts/_semextract.py
                  - key: normalize.py
                    path: edu_catalog/normalize.py
