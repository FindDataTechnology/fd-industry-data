# Site dispatcher for the legal-line site (legal-line-federation 3.3): pulls
# pending exception runs for its site and executes registered federated
# members (kind='federated' + runner declaration in crawl_sources) as batch/v1
# Jobs in this namespace via the in-cluster service account. Platform-native
# sources are not claimed by this site. One-time secrets:
#   (already present: secret federation-db, key url — same central PG url as
#    tencent fd-industry-db / scraw federation-db)
#   platform-session-key (key: key) — Fernet key of the identity pool, same
#     value as tencent fd-industry / xinru fd-mcp; the dispatcher decodes the
#     leased identity's session jar with it
#   flk-law-crawl-credentials (keys: rustfs-access-key / rustfs-secret-key) —
#     RustFS credentials for the platform-sessions jar store, already used by
#     the law-line CronJobs in this namespace; the dispatcher reads jars from
#     the same RustFS endpoint (100.64.0.11:9000, as tencent fd-industry-rustfs)
# Deploy with (manifest only — do not apply from CI):
#   scp k8s/xinru-dispatcher.yaml fd-deploy:/tmp/ && ssh fd-deploy \
#     "sudo k3s kubectl apply -f /tmp/xinru-dispatcher.yaml"
# The image tag must be bumped together with the runner image (the shared
# dispatch lib ships inside the image — design D3).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fd-dispatcher
  namespace: scraw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fd-dispatcher
  namespace: scraw
rules:
  # gate (list), poll (get), create, cancel (delete) — federated Jobs only
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fd-dispatcher
  namespace: scraw
subjects:
  - kind: ServiceAccount
    name: fd-dispatcher
    namespace: scraw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fd-dispatcher
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fd-industry-dispatcher
  namespace: scraw
  labels:
    fd-industry/component: dispatcher
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # must cover the largest declared timeout_seconds: the tick babysits its
      # Jobs to terminal state; a killed tick leaves the row to lease expiry
      activeDeadlineSeconds: 7200
      backoffLimit: 1
      template:
        metadata:
          labels:
            fd-industry/component: dispatcher
            # observer exclusion: tick Jobs direct-report nothing and are not
            # legacy workloads — the federation observer must never mirror them
            fd-industry/managed-by: fd-dispatcher
        spec:
          serviceAccountName: fd-dispatcher
          restartPolicy: Never
          containers:
            - name: dispatcher
              image: ccr.ccs.tencentyun.com/finddata/fd-industry-runner:sha-8f734c7
              command: ["python3", "-m", "fd_industry_data.dispatcher_cli"]
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: FD_SCHEMA_MANAGED
                  value: "1"
                - name: FD_DISPATCH_SITE
                  value: xinru-server1
                - name: FD_DISPATCH_MAX_RUNS
                  value: "5"
                - name: FD_DISPATCH_NAMESPACE
                  value: scraw
                - name: FD_CRAWL_DB_URL
                  valueFrom:
                    secretKeyRef:
                      name: federation-db
                      key: url
                # identity pool (task 3.2): dispatcher leases a session
                # identity for profiled federated sources and inlines its jar
                # into the Job env; the Fernet key + RustFS credentials
                # mirror the tencent dispatcher (same jar store, same key).
                - name: PLATFORM_SESSION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: platform-session-key
                      key: key
                - name: RUSTFS_ENDPOINT
                  value: "http://100.64.0.11:9000"
                - name: RUSTFS_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: flk-law-crawl-credentials
                      key: rustfs-access-key
                - name: RUSTFS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: flk-law-crawl-credentials
                      key: rustfs-secret-key
              resources:
                # registration hard gate: every workload on the exemption host
                # carries limits (industry-crawl-gitops, legal-line-federation D6)
                limits:
                  memory: 256Mi
                  cpu: 500m
                requests:
                  memory: 128Mi
                  cpu: 100m
