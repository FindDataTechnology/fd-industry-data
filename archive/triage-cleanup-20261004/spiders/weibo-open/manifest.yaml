name: weibo-open
label: 微博开放平台(Weibo Open Platform)
source_url: https://open.weibo.com/
description: 微博热搜话题、公开帖子、用户影响力数据
authentication: partial
access_level: public_web_only
authentication_details: |
  PUBLIC (this spider):
  - Weibo hot search / trending topics (s.weibo.com/top/summary)
  - Public user profiles and posts
  - Public topic/hashtag pages
  
  REQUIRES API KEY (not covered by this spider):
  - Full search API - needs Open Platform developer registration
  - User timeline API - needs OAuth2 authorization
  - Comments/reposts API - needs OAuth2
  - Direct messages - needs OAuth2
  - Real-time data stream - needs special permission
  
  API Registration: https://open.weibo.com/
  API Docs: https://open.weibo.com/wiki/API
rate_limiting:
  download_delay: 2.0
  concurrent_requests: 3
  robots_txt_obey: true
functions:
  - command: WeiboOpenSpider
    description: 爬取微博热搜、公开帖子、用户信息
    category: social-media
    frequency: realtime
    columns:
      - name: url
        type: str
        description: 来源URL
      - name: topic
        type: str
        description: 话题/热搜关键词
      - name: rank
        type: str
        description: 热搜排名
      - name: hot_value
        type: str
        description: 热度值
      - name: author
        type: str
        description: 作者
      - name: content
        type: str
        description: 内容
      - name: reposts
        type: str
        description: 转发数
      - name: comments
        type: str
        description: 评论数
      - name: likes
        type: str
        description: 点赞数
      - name: data_type
        type: str
        description: 数据类型(hot_search/topic_page/profile/post)
      - name: scraped_at
        type: str
        description: 爬取时间
