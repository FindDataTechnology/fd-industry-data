name: csia-software-industry
label: 中国软件行业协会 - 软件产业数据
source_url: http://www.csia.org.cn/
score: 85
authentication: none
access_level: public
authentication_details: |
  All data is publicly available on the CSIA website.
  No API key or registration required.
  
  PUBLIC (this spider):
  - Software industry statistics (软件业务收入、出口)
  - IT service market data
  - Software enterprise rankings (百强企业)
  - Industry development reports
  - Policy documents and standards
  
  NOTES:
  - Monthly software industry data from MIIT
  - Annual software top-100 enterprise rankings
  - Software industry development reports
  - Technology trend analysis
  
  Website: http://www.csia.org.cn/
  Statistics: http://www.csia.org.cn/index/statistics
rate_limiting:
  download_delay: 2.0
  concurrent_requests: 3
  robots_txt_obey: true
functions:
  - command: CSIASpider
    description: 获取软件产业统计数据（收入、出口、从业人员、企业数量）
    category: software-industry
    frequency: monthly
    columns:
      - name: stat_period
        type: str
        description: 统计期（如"2024年3月"）
      - name: indicator_name
        type: str
        description: 指标英文名
      - name: indicator_name_cn
        type: str
        description: 指标中文名
      - name: value
        type: float
        description: 数值
      - name: unit
        type: str
        description: 单位（亿元、亿美元、万人等）
      - name: category
        type: str
        description: 类别(software_industry/table_data)
      - name: sub_category
        type: str
        description: 子类别(revenue/exports/employment/enterprises)
  - command: EnterpriseRanking
    description: 获取软件企业排行榜（百强企业）
    category: enterprise-ranking
    frequency: annual
    columns:
      - name: enterprise_name
        type: str
        description: 企业名称
      - name: ranking
        type: int
        description: 排名
      - name: category
        type: str
        description: 类别(top100/it_service/info_service)
      - name: revenue
        type: float
        description: 收入
      - name: revenue_unit
        type: str
        description: 收入单位
      - name: stat_year
        type: str
        description: 统计年份
  - command: ReportIndexer
    description: 索引CSIA发布的行业报告
    category: reports
    frequency: realtime
    columns:
      - name: title
        type: str
        description: 报告标题
      - name: publish_date
        type: str
        description: 发布日期
      - name: report_type
        type: str
        description: 报告类型(white_paper/blue_book/ranking/research_report)
      - name: category
        type: str
        description: 领域(software/it_service/info_service/security)
