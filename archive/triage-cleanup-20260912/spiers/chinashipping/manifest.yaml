name: chinashipping
label: 中国船东协会数据
source_url: http://www.chinashipping.org.cn/
description: 航运业数据、船队统计、贸易航线数据、市场分析
functions:
  - command: get_chinashipping_data
    description: 获取航运市场指数、船队统计和贸易航线数据
    category: industry-data
    frequency: weekly
    columns:
      market:
        - name: period
          type: str
          description: 统计期间
        - name: indicator
          type: str
          description: 指标名称（英文，如ccfi/cbfi）
        - name: indicator_cn
          type: str
          description: 指标名称（中文）
        - name: value
          type: float
          description: 指数值（点）
        - name: unit
          type: str
          description: 单位（点）
        - name: change_value
          type: float
          description: 变动值
        - name: route
          type: str
          description: 航线（英文）
        - name: route_cn
          type: str
          description: 航线（中文）
      fleet:
        - name: period
          type: str
          description: 统计期间
        - name: ship_type
          type: str
          description: 船舶类型（英文）
        - name: ship_type_cn
          type: str
          description: 船舶类型（中文）
        - name: vessel_count
          type: int
          description: 船舶数量（艘）
        - name: deadweight
          type: float
          description: 载重吨
        - name: dw_unit
          type: str
          description: 载重吨单位
        - name: growth_rate
          type: float
          description: 同比增长率
      trade:
        - name: period
          type: str
          description: 统计期间
        - name: route
          type: str
          description: 航线（英文）
        - name: route_cn
          type: str
          description: 航线（中文）
        - name: cargo_type
          type: str
          description: 货物类型（英文）
        - name: cargo_type_cn
          type: str
          description: 货物类型（中文）
        - name: value
          type: float
          description: 数值
        - name: unit
          type: str
          description: 单位（万TEU/万吨/亿吨）
        - name: growth_rate
          type: float
          description: 同比增长率
      news:
        - name: date
          type: str
          description: 发布日期
        - name: title
          type: str
          description: 标题
        - name: content
          type: str
          description: 内容摘要
        - name: category
          type: str
          description: 类别（news/market/shipping/policy/trade/port）
