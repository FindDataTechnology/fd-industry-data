version: "1"
# Canonical run-site registry (crawl-platform federated dispatch).
# `site` in spiders/<src>/manifest.yaml must name an id below; absent site
# means the default (tencent). Adding a site is a shared-lib change and
# ships with the runner image (design D3); re-seed crawl_sites after.
sites:
  - id: tencent
    kind: k8s
    description: 主力 k8s 站点（单节点）— ApplicationSet CronJob + dispatcher
  - id: nbs-workers
    kind: docker
    description: 四机 docker worker 舰队 — coordinator 认领
  - id: zihan
    kind: docker
    description: 一台 docker worker — 与业务服务共存，限资源共享
  - id: xinru-server1
    kind: docker
    description: 一台 docker worker — 独立 k3s 空载，仅 docker 认领
  - id: xinru-server2
    kind: docker
    description: 一台 docker worker — 与代理/遗留 PG 共存，直连出口
  - id: xinru-master
    kind: k8s
    description: k8s 协调站点 — dispatcher 与 federation-observer 驻此（法律线宿主，资源限额硬闸为前提）
