version: "2"
name: pboc-inclusive          # = spiders/pboc-inclusive/ 目录名，运行时标识符，合入后不可改名
label: PBOC Inclusive Finance Statistics (Microloan / Household Credit / Regional AFRE)
source_url: https://www.pbc.gov.cn/diaochatongjisi/116219/116225/index.html
# site: tencent              # 缺省 tencent；本单元只访问 www.pbc.gov.cn 公开静态页与 xlsx，无需换执行位
scanner_mode: upstream-curated
functions:
  - command: run_pboc_inclusive
    description: Fetch PBOC inclusive-finance indicators — quarterly microloan company count/outstanding loans, monthly financial statistics (household loans, RMB loan/deposit balances, AFRE stock, M0/M1/M2) and quarterly provincial AFRE flow tables
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum number of indicator rows to return (newest report first, round-robin across the three report channels)
    columns:
      - name: indicator
        type: string
        description: Indicator name, e.g. 小额贷款公司机构数 / 小额贷款公司贷款余额 / 住户贷款 / 人民币贷款余额 / 地区社会融资规模增量
      - name: period
        type: string
        description: Observation period as YYYY-MM (monthly), YYYYNq/YYYYHN (quarterly/half-yearly) or YYYY (annual)
      - name: value
        type: float
        description: Value as published; microloan/household-credit flows in 亿元, balances and monetary aggregates in 万亿元, microloan count in 家. Flow figures are absolute values (direction verb 增加/减少 not encoded)
      - name: unit
        type: string
        description: Unit as declared in the source (亿元 / 万亿元 / 家)
      - name: category
        type: string
        description: One of 小额贷款公司统计 / 金融统计月报 / 地区社融
      - name: region
        type: string
        description: 全国 for national indicators; province name for 地区社融 rows
      - name: report_title
        type: string
        description: Title of the source report as published
      - name: report_url
        type: string
        description: Source report URL for the row
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: value
    concept: economic.indicator_value
    entity_type: country
    measure: value
    unit: cny_hundred_million
    frequency: monthly
entities:
  - entity_type: country
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
