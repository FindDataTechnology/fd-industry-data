version: '1'
name: gtarsc
label: 中国热带农业信息网 (GTARSC)
source_url: https://www.gtarsc.com
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: get_gtarsc_data
  description: Scrape tropical agriculture research data from GTARSC
  frequency: monthly
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  - name: urls
    type: list
    required: false
    description: Custom URLs to scrape
  columns:
  - name: title
    type: str
    description: Article or data title
  - name: description
    type: str
    description: Description text
  - name: url
    type: str
    description: Source URL
  - name: source
    type: str
    description: Data source identifier
  - name: scraped_at
    type: str
    description: Scrape timestamp
concepts:
- column: title
  concept: agriculture.tropical_research
  entity_type: industry
  measure: value
  unit: string
  frequency: monthly
entities:
- entity_type: industry
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
