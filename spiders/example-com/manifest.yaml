version: "2"
name: example-com              # = spiders/<slug>/ 目录名，合入后不可改名
label: Example Domain public page titles
source_url: https://example.com/
# site: 不写 —— 走默认执行位（sites.yaml 是执行位登记，与源站无关）
# schedule: 不写 —— 静默合入；点亮（daily）由人工在收口时补写
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_example_com
    description: Fetch public page titles from the example.com sample site
    frequency: on_demand
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: title
        type: string
        description: Page <title> text as published by the site
      - name: url
        type: string
        description: Absolute URL the title was read from
      - name: source
        type: string
        description: Constant source label (example.com)
      - name: scraped_at
        type: string
        description: Scrape timestamp (UTC ISO8601)
concepts: []
entities: []
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
