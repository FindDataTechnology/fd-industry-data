# parked 2026-11-08 (audit-ponytail 05 §1): this unit is a copy of the
# metadata template — its production entry only scrapes the homepage
# title/meta description and reports it as source data. No real parser
# exists, so it is off (parked + no schedule + enabled: false) rather
# than producing healthy-looking empty shells. Re-enable only with a
# real extractor.
version: '1'
name: data
label: 中国政府数据
source_url: https://data.cn.gov.cn/
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: run_data
  description: Fetch metadata and dataset listings from CN government data portal
  frequency: on_demand
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  columns:
  - name: title
    type: str
    description: Dataset or page title
  - name: description
    type: str
    description: Dataset or page description
  - name: url
    type: str
    description: Source URL
  - name: source
    type: str
    description: Data source name
  - name: scraped_at
    type: str
    description: ISO timestamp of extraction
concepts:
- column: title
  concept: document.title
  entity_type: organization
  measure: value
  unit: string
  frequency: on_demand
entities:
- entity_type: organization
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
parked: true
enabled: false