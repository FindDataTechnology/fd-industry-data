name: zce
version: 1.0.0
description: Zhengzhou Commodity Exchange (郑州商品交易所) agricultural and chemical futures scraper
source: https://www.czce.com.cn
author: FindData Official
license: MIT

spider:
  class: ZCESpider
  module: spider
  entry_point: spider.py

data_sources:
  - name: 农产品期货
    category: agricultural
    products:
      - 棉花 (Cotton)
      - 白糖 (Sugar)
      - PTA
      - 甲醇 (Methanol)
      - PP (聚丙烯)
      - 苹果 (Apple)
      - 红枣 (Jujube dates)
    
  - name: 化工品期货
    category: chemicals
    products:
      - 短纤 (Short fiber)
      - 聚酯链 (Polyester chain)
      - CA (共聚甲醛)
    
  - name: 煤炭焦炭
    category: coal_coke
    products:
      - 动力煤 (Thermal coal)
      - 焦炭 (Coke)
      - 甲醇 (Methanol)
    
  - name: 市场概况
    category: market_overview
    description: Market statistics and overview data
    
  - name: 经济资讯
    category: economic_news
    description: Economic indicator news and reports

output:
  database: data/zce_prices.db
  json: output/
  schema:
    tables:
      - name: agricultural_spot
        description: Agricultural spot prices
      - name: agricultural_futures
        description: Agricultural futures pricing data
      - name: chemicals_spot
        description: Chemical product spot prices
      - name: chemicals_futures
        description: Chemical product futures pricing
      - name: coal_coke_spot
        description: Coal and coke spot prices
      - name: coal_coke_futures
        description: Coal and coke futures pricing
      - name: market_overview
        description: Market overview statistics
      - name: economic_news
        description: Economic news articles

settings:
  concurrent_requests: 2
  download_delay: 3.0
  max_retries: 3
  robots_txt_obey: true
  timeout: 30
  allowed_domains:
    - czce.com.cn

features:
  - pagination
  - spot_and_futures_extraction
  - sqlite_storage
  - json_export
  - rate_limiting
  - deduplication
  - category_identification
  - dynamic_schema

anti_bot:
  user_agent_rotation: true
  session_impersonation: chrome
  randomized_delays: true
  min_delay: 2.0
  max_delay: 5.0

dependencies:
  - scrapling>=0.4.7
  - python>=3.10

last_updated: 2026-07-31
status: active
priority: high
