version: "1"
name: cqvip
label: 维普资讯
source_url: https://www.cqvip.com/
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_cqvip
    description: Fetch metadata and document listings from CQVIP (维普资讯)
    frequency: on_demand
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: title
        type: str
        description: Document or page title
      - name: description
        type: str
        description: Page or document description
      - name: url
        type: str
        description: Source URL
      - name: source
        type: str
        description: Data source name
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
concepts:
  - column: title
    concept: document.title
    entity_type: organization
    measure: value
    unit: string
    frequency: on_demand
entities:
  - entity_type: organization
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
