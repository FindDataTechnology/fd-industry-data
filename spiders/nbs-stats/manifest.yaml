name: nbs-stats
schedule: "11 4 4,14,24 * *"
label: 国家统计局综合数据
source_url: https://www.stats.gov.cn/
data_url: https://data.stats.gov.cn/
description: |
  国家统计局官方统计数据，包括GDP、CPI/PPI、工业生产、人口就业等宏观经济指标。
  National Bureau of Statistics comprehensive data including GDP, CPI/PPI,
  industrial production, population and employment indicators.
  另含流通领域重要生产资料市场价格（旬度，stats.gov.cn /sj/zxfb/ 文章内联表）。

authentication:
  required: false
  type: none
  notes: |
    公开数据，无需登录。通过 data.stats.gov.cn/easyquery.htm API 获取。
    Public data, no login required. Data fetched via easyquery API.

rate_limiting:
  download_delay: 2
  concurrent_requests: 1
  notes: 建议2秒延迟，避免对服务器造成压力

anti_bot:
  method: browser_impersonation
  details: Chrome browser impersonation via curl_cffi with proper headers

functions:
  - command: run_nbs_stats
    description: "fd-runner 唯一入口：两条相互隔离路径——easyquery 宏观指标（GDP/CPI/PPI/工业/人口/就业）+ 流通领域生产资料价格（旬度）。注：data.stats.gov.cn 对部分出口段 WAF 403（实测家宽 IPv4/IPv6 均 403），生产 tencent 站正常；两路径隔离，单路径失败自动降级不拖死另一条"
    category: macro-economic
    frequency: monthly
    parameters:
      - name: categories
        type: list
        required: false
        description: "数据类别列表，缺省 = 全部五类。可选：gdp（GDP数据 季度/年度/分省）、price_indices（CPI/PPI价格指数）、industrial（工业生产与PMI）、population（人口数据）、employment（就业数据）"
      - name: start_year
        type: int
        required: false
        description: 起始年份（默认 2010）

  - command: get_circulation_prices
    description: |
      流通领域重要生产资料市场价格变动情况（旬度发布，每期约50品种；
      实测类别分组为：黑色金属/有色金属/化工产品/煤炭/石油天然气/
      非金属矿物制品/农业生产资料/农产品/林产品）。解析 stats.gov.cn
      「最新发布」文章内联 HTML 表格，最新一期在前。
    category: macro-economic
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: 最多返回行数（默认 100）
    columns:
      - name: period
        type: str
        description: 旬区间（如 2026-09-11~2026-09-20）
      - name: category
        type: str
        description: 品类分组（取自文章表内分类行）
      - name: product_name
        type: str
        description: 产品名称（含规格型号）
      - name: price
        type: float
        description: 本期价格（元）；「—」/空记 null
      - name: price_unit
        type: str
        description: 计价单位（吨、千克等，取自「单位」列）
      - name: price_change
        type: float
        description: 比上期价格涨跌（元）；「—」/空记 null
      - name: mom_pct
        type: str
        description: 涨跌幅（%，比上期）；「—」/空记 null
      - name: yoy_pct
        type: str
        description: 同比涨幅（%，当前表头无此列，恒为 null，留作表头扩展）
      - name: scraped_at
        type: str
        description: 抓取时间（ISO格式）
      - name: source_url
        type: str
        description: 文章 URL（www.stats.gov.cn/sj/zxfb/…）

columns:
  - name: period
    type: str
    description: 统计期间（如 2024Q1, 2024-01, 2024）
  - name: category
    type: str
    description: 数据类别（gdp, price_indices, industrial, population, employment）
  - name: indicator_type
    type: str
    description: 指标类型（如 quarterly, annual, cpi_monthly）
  - name: value
    type: float
    description: 指标数值
  - name: indicator_code
    type: str
    description: 指标代码（NBS内部编码）
  - name: indicator_name
    type: str
    description: 指标名称（中文）
  - name: unit
    type: str
    description: 单位（亿元, %, 万人等）
  - name: frequency
    type: str
    description: 频率（Q=季度, A=年度, M=月度）
  - name: source
    type: str
    description: 数据来源（NBS 或 akshare）
  - name: fetched_at
    type: str
    description: 抓取时间（ISO格式）

output:
  sqlite:
    path: data/nbs_stats.db
    table: nbs_indicators
  json:
    - path: output/nbs_gdp.json
      description: GDP数据
    - path: output/nbs_price_indices.json
      description: 价格指数
    - path: output/nbs_industrial.json
      description: 工业生产数据
    - path: output/nbs_population.json
      description: 人口数据
    - path: output/nbs_employment.json
      description: 就业数据
