version: "2"
name: usaspending-awards    # = spiders/usaspending-awards/ 目录名，运行时标识符，合入后不可改名
label: USAspending Federal Contract Awards (monthly NAICS x agency aggregates)
source_url: "https://api.usaspending.gov/api/v2/search/spending_by_award/ (portal: https://www.usaspending.gov/)"
data_period: month
# schedule: 2026-11-11 点亮（独立提交，非交付提交）。依据：双门绿（validate_manifests 165/0、
#   conformance 167/0）+ 集群内实测出口可达（platform pod 直连 api.usaspending.gov 200/1.1s）
#   + 三条解锁条件（窗口覆盖滞后期 / 部分和口径定稿 / 首爬验证）前两条已满足，第三条由本次点亮后的首爬提供。
#   每月 14 日 03:17，与 openfda(26 日)/nifdc(10 日)/clinicaltrials(9 日)/clinicaltrials-cn(6 日) 错开。
schedule: "17 3 14 * *"
# 每轮取数上限。**模板默认 100 会把滚动窗截成前 100 行**（本仓已修过的同类缺陷：
# 低频源：一次抖动就是整窗空档（月/季/年），故给 3 次重试。
backoff_limit: 3
# docs/flower-debt-ledger.md F20 —— 首次运行 rows_written=100 恰好等于 limit，只覆盖 5 天）。
# 实测本单元真实行数（2026-11-11，limit 不截断）：
#   · 滚动 6 个月（常态窗口）      = 2,936 行  → limit=100 会丢掉 96.6%
#   · 首爬 12 整月（回补窗口）      = 5,567 行 / 668s
#   按月分布 434~535（近期月份行数更多：奖项少但 (naics,部门) 组合更散）
# 故取 8000（首爬 5,567 的 1.44 倍余量，容忍后续组合数增长）。
# 落库第二道闸：writer 默认 FD_WRITER_MAX_ITEMS=1000，但**带窗口的运行会被 runner
# 抬到 100000**（fix-writer-item-cap），故窗口运行不会被这里之外的上限二次截断。
limit: 8000
# site: 未写——公共 API 直连（无墙），无需离开 tencent
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_usaspending_awards
    description: "Aggregate USAspending federal contract awards (award_type_codes A/B/C/D, monthly window, top awards by amount, max 3 pages x 100 per type-month) client-side into monthly NAICS x awarding-department obligated_amount signal rows via the unauthenticated POST /api/v2/search/spending_by_award/ endpoint"
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: "Maximum number of aggregate rows to return; window filter is applied before truncation (default 100)"
      - name: window_start
        type: string
        required: false
        description: "Window start (YYYY-MM-DD or YYYY-MM), paired with window_end; default = first day of the rolling 6-month window ending at the last complete calendar month (upstream reporting lag: the newest month holds ~15% of its eventual volume, so months are re-fetched and converge instead of being captured once)"
      - name: window_end
        type: string
        required: false
        description: "Window end (YYYY-MM-DD or YYYY-MM), paired with window_start"
    columns:
      - name: award_type
        type: string
        description: "Requested contract award_type_codes class of the batch (A/B/C/D raw code, no interpretation)"
      - name: naics_code
        type: string
        description: "NAICS industry code of the awards in the group (empty string if unclassified)"
      - name: agency_name
        type: string
        description: "Top-level awarding department (Awarding Agency)"
      - name: obligated_amount
        type: float
        description: "Sum of Award Amount (USD) over awards in the (award_type, NAICS, agency) group, rounded to 2 decimals; partial sum over top pages only (max 3 pages x 100 per type-month, amount desc)"
      - name: award_count
        type: int
        description: "Number of distinct awards (by Award ID) aggregated into the group"
      - name: page_cap_reached
        type: bool
        description: "True when this (award_type, month) batch was TRUNCATED by the page cap: the last fetched page still reported hasNext, so obligated_amount is a head sample (top awards by amount) rather than the group's full total. Consumers MUST read obligated_amount as a sample sum when this is true — it is a lower bound, never a total. Precedent: spiders/hf-datasets declares sampled_total for the same reason."
      - name: batch_total_awards
        type: int
        description: "Full award count for the (award_type, month) batch, from /search/spending_by_award_count/ — the DENOMINATOR for coverage: sum(award_count) over rows of that batch / batch_total_awards = count coverage. null = unknown (the count call failed); null is NOT zero and must not be rendered as 0. Measured example (2026-10, type A): 297 sampled of 35,031 = 0.85% count coverage — the sample is amount-sorted, so AMOUNT coverage is higher but is deliberately not claimed because it was never measured."
      - name: period
        type: string
        description: "Aggregation month (YYYY-MM), the requested window month rather than any single award start date"
      - name: url
        type: string
        description: "Source request URL for the row"
      - name: source
        type: string
        description: "Data source identifier"
      - name: scraped_at
        type: string
        description: "ISO timestamp of the fetch"
concepts:
  # 新命名空间 government.*：统一指标注册目录治理另走（templates/new-source/CHECKLIST.md 末条），
  # 不阻塞取数本身
  - column: obligated_amount
    concept: government.obligated_amount
    entity_type: industry
    measure: value
    unit: USD
    frequency: monthly
entities:
  - entity_type: industry
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
# 接入声明
revision_policy: overwrite_with_history
coverage_capability: gaps_only
