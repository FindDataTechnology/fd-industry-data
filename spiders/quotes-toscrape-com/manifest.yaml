version: "2"
name: quotes-toscrape-com        # = spiders/<slug>/ 目录名，运行时标识符，合入后不可改名
label: Quotes to Scrape (public practice site, quotes listing)
source_url: https://quotes.toscrape.com/
# site: 不写 —— 走默认执行位（sites.yaml 是执行位登记，与源站无关）
# schedule: 不写 —— 静默合入，点亮由人工决定（本单为 drill，人工裁决不点亮）
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_quotes_toscrape_com
    description: Fetch the public quote list (text/author/tags) from quotes.toscrape.com
    frequency: on_demand
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return (10 per page; next page followed until satisfied, at most 5 pages)
    columns:
      - name: text
        type: string
        description: Quote text exactly as rendered on the page (verbatim, curly quotes kept)
      - name: author
        type: string
        description: Author name as rendered on the page
      - name: tags
        type: string
        description: Comma-joined tag labels of the quote (empty string when the quote carries none)
      - name: url
        type: string
        description: Page URL the row was read from
      - name: source
        type: string
        description: Source identifier (constant quotes-toscrape-com)
      - name: scraped_at
        type: string
        description: Scrape timestamp (UTC ISO8601)
concepts: []
entities: []
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
