# fd-open-data-protocol compliant manifest
# MCP integration metadata

name: data-science-china
label: "Data Science China Datasets"
description: "中国数据科学数据集，包含各类用于数据科学分析和研究的数据资源。"
source_url: "https://github.com/Data-Science-China/datasets"
priority_score: 84
created_at: 2026-08-01T02:00:00

function_definitions:
  - name: fetch_data_science_china
    description: "Fetch data from Data Science China Datasets"
    parameters:
      - name: urls
        type: array<string>
        description: "List of URLs to scrape"
        optional: true
        default: ["https://github.com/Data-Science-China/datasets"]
      - name: limit
        type: integer
        description: "Maximum number of records to fetch"
        optional: true
        default: 1000
    returns: array<object>
    
  - name: query_data_science_china
    description: "Query stored data from Data Science China Datasets"
    parameters:
      - name: filters
        type: object
        description: "Filter criteria"
        optional: true
      - name: limit
        type: integer
        description: "Max records to return"
        optional: true
        default: 100
    returns: array<object>

column_schemas:
  - name: source_url
    type: string
    description: "Original URL of the scraped page"
    
  - name: page_title
    type: string
    description: "HTML title of the page"
    
  - name: content_length
    type: integer
    description: "Size of page content in bytes"
    
  - name: status_code
    type: integer
    description: "HTTP status code of the request"
    
  - name: scraped_at
    type: timestamp
    description: "Timestamp when the data was collected"

commands:
  - name: fetch
    description: "Run the scraper to collect new data"
    command: "python spider.py --urls <url1> <url2>"
    
  - name: dry-run
    description: "Test scraping without saving results"
    command: "python spider.py --dry-run"
