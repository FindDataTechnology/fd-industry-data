name: steel-market
label: 钢铁市场数据平台(Steel Market Data Platforms)
source_url: https://www.mysteel.com/
description: 模板生成的多源抓取骨架：按 START_URLS 抓取 5 个市场数据平台首页，extract_data_from_page() 为占位实现、不解析任何字段（返回空列表），SOURCE_INFO 占位符未填充；具备 UA 轮换、重试与 SQLite/JSON 落盘逻辑。
start_urls:
  - https://www.mysteel.com/
  - https://www.worldsteel.org/
  - https://www.crugroup.com/
  - https://www.fastmarkets.com/
  - http://www.stats.gov.cn/
fields: []  # 页面解析为占位实现，代码中无可列举的具体字段
spider:
  class: SteelMarketSpider
  download_delay: 2.0
  concurrent_requests: 2
  max_retries: 3
outputs:
  sqlite: data/market_data.db (table market_data)
  json: output/market_data.json
