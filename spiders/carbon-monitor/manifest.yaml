version: "2"
name: carbon-monitor
label: Carbon Monitor daily CO2 emissions
source_url: https://datas.carbonmonitor.org/
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
schedule: "37 4 * * *"
data_period: day
data_period_field: date   # 水位字段（harden-crawl-delivery 3.3）：逐源声明并已在最近一次成功运行上验证可归一
min_rows_per_run: 20    # runs=39 p10=100 p50=100; p50=limit 截断型，取上限 20% — 见 docs/min-rows-coverage-baseline.md §3
memory_limit: "512Mi"
functions:
  - command: run_carbon_monitor
    description: Fetch the Carbon Monitor full daily CO2 emissions dataset (carbon_global, country x sector, 2019-, ~650k rows) and return the newest rows first; source=energy_global switches to the global daily energy-by-fuel companion dataset
    frequency: daily
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return (newest first)
      - name: source
        type: str
        required: false
        description: Dataset slug, carbon_global (default) or energy_global; only measured-valid values are ever sent
    columns:
      - name: date
        type: str
        description: Observation date YYYY-MM-DD (upstream CSV is DD/MM/YYYY, normalized)
      - name: country
        type: str
        description: Country name as published by Carbon Monitor (e.g. China, Austria)
      - name: sector
        type: str
        description: Emission sector (Power, Industry, Residential, Ground Transport, Domestic Aviation, International Aviation); for energy_global a fuel sector (Coal, Gas, Oil, Nuclear, Hydroelectricity, Solar, Wind, Other sources)
      - name: value
        type: float
        description: Daily value; carbon_global is Mt CO2/day (upstream-documented), energy_global unit is not declared in the CSV
      - name: dataset
        type: str
        description: Upstream source slug of the row (carbon_global or energy_global)
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
      - name: source_url
        type: str
        description: Exact download URL the row was parsed from
concepts:
  - column: value
    concept: emission.co2_daily
    entity_type: country
    measure: value
    unit: MtCO2_per_day
    frequency: daily
entities:
  - entity_type: country
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
# 接入声明（change: define-ingest-revision-and-coverage, decision 4A）
revision_policy: overwrite_with_history
coverage_capability: gaps_only
