name: kaggle
version: 1.0.0
description: Kaggle datasets metadata scraper for flower, China, and agriculture data
source: https://www.kaggle.com/datasets
author: FindData Official
license: MIT

spider:
  class: KaggleDatasetsSpider
  module: spider
  entry_point: spider.py

data_sources:
  - name: Datasets List
    url: https://www.kaggle.com/datasets
    category: datasets
  - name: Flower Search
    url: https://www.kaggle.com/search?q=flower+in%3Adatasets
    category: search
  - name: China Search
    url: https://www.kaggle.com/search?q=china+in%3Adatasets
    category: search
  - name: Agriculture Search
    url: https://www.kaggle.com/search?q=agriculture+in%3Adatasets
    category: search

output:
  database: data/kaggle.db
  json: output/kaggle_datasets.json
  schema:
    table: kaggle_datasets
    columns:
      - name: id
        type: INTEGER
        primary_key: true
      - name: url
        type: TEXT
      - name: dataset_id
        type: TEXT
      - name: title
        type: TEXT
      - name: author
        type: TEXT
      - name: description
        type: TEXT
      - name: tags
        type: TEXT
      - name: votes
        type: TEXT
      - name: usability
        type: TEXT
      - name: usability_rating
        type: TEXT
      - name: size
        type: TEXT
      - name: downloads
        type: TEXT
      - name: license
        type: TEXT
      - name: file_count
        type: TEXT
      - name: last_updated
        type: TEXT
      - name: file_name
        type: TEXT
      - name: file_size
        type: TEXT
      - name: file_type
        type: TEXT
      - name: download_url
        type: TEXT
      - name: data_type
        type: TEXT
      - name: scraped_at
        type: TEXT
      - name: url
        type: TEXT
      - name: dataset_id
        type: TEXT
      - name: data_type
        type: TEXT
      - name: file_name
        type: TEXT
        unique_constraint: true

settings:
  concurrent_requests: 4
  download_delay: 2.0
  robots_txt_obey: true
  allowed_domains:
    - kaggle.com

features:
  - pagination
  - sqlite_storage
  - json_export
  - rate_limiting
  - deduplication
  - stealth_mode_support
  - metadata_extraction

dependencies:
  - scrapling>=0.4.7
  - python>=3.10

last_updated: 2026-01-31
status: active
