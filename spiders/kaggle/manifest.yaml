version: '1'
name: kaggle
label: Kaggle Datasets
source_url: https://www.kaggle.com/datasets
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: get_kaggle_data
  description: Scrape dataset listings and details from Kaggle
  frequency: weekly
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  - name: urls
    type: list
    required: false
    description: Custom URLs to scrape
  columns:
  - name: dataset_id
    type: str
    description: Dataset identifier
  - name: title
    type: str
    description: Dataset title
  - name: author
    type: str
    description: Dataset author
  - name: description
    type: str
    description: Dataset description
  - name: tags
    type: str
    description: Tags (JSON array)
  - name: votes
    type: str
    description: Vote count
  - name: usability
    type: str
    description: Usability score
  - name: size
    type: str
    description: Dataset size
  - name: license
    type: str
    description: License type
  - name: url
    type: str
    description: Dataset URL
  - name: last_updated
    type: str
    description: Last update date
  - name: scraped_at
    type: str
    description: Scrape timestamp
concepts:
- column: title
  concept: dataset.kaggle
  entity_type: organization
  measure: value
  unit: string
  frequency: weekly
entities:
- entity_type: organization
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
