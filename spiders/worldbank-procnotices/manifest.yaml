version: "2"
name: worldbank-procnotices  # = spiders/worldbank-procnotices/ 目录名，运行时标识符，合入后不可改名
label: World Bank Procurement Notices
source_url: https://search.worldbank.org/api/v2/procnotices
# site: tencent              # 缺省 tencent；本单元只访问 search.worldbank.org 公开 REST，无需换执行位
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_worldbank_procnotices
    description: Fetch World Bank procurement notice details (public API v2, no auth)
    frequency: daily
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum number of notice rows to return
      - name: qterm
        type: string
        required: false
        description: Optional project-id full-text filter (golden replay uses fixed historical project P099833)
    columns:
      - name: notice_id
        type: string
        description: World Bank notice id (e.g. OP00473030)
      - name: notice_type
        type: string
        description: Notice type (e.g. Request for Expression of Interest / Invitation for Bids / Contract Award)
      - name: notice_status
        type: string
        description: Notice status (Published / Draft / Revised)
      - name: notice_lang
        type: string
        description: Notice language name
      - name: pdate
        type: string
        description: Publication date as published (dd-Mon-yyyy, e.g. 05-Oct-2026)
      - name: date
        type: string
        description: Publication date ISO (yyyy-mm-dd), derived from pdate; null when unparsable
      - name: project_id
        type: string
        description: World Bank project id (e.g. P179078)
      - name: project_name
        type: string
        description: Project name
      - name: country
        type: string
        description: Project country / region name
      - name: bid_reference_no
        type: string
        description: Bid reference number
      - name: title
        type: string
        description: Notice title (bid description, falling back to project name)
      - name: procurement_method
        type: string
        description: Procurement method name (e.g. Quality And Cost-Based Selection)
      - name: submission_deadline
        type: string
        description: Submission deadline date as published
      - name: url
        type: string
        description: Source request URL (page) for the row
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: title
    concept: document.title
    entity_type: organization
    measure: value
    unit: string
    frequency: daily
entities:
  - entity_type: organization
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
