version: "2"
limit_kind: full_set   # UNMEASURED: 1995 起的月度区域序列，按区域×月=固定历史集
name: uk-hpi               # = spiders/uk-hpi/ 目录名，运行时标识符，合入后不可改名
label: UK House Price Index
source_url: https://publicdata.landregistry.gov.uk/market-trend-data/house-price-index-data/
# site: tencent              # 缺省 tencent；本单元只访问 publicdata.landregistry.gov.uk 官方固定文件，无需换执行位
schedule: "44 1 26 * *" # 点亮（批次二）：每月 26 日 01:44；UK HPI 下旬发布（与 openfda 同日不同刻，唯一同日对）
# 低频源：一次抖动就是整窗空档（月/季/年），故给 3 次重试。
backoff_limit: 3
# 单轮取多少行。**必须显式声明**：chart 的缺省是 100，而本单元取的是 Land Registry
# 全量 CSV（区域 × 月长表，1995 起，全文件十余万行）。100 行 = 文件头部第 1 个区域
# 的 100 个月 —— 实测库内只有 **1 个区域 × 100 个月（2004-01..2012-04）**，且窗口
# 永不前进（2026-11-14 由 check_crawl_row_cap.py 点名）。
# 20000 行 ≈ 按文件顺序（区域字母序、区内日期升序）覆盖约 52 个区域的**完整历史**。
# 注意：这是「头部连续切片」的固有形状——想按区域挑（例如只取 United Kingdom /
# England 这类国家级行），得改 spider 加 region 过滤，不是调 limit 能解决的。
limit: 20000
data_period: month
data_period_field: month   # 水位字段（harden-crawl-delivery 3.3）：逐源声明并已在最近一次成功运行上验证可归一
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_uk_hpi
    description: Fetch head sample of the UK HPI full-file CSV (region x month long table, 1995 onwards)
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: "Maximum rows from the head sample (file order: region alphabetical, then date ascending)"
    columns:
      - name: region
        type: string
        description: Region name (RegionName column)
      - name: area_code
        type: string
        description: ONS area code (AreaCode column)
      - name: month
        type: string
        description: Month label YYYY-MM (normalized from dd/mm/YYYY Date column)
      - name: average_price
        type: float
        description: Average price in GBP (AveragePrice column, null when missing)
      - name: index
        type: float
        description: House price index level (Index column, null when missing)
      - name: sales_volume
        type: float
        description: Sales volume (SalesVolume column, null when missing)
      - name: url
        type: string
        description: Source file URL for the row
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: average_price
    concept: property.average_price
    entity_type: region
    measure: value
    unit: gbp
    frequency: monthly
entities:
  - entity_type: region
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
# 接入声明（change: define-ingest-revision-and-coverage, decision 4A）
revision_policy: overwrite_with_history
coverage_capability: gaps_only
