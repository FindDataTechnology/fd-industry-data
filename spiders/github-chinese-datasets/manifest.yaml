# fd-open-data-protocol compliant manifest

name: github-chinese-datasets
label: "GitHub Chinese Datasets"
description: "Chinese dataset repositories on GitHub, including curated collections of China-related data resources."
source_url: "https://github.com/datasets/chinese-datasets"
priority_score: 87
created_at: 2026-08-01T12:00:00

function_definitions:
  - name: fetch_github_chinese_datasets
    description: "Fetch Chinese dataset repositories from GitHub"
    parameters:
      - name: urls
        type: array<string>
        optional: true
      - name: limit
        type: integer
        optional: true
        default: 500
    returns: array<object>

column_schemas:
  - name: source_url
    type: string
  - name: dataset_name
    type: string
  - name: description
    type: string
  - name: dataset_url
    type: string
  - name: category
    type: string
  - name: format_type
    type: string
  - name: size
    type: string
  - name: scraped_at
    type: timestamp

commands:
  - name: fetch
    command: "python spider.py --urls <url1>"
  - name: dry-run
    command: "python spider.py --dry-run"
