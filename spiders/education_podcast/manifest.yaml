version: "2"
name: education_podcast
label: Podcast layer (Apple catalog seed -> RSS living-water -> optional whisper transcription)
source_url: https://itunes.apple.com/search + RSS feeds
schedule: "17 */6 * * *"  # 每 6h 一次 poller 回合；与在册集群错峰（7.4 终校）
data_period: day
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_podcast_seed
    description: Seed podcast registry from Apple catalog (entity=podcast returns feedUrl); validates each feed live; dedupe by feedUrl/collectionId; license=public-enclosure with redistribution=needs_authorization (internal-index vs redistribute two tracks)
    frequency: monthly
    parameters:
      - name: keywords
        type: array
        required: false
        description: Search terms (default science/history/language/programming/finance + CN equivalents)
      - name: countries
        type: array
        required: false
        description: "Storefronts (default [us, cn])"
      - name: limit
        type: int
        required: false
        description: Max shows to seed
    columns:
      - name: show_id
        type: string
        description: Registry key (podcast:<collectionId>)
      - name: name
        type: string
        description: Show name
      - name: feed_url
        type: string
        description: RSS feed URL (dedupe key)
      - name: platform
        type: string
        description: Feed host (e.g. ximalaya.com)
      - name: episodes
        type: int
        description: Episode count at seed time (0 = feed failed to fetch, flagged not faked)
      - name: latest_pub_date
        type: string
        description: Latest episode publish date (ISO)
      - name: license
        type: string
        description: public-enclosure (编目+内部索引合法)
      - name: redistribution
        type: string
        description: needs_authorization (转录文本再分发需节目方授权——与内部索引分轨)
      - name: body_state
        type: string
        description: stored_extraction (feed validated) | link_only (feed unreachable at seed)
      - name: education_source
        type: string
        description: apple_seed
      - name: source
        type: string
        description: Data source identifier
      - name: source_url
        type: string
        description: Apple catalog page URL (traceability)
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
  - command: run_podcast_poller
    description: RSS living-water poller — incremental new episodes per feed, per-show new-episode cap (start throttle), optional faster-whisper transcription slot (pending if model absent, never faked); per-feed health ledger (consecutive_fail + reason enum; channel failure emits health_fail row, not empty)
    frequency: hourly
    parameters:
      - name: feeds
        type: array
        required: false
        description: Feed URLs to poll (from RSS registry; empty refuses to run)
      - name: new_ep_cap
        type: int
        required: false
        description: Max new episodes per show per round (start throttle, default 3)
      - name: fetch_transcripts
        type: boolean
        required: false
        description: Enable transcription slot (false = register pending only)
      - name: state_file
        type: string
        required: false
        description: Override state JSON path (for test isolation)
    columns:
      - name: kind
        type: string
        description: episode | health_fail
      - name: feed_url
        type: string
        description: Feed the row came from
      - name: episode_guid
        type: string
        description: Stable episode id (guid or link)
      - name: title
        type: string
        description: Episode title
      - name: pub_date
        type: string
        description: Episode publish date ISO
      - name: enclosure_url
        type: string
        description: RSS-declared public audio URL (only transcription input path, spec cap1 R7)
      - name: body_markdown
        type: string
        description: Whisper transcript (D6) when transcription ran
      - name: body_state
        type: string
        description: pending | stored_extraction | link_only
      - name: episode_status
        type: string
        description: pending | running | done | failed state machine
      - name: consecutive_fail
        type: int
        description: Health counter (spec cap1 R6)
      - name: reason
        type: string
        description: Failure reason enum on health_fail rows
      - name: as_of
        type: string
        description: Row freshness stamp
      - name: license
        type: string
        description: public-enclosure
      - name: redistribution
        type: string
        description: needs_authorization
      - name: source
        type: string
        description: Data source identifier
      - name: source_url
        type: string
        description: Feed URL (traceability)
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
entities:
  - entity_type: resource
    coverage: universe
  - entity_type: creator
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
