version: "2"
name: open-meteo              # = spiders/open-meteo/ 目录名，运行时标识符，合入后不可改名
label: Open-Meteo Historical Reanalysis Daily
source_url: https://open-meteo.com/
# site: tencent              # 缺省 tencent；本单元只访问 archive-api.open-meteo.com 公开 REST，无需换执行位
schedule: "38 7 * * *"  # 点亮（批次二）：07:38 取再分析日值；与 noaa-ncei 同类错峰 29 分钟
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_open_meteo
    description: Fetch historical ERA5 reanalysis daily weather (mean temperature / precipitation) per city from Open-Meteo archive API
    frequency: daily
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum number of city-day rows to return
      - name: city
        type: string
        required: false
        description: Restrict to one seeded city (e.g. beijing); used to pin golden replays
      - name: start_date
        type: string
        required: false
        description: Window start (ISO date); defaults to trailing 31 days ending yesterday UTC
      - name: end_date
        type: string
        required: false
        description: Window end (ISO date); defaults to yesterday UTC
    columns:
      - name: city
        type: string
        description: Seeded city key (fixed constant coordinates, beijing first)
      - name: latitude
        type: float
        description: Requested latitude of the city
      - name: longitude
        type: float
        description: Requested longitude of the city
      - name: date
        type: string
        description: Observation day (ISO8601 date)
      - name: temperature_2m_mean
        type: float
        description: Daily mean 2m air temperature in Celsius (null when missing)
      - name: precipitation_sum
        type: float
        description: Daily precipitation sum in mm (null when missing)
      - name: url
        type: string
        description: Source request URL for the row
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: temperature_2m_mean
    concept: weather.temperature
    entity_type: region
    measure: value
    unit: celsius
    frequency: daily
  - column: precipitation_sum
    concept: weather.precipitation
    entity_type: region
    measure: value
    unit: mm
    frequency: daily
entities:
  - entity_type: region
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
