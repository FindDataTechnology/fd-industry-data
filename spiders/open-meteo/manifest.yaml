version: "2"
limit_kind: rolling   # 日频/月度序列，逐轮累积历史
name: open-meteo              # = spiders/open-meteo/ 目录名，运行时标识符，合入后不可改名
label: Open-Meteo Historical Reanalysis Daily
source_url: https://open-meteo.com/
# site: tencent              # 缺省 tencent；本单元只访问 archive-api.open-meteo.com 公开 REST，无需换执行位
schedule: "38 7 * * *"  # 点亮（批次二）：07:38 取再分析日值；与 noaa-ncei 同类错峰 29 分钟
# limit: **必须自己声明**（2026-11-14 补）。不写时 chart 缺省传 `--limit 100`，而本源一轮的
# 行是「城市 × 日」的网格：spider 的 `CITIES` 有 **8 个城市**、窗口 31 天 ⇒ **248 行**。
# 100 会切在网格中间（实测：前四城各 31 天，第 4 城只剩 7 天）；200 也不够（第 7 城只剩 14 天、
# 第 8 城整段没有）。**这不是「滚动尾部」，是 limit 把最后一列剁掉**，所以「窗口有没有前进」
# 这类判据看不见它。
# 规模要按 spider 的 `CITIES` 元组数算，**不要按观测到的行数反推** —— 观测到的行数本身就是被
# 这一次截断后的结果（我第一次按"看到 4 个城市"算出 124，第二次按 7 个城市算出 217，都不对）。
# 取 300（248 的 1.2 倍余量），够「加一两个城市」而不必再来改这一行。
limit: 300
data_period: day
min_rows_per_run: 20    # runs=35 p10=100 p50=100; p50=limit 截断型，取上限 20% — 见 docs/min-rows-coverage-baseline.md §3
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_open_meteo
    description: Fetch historical ERA5 reanalysis daily weather (mean temperature / precipitation) per city from Open-Meteo archive API
    frequency: daily
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum number of city-day rows to return
      - name: city
        type: string
        required: false
        description: Restrict to one seeded city (e.g. beijing); used to pin golden replays
      - name: start_date
        type: string
        required: false
        description: Window start (ISO date); defaults to trailing 31 days ending yesterday UTC
      - name: end_date
        type: string
        required: false
        description: Window end (ISO date); defaults to yesterday UTC
    columns:
      - name: city
        type: string
        description: Seeded city key (fixed constant coordinates, beijing first)
      - name: latitude
        type: float
        description: Requested latitude of the city
      - name: longitude
        type: float
        description: Requested longitude of the city
      - name: date
        type: string
        description: Observation day (ISO8601 date)
      - name: temperature_2m_mean
        type: float
        description: Daily mean 2m air temperature in Celsius (null when missing)
      - name: precipitation_sum
        type: float
        description: Daily precipitation sum in mm (null when missing)
      - name: url
        type: string
        description: Source request URL for the row
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: temperature_2m_mean
    concept: weather.temperature
    entity_type: region
    measure: value
    unit: celsius
    frequency: daily
  - column: precipitation_sum
    concept: weather.precipitation
    entity_type: region
    measure: value
    unit: mm
    frequency: daily
entities:
  - entity_type: region
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
# 接入声明（change: define-ingest-revision-and-coverage, decision 4A）
revision_policy: overwrite_with_history
coverage_capability: gaps_only
