# fd-open-data-protocol compliant manifest

name: eastmoney-data
label: "东方财富数据中心"
description: "东方财富网数据中心，提供CPI、PPI、GDP等宏观经济数据及金融市场统计数据。"
source_url: "https://data.eastmoney.com"
priority_score: 94
created_at: 2026-08-01T12:00:00

function_definitions:
  - name: fetch_eastmoney_data
    description: "Fetch economic and financial data from EastMoney"
    parameters:
      - name: urls
        type: array<string>
        optional: true
      - name: limit
        type: integer
        optional: true
        default: 1000
    returns: array<object>

column_schemas:
  - name: source_url
    type: string
  - name: page_title
    type: string
  - name: indicator_name
    type: string
  - name: indicator_value
    type: string
  - name: period
    type: string
  - name: change_value
    type: string
  - name: category
    type: string
  - name: scraped_at
    type: timestamp

commands:
  - name: fetch
    command: "python spider.py --urls <url1>"
  - name: dry-run
    command: "python spider.py --dry-run"
