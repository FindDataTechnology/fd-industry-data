schedule: "35 4 * * *"
# 每个报表 30 期 × 「当月/同比」两条 × 两个报表 = 120 条。缺省 limit=100 会把
# PPI 截到不足 24 期，而下游 extract_*.py 的趋势闸是「≥24 连续期」⇒ 两个报表
# 都进不了 semantic_observations。故显式抬到 200（留出余量）。
limit: 200
data_period: day
# site 已退役（2026-11-14）：原为 `site: xinru-server2`，而该站点的 k3s 里**连 scraw
# 命名空间都不存在**（无 dispatcher、无 SA、无 Secret），源自 2026-11-09 04:50 起零产出。
# tencent 出口用真 spider 实跑验过（2026-11-14）。注意「历史中位数 2 行」不可作为
# 基线：那 59 次 success 全是**字段全空的占位行**（`response.text` 为空串所致，
# 已修，见 `6d76a02`），真值一轮 80 条；本清单同时把 limit 抬到 200 以容纳
# 30 期 × 2 报表（见上）。
# 日后若要挪回某个站点，先确认那里的 `scraw/fd-industry-dispatcher` 在场。
# fd-open-data-protocol compliant manifest

name: eastmoney-data
label: "东方财富数据中心"
description: "东方财富网数据中心，提供CPI、PPI、GDP等宏观经济数据及金融市场统计数据。"
source_url: "https://data.eastmoney.com"
priority_score: 94
created_at: 2026-08-01T12:00:00

function_definitions:
  - name: fetch_eastmoney_data
    description: "Fetch economic and financial data from EastMoney"
    parameters:
      - name: urls
        type: array<string>
        optional: true
      - name: limit
        type: integer
        optional: true
        default: 1000
    returns: array<object>

column_schemas:
  - name: source_url
    type: string
  - name: page_title
    type: string
  - name: indicator_name
    type: string
  - name: indicator_value
    type: string
  - name: period
    type: string
  - name: change_value
    type: string
  - name: category
    type: string
  - name: scraped_at
    type: timestamp

commands:
  - name: fetch
    command: "python spider.py --urls <url1>"
  - name: dry-run
    command: "python spider.py --dry-run"
# 接入声明（change: define-ingest-revision-and-coverage, decision 4A）
revision_policy: overwrite_with_history
coverage_capability: gaps_only
