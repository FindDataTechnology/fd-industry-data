# fd-open-data-protocol compliant manifest
# MCP integration metadata

name: trendforce
label: "TrendForce Market Intelligence"
description: "Leading provider of semiconductor, display panel, and consumer electronics market data and price analysis."
source_url: "https://www.trendforce.com/"
priority_score: 95
created_at: 2026-08-01T01:22:55.634846

function_definitions:
  - name: fetch_trendforce
    description: "Fetch data from TrendForce Market Intelligence"
    parameters:
      - name: urls
        type: array<string>
        description: "List of URLs to scrape"
        optional: true
        default: ["https://www.trendforce.com/"]
      - name: limit
        type: integer
        description: "Maximum number of records to fetch"
        optional: true
        default: 1000
    returns: array<object>
    
  - name: query_trendforce
    description: "Query stored data from TrendForce Market Intelligence"
    parameters:
      - name: filters
        type: object
        description: "Filter criteria"
        optional: true
      - name: limit
        type: integer
        description: "Max records to return"
        optional: true
        default: 100
    returns: array<object>

column_schemas:
  - name: source_url
    type: string
    description: "Original URL of the scraped page"
    
  - name: page_title
    type: string
    description: "HTML title of the page"
    
  - name: content_length
    type: integer
    description: "Size of page content in bytes"
    
  - name: status_code
    type: integer
    description: "HTTP status code of the request"
    
  - name: scraped_at
    type: timestamp
    description: "Timestamp when the data was collected"

commands:
  - name: fetch
    description: "Run the scraper to collect new data"
    command: "python spider.py --urls <url1> <url2>"
    
  - name: dry-run
    description: "Test scraping without saving results"
    command: "python spider.py --dry-run"
    
  - name: export-json
    description: "Export data to JSON Lines format"
    command: "python spider.py --format json"
    
  - name: export-db
    description: "Export data to SQLite database"
    command: "python spider.py --format sqlite"