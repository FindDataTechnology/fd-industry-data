name: steel-info
label: 钢铁行业资讯门户(Steel Industry Information Networks)
source_url: https://www.mysteel.com
description: 模板生成的多源抓取骨架：按 START_URLS 抓取 5 个钢铁资讯门户首页，extract_data_from_page() 为占位实现、不解析任何字段（返回空列表），SOURCE_INFO 占位符未填充；具备 UA 轮换、重试与 SQLite/JSON 落盘逻辑。
start_urls:
  - https://www.mysteel.com
  - http://www.cisa.org.cn
  - http://www.steelhome.cn
  - https://www.smm.cn
  - https://www.stats.gov.cn
fields: []  # 页面解析为占位实现，代码中无可列举的具体字段
spider:
  class: SteelInfoSpider
  download_delay: 2.0
  concurrent_requests: 2
  max_retries: 3
outputs:
  sqlite: data/info_data.db (table info_data)
  json: output/info_data.json
