# fd-open-data-protocol compliant manifest
# MCP integration metadata

name: awesome-chinese-api
label: "Awesome Chinese API"
description: "精选的中国API资源列表，包含各类中文API服务。"
source_url: "https://github.com/awesome-chinese-api/awesome-chinese-api"
priority_score: 86
created_at: 2026-08-01T02:00:00

function_definitions:
  - name: fetch_awesome_chinese_api
    description: "Fetch data from Awesome Chinese API"
    parameters:
      - name: urls
        type: array<string>
        description: "List of URLs to scrape"
        optional: true
        default: ["https://github.com/awesome-chinese-api/awesome-chinese-api"]
      - name: limit
        type: integer
        description: "Maximum number of records to fetch"
        optional: true
        default: 1000
    returns: array<object>
    
  - name: query_awesome_chinese_api
    description: "Query stored data from Awesome Chinese API"
    parameters:
      - name: filters
        type: object
        description: "Filter criteria"
        optional: true
      - name: limit
        type: integer
        description: "Max records to return"
        optional: true
        default: 100
    returns: array<object>

column_schemas:
  - name: source_url
    type: string
    description: "Original URL of the scraped page"
    
  - name: page_title
    type: string
    description: "HTML title of the page"
    
  - name: content_length
    type: integer
    description: "Size of page content in bytes"
    
  - name: status_code
    type: integer
    description: "HTTP status code of the request"
    
  - name: scraped_at
    type: timestamp
    description: "Timestamp when the data was collected"

commands:
  - name: fetch
    description: "Run the scraper to collect new data"
    command: "python spider.py --urls <url1> <url2>"
    
  - name: dry-run
    description: "Test scraping without saving results"
    command: "python spider.py --dry-run"
