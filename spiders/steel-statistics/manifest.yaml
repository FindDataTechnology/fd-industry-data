name: steel-statistics
label: 官方统计机构网站(Steel Statistical Office Websites)
source_url: https://www.cisa.org.cn/
description: 模板生成的多源抓取骨架：按 START_URLS 抓取 4 个政府/行业统计网站首页，extract_data_from_page() 为占位实现、不解析任何字段（返回空列表），SOURCE_INFO 占位符未填充；具备 UA 轮换、重试与 SQLite/JSON 落盘逻辑。
start_urls:
  - https://www.cisa.org.cn/
  - http://www.stats.gov.cn/
  - http://www.miit.gov.cn/
  - http://www.worldsteel.org/zh-hans/
fields: []  # 页面解析为占位实现，代码中无可列举的具体字段
spider:
  class: SteelStatisticsSpider
  download_delay: 2.0
  concurrent_requests: 2
  max_retries: 3
outputs:
  sqlite: data/statistical_data.db (table statistical_data)
  json: output/statistical_data.json
