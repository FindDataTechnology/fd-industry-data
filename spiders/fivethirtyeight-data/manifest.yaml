# fd-open-data-protocol compliant manifest
# MCP integration metadata

name: fivethirtyeight-data
label: "FiveThirtyEight Data"
description: "FiveThirtyEight的开源数据仓库，包含政治、体育、经济等领域的分析数据。"
source_url: "https://api.github.com/repos/fivethirtyeight/data/git/trees/master"
priority_score: 89
created_at: 2026-08-01T02:00:00

function_definitions:
  - name: fetch_fivethirtyeight_data
    description: "Fetch data from FiveThirtyEight Data"
    parameters:
      - name: urls
        type: array<string>
        description: "List of URLs to scrape"
        optional: true
        default: ["https://api.github.com/repos/fivethirtyeight/data/git/trees/master"]
      - name: limit
        type: integer
        description: "Maximum number of records to fetch"
        optional: true
        default: 1000
    returns: array<object>
    
  - name: query_fivethirtyeight_data
    description: "Query stored data from FiveThirtyEight Data"
    parameters:
      - name: filters
        type: object
        description: "Filter criteria"
        optional: true
      - name: limit
        type: integer
        description: "Max records to return"
        optional: true
        default: 100
    returns: array<object>

column_schemas:
  - name: source_url
    type: string
    description: "API URL the tree listing was fetched from"

  - name: file_name
    type: string
    description: "Top-level path in the repo tree (dataset dir or file)"

  - name: file_type
    type: string
    description: "Tree entry type: tree (directory) or blob (file)"

  - name: is_dataset_dir
    type: boolean
    description: "True when the entry is a non-hidden dataset directory"

  - name: blob_sha
    type: string
    description: "Git SHA of the tree entry"

  - name: scraped_at
    type: timestamp
    description: "Timestamp when the data was collected"

commands:
  - name: fetch
    description: "Run the scraper to collect new data"
    command: "python spider.py --urls <url1> <url2>"
    
  - name: dry-run
    description: "Test scraping without saving results"
    command: "python spider.py --dry-run"
