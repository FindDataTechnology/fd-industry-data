version: '1'
name: github-topics-china
label: GitHub China Topics
source_url: https://github.com/topics/china
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: get_github_topics_china_data
  description: Scrape GitHub repositories tagged with China-related topics
  frequency: weekly
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  - name: urls
    type: list
    required: false
    description: Custom URLs to scrape
  columns:
  - name: title
    type: str
    description: Repository title
  - name: description
    type: str
    description: Description text
  - name: url
    type: str
    description: Source URL
  - name: language
    type: str
    description: Programming language
  - name: stars
    type: str
    description: Star count
  - name: forks
    type: str
    description: Fork count
  - name: scraped_at
    type: str
    description: Scrape timestamp
concepts:
- column: title
  concept: github.china_topic
  entity_type: country
  measure: value
  unit: string
  frequency: weekly
entities:
- entity_type: country
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
