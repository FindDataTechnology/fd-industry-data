version: "2"
name: nmc-weather              # = spiders/nmc-weather/ 目录名，运行时标识符，合入后不可改名
label: NMC Weather Observations
source_url: https://www.nmc.cn/
# site: tencent              # 缺省 tencent；本单元只访问 www.nmc.cn 公开 REST，无需换执行位
# schedule: "..."            # 刻意不写：先静默合入，点亮是人工门
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_nmc_weather
    description: Fetch station-level weather observations from China Meteorological Administration (NMC)
    frequency: hourly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum number of station rows to return
    columns:
      - name: station
        type: string
        description: NMC internal station code (short code, e.g. Wqsps = Beijing)
      - name: station_name
        type: string
        description: Station / city display name
      - name: province
        type: string
        description: Province name
      - name: city
        type: string
        description: City name
      - name: temperature
        type: float
        description: Observed air temperature in Celsius (null when the 9999 missing sentinel is returned)
      - name: humidity
        type: float
        description: Relative humidity in percent (null when missing)
      - name: weather
        type: string
        description: Weather description text (e.g. 晴)
      - name: wind
        type: float
        description: Wind speed in m/s (null when missing)
      - name: wind_direct
        type: string
        description: Wind direction text (e.g. 西北风)
      - name: wind_power
        type: string
        description: Wind power/scale text (e.g. 微风)
      - name: publish_time
        type: string
        description: Upstream publish time as reported by NMC
      - name: url
        type: string
        description: Source request URL for the row
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: temperature
    concept: weather.temperature
    entity_type: region
    measure: value
    unit: celsius
    frequency: hourly
entities:
  - entity_type: region
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider