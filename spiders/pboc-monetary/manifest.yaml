version: "2"
name: pboc-monetary           # = spiders/pboc-monetary/ 目录名，运行时标识符，合入后不可改名
label: PBOC AFRE & Monetary Statistics (Monthly)
source_url: https://www.pbc.gov.cn/diaochatongjisi/116219/116319/index.html
# site: tencent              # 缺省 tencent；本单元只访问 www.pbc.gov.cn 公开静态页与 xlsx，无需换执行位
schedule: "31 4 22 * *" # 点亮（批次二）：每月 22 日 04:31；央行社融/M2 月中下旬发布
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_pboc_monetary
    description: Fetch monthly AFRE (aggregate financing) flow/stock and M0/M1/M2 money supply tables from PBOC year-section xlsx attachments
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum number of indicator rows to return (latest year first)
    columns:
      - name: month
        type: string
        description: Observation month as YYYY-MM
      - name: indicator
        type: string
        description: One of 社会融资规模增量 / 社会融资规模存量 / M2 / M1 / M0
      - name: value
        type: float
        description: Monthly value as published (flow & money in 亿元, stock in 万亿元)
      - name: unit
        type: string
        description: Unit as declared in the source table (亿元 or 万亿元)
      - name: url
        type: string
        description: Source xlsx attachment URL for the row
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: value
    concept: economic.monetary_aggregate
    entity_type: country
    measure: value
    unit: cny_hundred_million
    frequency: monthly
entities:
  - entity_type: country
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
