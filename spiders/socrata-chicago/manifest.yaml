version: "2"
name: socrata-chicago           # = spiders/socrata-chicago/ 目录名，运行时标识符，合入后不可改名
label: Chicago CTA Bus Monthly Ridership (Socrata)
source_url: https://data.cityofchicago.org/Transportation/CTA-Ridership-Bus-Routes-Monthly-Day-Type-Averag/bynn-gwxy
egress_secret: fd-industry-egress-fx01       # 需代理出口：data.cityofchicago.org 从 tencent 站点直连被 Socrata 边缘 403
schedule: "9 5 2 * *"       # 月频（数据月底发布，README 记 2026-09-28）；socrata-cadence-alignment 修正：原 "9 5 * * *" 每日触发，对月频数据每月浪费 ~29 次代理请求
# 低频源：一次抖动就是整窗空档（月/季/年），故给 3 次重试。
backoff_limit: 3
data_period: month
data_period_field: period   # 水位字段（harden-crawl-delivery 3.3）：逐源声明并已在最近一次成功运行上验证可归一
min_rows_per_run: 20    # runs=6 p10=100 p50=100; p50=limit 截断型，取上限 20% — 见 docs/min-rows-coverage-baseline.md §3
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_socrata_chicago
    description: Fetch monthly CTA bus ridership totals for Chicago (all routes aggregated) from the data.cityofchicago.org Socrata SODA API
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum number of monthly rows to return (most recent kept; default 100, max 5000)
    columns:
      - name: period
        type: string
        description: Observation month (ISO yyyy-mm)
      - name: bus_rides_total
        type: int
        description: Total CTA bus rides in the month, all routes aggregated (count)
      - name: url
        type: string
        description: Request URL for the run
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: bus_rides_total
    concept: transport.monthly_ridership
    entity_type: region
    measure: value
    unit: count
    frequency: monthly
entities:
  - entity_type: region
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
# 接入声明（change: define-ingest-revision-and-coverage, decision 4A）
revision_policy: overwrite_with_history
coverage_capability: gaps_only
