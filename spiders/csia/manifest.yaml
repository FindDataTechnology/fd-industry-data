version: "1"
name: csia
label: 中国半导体行业协会
source_url: https://www.csia.net.cn
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_csia
    description: Fetch metadata and industry data from CSIA (中国半导体行业协会)
    frequency: on_demand
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: title
        type: str
        description: Page or article title
      - name: description
        type: str
        description: Page or article description
      - name: url
        type: str
        description: Source URL
      - name: source
        type: str
        description: Data source name
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
concepts:
  - column: title
    concept: industry.report_title
    entity_type: industry
    measure: value
    unit: string
    frequency: on_demand
entities:
  - entity_type: industry
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
