version: "2"
name: afdc                       # = spiders/afdc/ 目录名，运行时标识符，合入后不可改名
label: US DOE AFDC Alternative Fueling Station Counts
source_url: https://afdc.energy.gov/data/10332
# site: tencent 缺省——直连 afdc.energy.gov 实测可达（本机 + tencent 站点均 200，2026-10-08），无需代理出口
schedule: "43 6 14 * *"       # 点亮（批次三，monthly）
# 低频源：一次抖动就是整窗空档（月/季/年），故给 3 次重试。
backoff_limit: 3
data_period: month
# 每轮取数上限。**必须大于数据集规模**：本单元取 AFDC 图 10332 的年度分燃料类型充电站计数，
# 是把整张表解析完再 `rows[-limit:]` 切片。实测（2026-11-11，集群内 limit=5000 无截断）：
# 完整全集 = **225 行**。吃默认 limit=100 时每轮丢掉 125 行（55.6%），而且丢的是**最旧年份**
# ——该表年度序列，丢头等于把历史年份排除在库外，且下一轮仍然只取尾部，**永远不会补回**。
# 取 500（225 的 2.2 倍余量，容纳后续年份增长）。
limit: 500
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_afdc
    description: Fetch annual US alternative fueling station counts by fuel type (AFDC chart 10332 JSON, no key required)
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum observation rows to return (deterministic order, most recent kept)
      - name: year
        type: int
        required: false
        description: Optional year filter (1992 onward; omit for all years)
    columns:
      - name: year
        type: int
        description: Reporting year (chart categories axis)
      - name: fuel
        type: string
        description: Fuel series name as upstream code (Biodiesel / CNG / Electric / Ethanol (E85) / Hydrogen / LNG / Methanol (M85) / Propane / Renewable Diesel)
      - name: stations
        type: float
        description: Number of public and private fueling stations (missing nulls never emitted)
      - name: unit
        type: string
        description: Constant "stations" (normalized from chart yaxis "Number of Stations")
      - name: chart_title
        type: string
        description: Upstream chart title for provenance
      - name: upstream_updated
        type: string
        description: Upstream last_update label (e.g. "January 2026")
      - name: url
        type: string
        description: Source request URL for the rows
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: stations
    concept: energy.alt_fuel_stations
    entity_type: region
    measure: value
    unit: count
    frequency: yearly
entities:
  - entity_type: region
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
# 接入声明（change: define-ingest-revision-and-coverage, decision 4A）
revision_policy: overwrite_with_history
coverage_capability: gaps_only
