version: "2"
name: eurostat-api
label: Eurostat Dissemination API
source_url: https://ec.europa.eu/eurostat/
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
schedule: "43 3 20 * *"
data_period: month
functions:
  - command: run_eurostat_api
    description: Fetch manufacturing production index (sts_inpr_m), consumer confidence indicator (ei_bsco_m) and agricultural output price index (apri_pi_outq) series for DE/FR/IT from the Eurostat dissemination API (JSON-stat 2.0)
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: dataset
        type: str
        description: Eurostat dataset code (sts_inpr_m, ei_bsco_m, apri_pi_outq)
      - name: geo
        type: str
        description: Country code (DE, FR, IT)
      - name: freq
        type: str
        description: Frequency code (M monthly, Q quarterly)
      - name: unit
        type: str
        description: Unit code (I21 index 2021=100, I20 index 2020=100, BAL balance)
      - name: indic
        type: str
        description: Indicator dimension code (indic_bt PRD, indic BS-CSMCI, am_item AM010000)
      - name: s_adj
        type: str
        description: Seasonal adjustment code (NSA unadjusted, SA seasonally adjusted); empty when the dataset has no such dimension
      - name: nace_r2
        type: str
        description: NACE Rev.2 code (C manufacturing, C20 chemicals); empty when not applicable
      - name: p_adj
        type: str
        description: Price adjustment code (NI nominal index); empty when not applicable
      - name: period
        type: str
        description: Period label (YYYY-MM monthly, YYYY-QN quarterly)
      - name: value
        type: float
        description: Index value or survey balance; upstream null cells are omitted, never fabricated
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
      - name: source_url
        type: str
        description: Exact API request URL the row was parsed from
  - command: run_eurostat_c20
    description: Fetch C20 chemicals production index (sts_inpr_m, nace_r2=C20, indic_bt=PRD, s_adj=CA, unit=I21) for the EU27_2020 aggregate, monthly since 2000-01 (JSON-stat 2.0); asserts a non-empty parse since Eurostat returns HTTP 200 empty sets for dead parameter combos
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: dataset
        type: str
        description: Eurostat dataset code (always sts_inpr_m)
      - name: geo
        type: str
        description: Country/aggregate code (EU27_2020)
      - name: freq
        type: str
        description: Frequency code (M monthly)
      - name: unit
        type: str
        description: Unit code (I21 index 2021=100)
      - name: indic
        type: str
        description: Business trend indicator code (PRD production index)
      - name: s_adj
        type: str
        description: Seasonal adjustment code (CA calendar adjusted)
      - name: nace_r2
        type: str
        description: NACE Rev.2 code (C20 chemicals)
      - name: p_adj
        type: str
        description: Price adjustment code (always empty for this dataset)
      - name: period
        type: str
        description: Period label (YYYY-MM)
      - name: value
        type: float
        description: Production index value; upstream null cells are omitted, never fabricated
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
      - name: source_url
        type: str
        description: Exact API request URL the row was parsed from
  - command: run_eurostat_bsci
    description: Fetch consumer confidence indicator (ei_bsco_m, indic=BS-CSMCI, s_adj=NSA, unit=BAL) for the EU27_2020 aggregate, monthly since 1980-01 (first actual values 1985-01, JSON-stat 2.0); asserts a non-empty parse (ei_bsci is dead upstream and must never be used)
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: dataset
        type: str
        description: Eurostat dataset code (always ei_bsco_m)
      - name: geo
        type: str
        description: Country/aggregate code (EU27_2020)
      - name: freq
        type: str
        description: Frequency code (M monthly)
      - name: unit
        type: str
        description: Unit code (BAL survey balance)
      - name: indic
        type: str
        description: Indicator code (BS-CSMCI composite consumer confidence)
      - name: s_adj
        type: str
        description: Seasonal adjustment code (NSA unadjusted)
      - name: nace_r2
        type: str
        description: NACE Rev.2 code (always empty for this dataset)
      - name: p_adj
        type: str
        description: Price adjustment code (always empty for this dataset)
      - name: period
        type: str
        description: Period label (YYYY-MM)
      - name: value
        type: float
        description: Survey balance value; upstream null cells are omitted, never fabricated
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
      - name: source_url
        type: str
        description: Exact API request URL the row was parsed from
  - command: run_eurostat_apri
    description: Fetch agricultural output price index (apri_pi_outq, am_item=AM141000, p_adj=NI, unit=I20) for the EU27_2020 aggregate, quarterly since 2000-Q1 (actual values 2020-Q1..latest, JSON-stat 2.0); asserts a non-empty parse (apri_pi05_outq is dead upstream and must never be used)
    frequency: quarterly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: dataset
        type: str
        description: Eurostat dataset code (always apri_pi_outq)
      - name: geo
        type: str
        description: Country/aggregate code (EU27_2020)
      - name: freq
        type: str
        description: Frequency code (Q quarterly)
      - name: unit
        type: str
        description: Unit code (I20 index 2020=100)
      - name: indic
        type: str
        description: Agricultural item code (AM141000)
      - name: s_adj
        type: str
        description: Seasonal adjustment code (always empty for this dataset)
      - name: nace_r2
        type: str
        description: NACE Rev.2 code (always empty for this dataset)
      - name: p_adj
        type: str
        description: Price adjustment code (NI nominal index)
      - name: period
        type: str
        description: Period label (YYYY-QN)
      - name: value
        type: float
        description: Price index value; upstream null cells are omitted, never fabricated
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
      - name: source_url
        type: str
        description: Exact API request URL the row was parsed from
  - command: run_eurostat_comext
    description: Fetch EU-China monthly trade (comext DS-045409, DSD v6.5) for the HS6 photosensitive-semiconductor family via the api/comext/dissemination SDMX 2.1 segment (the /statistics segment 404s for comext) — EU27_2020 reporter, CN partner, flow=1 EU imports (the China→EU export view; re-measured 2026-10-07 — the earlier flow=2 series was EU exports and was re-pointed), VALUE_IN_EUROS; products follow the HS revision break (854140 since 2018-01 ends 2021-12, HS2022 codes 854141/854142/854143/854149 since 2022-01); asserts a non-empty parse per product query (legacy reporter codes 1A/1Z yield silent empty sets)
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: dataset
        type: str
        description: Comext dataflow id (always DS-045409)
      - name: geo
        type: str
        description: Reporter code (EU27_2020, ISO codes only)
      - name: freq
        type: str
        description: Frequency code (M monthly)
      - name: unit
        type: str
        description: Indicator dimension of the dataflow (VALUE_IN_EUROS)
      - name: indic
        type: str
        description: Trade indicator (always VALUE_IN_EUROS)
      - name: s_adj
        type: str
        description: Seasonal adjustment code (always empty, not part of the comext DSD)
      - name: nace_r2
        type: str
        description: NACE Rev.2 code (always empty, not part of the comext DSD)
      - name: p_adj
        type: str
        description: Price adjustment code (always empty, not part of the comext DSD)
      - name: partner
        type: str
        description: Partner code (CN)
      - name: product
        type: str
        description: HS6 commodity code (854140 HS2017 until 2021-12; 854141/854142/854143/854149 HS2022 from 2022-01)
      - name: flow
        type: str
        description: Trade flow code (1 = EU imports, the China→EU export view; flow=2 = EU exports — direction re-measured 2026-10-07 with HS 360410, where flow=1 shows 19 consecutive import months vs 2 sporadic export observations)
      - name: period
        type: str
        description: Period label (YYYY-MM)
      - name: trade_value
        type: float
        description: Trade value in euros (EU imports from the partner under the pinned flow); missing observations are omitted, never fabricated
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
      - name: source_url
        type: str
        description: Exact API request URL the row was parsed from
  - command: run_eurostat_hicp
    description: Fetch HICP catering services price index (prc_hicp_midx, coicop=CP111, unit=I15 index 2015=100) for the EU27_2020 aggregate, monthly since 1996-01 (first actual values 2000-12, JSON-stat 2.0); restaurant-vertical wave 0 EU leg — the STS services-turnover datasets (sts_tsur family) are dead upstream and prc_hicp_inx is dead upstream (HTTP 404 "not available for dissemination", re-measured 2026-11-07), so the live index-level dataset prc_hicp_midx is used; asserts a non-empty parse
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: dataset
        type: str
        description: Eurostat dataset code (always prc_hicp_midx; prc_hicp_inx is dead upstream and must never be used)
      - name: geo
        type: str
        description: Country/aggregate code (EU27_2020)
      - name: freq
        type: str
        description: Frequency code (M monthly)
      - name: unit
        type: str
        description: Unit code (I15 index 2015=100; I05/I96 are the older bases in the dimension)
      - name: indic
        type: str
        description: COICOP classification code (CP111 catering services; CP11 restaurants and hotels)
      - name: s_adj
        type: str
        description: Seasonal adjustment code (always empty for this dataset)
      - name: nace_r2
        type: str
        description: NACE Rev.2 code (always empty for this dataset)
      - name: p_adj
        type: str
        description: Price adjustment code (always empty for this dataset)
      - name: period
        type: str
        description: Period label (YYYY-MM)
      - name: value
        type: float
        description: HICP index value (2015=100); upstream null cells are omitted, never fabricated
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
      - name: source_url
        type: str
        description: Exact API request URL the row was parsed from
  - command: run_eurostat_i56
    description: "Fetch EU27 NACE I56 (food and beverage service activities) turnover index (sts_setu_m, indic_bt=NETTUR, s_adj=SCA, unit=I21 index 2021=100) monthly since 2000-01 — restaurant-vertical wave 1 EU leg; corrects the earlier note that the whole STS services-turnover family is dead (sts_tsur_m is 404, sts_setu_m serves I56: 319 values 2000-01..2026-07, no gaps); asserts a non-empty parse"
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return (default 500 covers the full 319-month history)
    columns:
      - name: dataset
        type: str
        description: Eurostat dataset code (always sts_setu_m; sts_tsur_m is dead upstream, HTTP 404)
      - name: geo
        type: str
        description: Country/aggregate code (EU27_2020)
      - name: freq
        type: str
        description: Frequency code (M monthly)
      - name: unit
        type: str
        description: Unit code (I21 index 2021=100)
      - name: indic
        type: str
        description: Short-term business statistic indicator (NETTUR net turnover)
      - name: nace_r2
        type: str
        description: NACE Rev.2 activity code (I56 food and beverage service activities)
      - name: s_adj
        type: str
        description: Seasonal adjustment code (SCA calendar and seasonally adjusted)
      - name: p_adj
        type: str
        description: Price adjustment code (always empty for this dataset)
      - name: period
        type: str
        description: Period label (YYYY-MM)
      - name: value
        type: float
        description: Turnover index value (2021=100); upstream null cells are omitted, never fabricated
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
      - name: source_url
        type: str
        description: Exact API request URL the row was parsed from
  - command: run_eurostat_i55
    description: "Fetch EU27 NACE I55 (accommodation) turnover index (sts_setu_m, indic_bt=NETTUR, s_adj=SCA, unit=I21 index 2021=100) — hotel-vertical wave 0 EU supply leg; 139 values 2015-01..2026-07 measured 2026-11-08; the hotels-only branch nace_r2=I551 returns 0 values, so this is the accommodation aggregate, never a hotel-only series; asserts a non-empty parse"
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return (default 500 covers the full 139-month history)
    columns:
      - name: dataset
        type: str
        description: Eurostat dataset code (always sts_setu_m)
      - name: geo
        type: str
        description: Country/aggregate code (EU27_2020)
      - name: freq
        type: str
        description: Frequency code (M monthly)
      - name: unit
        type: str
        description: Unit code (I21 index 2021=100)
      - name: indic
        type: str
        description: Short-term business statistic indicator (NETTUR net turnover)
      - name: nace_r2
        type: str
        description: NACE Rev.2 activity code (I55 accommodation; I551 hotels is empty upstream)
      - name: s_adj
        type: str
        description: Seasonal adjustment code (SCA calendar and seasonally adjusted)
      - name: p_adj
        type: str
        description: Price adjustment code (always empty for this dataset)
      - name: period
        type: str
        description: Period label (YYYY-MM)
      - name: value
        type: float
        description: Turnover index value (2021=100); upstream null cells are omitted, never fabricated
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
      - name: source_url
        type: str
        description: Exact API request URL the row was parsed from
  - command: run_eurostat_tour_occ
    description: "Fetch EU27 nights spent at tourist accommodation establishments (tour_occ_nim, nace_r2=I551-I553) monthly for four series: c_resid=TOTAL/FOR x unit=NR/PCH_SM — hotel-vertical wave 0 EU demand leg; 188 values per series 2011-01..2026-08 measured 2026-11-08; asserts a non-empty parse"
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return (default 1000 covers 4 series x 188 months)
    columns:
      - name: dataset
        type: str
        description: Eurostat dataset code (always tour_occ_nim)
      - name: geo
        type: str
        description: Country/aggregate code (EU27_2020)
      - name: freq
        type: str
        description: Frequency code (M monthly)
      - name: unit
        type: str
        description: Unit code (NR number of nights, PCH_SM percentage change on same month previous year)
      - name: indic
        type: str
        description: Residence dimension carried on the indic column (TOTAL all residents, FOR foreign residents)
      - name: nace_r2
        type: str
        description: NACE Rev.2 activity code (I551-I553 the whole tourist accommodation sector)
      - name: s_adj
        type: str
        description: Seasonal adjustment code (always empty for this dataset)
      - name: p_adj
        type: str
        description: Price adjustment code (always empty for this dataset)
      - name: period
        type: str
        description: Period label (YYYY-MM)
      - name: value
        type: float
        description: Nights spent, or the year-on-year percentage change when unit=PCH_SM; upstream nulls omitted, never fabricated
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
      - name: source_url
        type: str
        description: Exact API request URL the row was parsed from
  - command: run_eurostat_tour_annual
    description: "Fetch EU27 nights spent at tourist accommodation establishments, annual (tour_occ_ninat, c_resid=TOTAL, unit=NR, nace_r2=I551) — hotel-vertical wave 0 EU demand leg; 21 non-null values 1990..2025 measured 2026-11-08 (header window is wider than the data; missing years stay missing)"
    frequency: yearly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return (default 200 covers the whole history)
    columns:
      - name: dataset
        type: str
        description: Eurostat dataset code (always tour_occ_ninat)
      - name: geo
        type: str
        description: Country/aggregate code (EU27_2020)
      - name: freq
        type: str
        description: Frequency code (A annual)
      - name: unit
        type: str
        description: Unit code (NR number of nights)
      - name: indic
        type: str
        description: Residence dimension carried on the indic column (TOTAL all residents)
      - name: nace_r2
        type: str
        description: NACE Rev.2 activity code (I551 hotels and similar accommodation)
      - name: s_adj
        type: str
        description: Seasonal adjustment code (always empty for this dataset)
      - name: p_adj
        type: str
        description: Price adjustment code (always empty for this dataset)
      - name: period
        type: str
        description: Period label (YYYY)
      - name: value
        type: float
        description: Nights spent; years with no EU27 value are omitted, never zero-filled
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
      - name: source_url
        type: str
        description: Exact API request URL the row was parsed from
  - command: run_eurostat_tour_cap
    description: "Fetch EU27 accommodation capacity in bed places, annual (tour_cap_nat, accomunit=BEDPL, unit=NR, nace_r2=I551) — hotel-vertical wave 0 EU supply leg; 21 values 2005..2025 measured 2026-11-08"
    frequency: yearly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return (default 200 covers the whole history)
    columns:
      - name: dataset
        type: str
        description: Eurostat dataset code (always tour_cap_nat)
      - name: geo
        type: str
        description: Country/aggregate code (EU27_2020)
      - name: freq
        type: str
        description: Frequency code (A annual)
      - name: unit
        type: str
        description: Unit code (NR absolute number)
      - name: indic
        type: str
        description: Capacity unit carried on the indic column (BEDPL bed places)
      - name: nace_r2
        type: str
        description: NACE Rev.2 activity code (I551 hotels and similar accommodation)
      - name: s_adj
        type: str
        description: Seasonal adjustment code (always empty for this dataset)
      - name: p_adj
        type: str
        description: Price adjustment code (always empty for this dataset)
      - name: period
        type: str
        description: Period label (YYYY)
      - name: value
        type: float
        description: Bed places; upstream nulls omitted, never fabricated
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
      - name: source_url
        type: str
        description: Exact API request URL the row was parsed from
  - command: run_eurostat_flower_area
    description: "Fetch EU flower main area, annual (apro_cpsh1, crops=N0000 Flowers and ornamental plants excluding nurseries, strucpro=MAR_THS_HA main area in thousand hectares), 8 geos incl EU27_2020 — flower-vertical 3.3. Measured live 2026-11-08: 41 geo x 12 years (2015-2026), 316 non-zero values; the area-only shape is a fact of the dataset (production/yield measures return 0 values for N0000), so this series is AREA, never 'production'"
    frequency: yearly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return (default 200 covers 8 geos x 12 years; this command does NOT share the unit's --limit 100 rotation)
    columns:
      - name: dataset
        type: str
        description: Eurostat dataset code (always apro_cpsh1)
      - name: geo
        type: str
        description: Country/aggregate code (EU27_2020, NL, IT, DE, FR, ES, PL, BE)
      - name: freq
        type: str
        description: Frequency code (A annual)
      - name: unit
        type: str
        description: Unit code (always empty for this dataset; the measure lives in strucpro)
      - name: crops
        type: str
        description: Crop code (N0000 flowers and ornamental plants, excluding nurseries)
      - name: strucpro
        type: str
        description: Structure/production measure (MAR_THS_HA main area, thousand hectares)
      - name: indic
        type: str
        description: Always empty for this dataset (kept for row-shape parity)
      - name: nace_r2
        type: str
        description: Always empty for this dataset (kept for row-shape parity)
      - name: s_adj
        type: str
        description: Always empty for this dataset (kept for row-shape parity)
      - name: p_adj
        type: str
        description: Always empty for this dataset (kept for row-shape parity)
      - name: period
        type: str
        description: Reference year (YYYY)
      - name: value
        type: float
        description: Main area in thousand hectares; upstream nulls omitted, never interpolated
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
      - name: source_url
        type: str
        description: Exact API request URL the row was parsed from
concepts:
  # run_eurostat_api / _c20 / _bsci / _apri: index & survey-balance semantics.
  - column: value
    concept: economic.index_value
    entity_type: country
    measure: value
    unit: index
    frequency: monthly
  # run_eurostat_comext: EUR trade amounts (金额 ≠ 指数 — a dedicated measure
  # column keyed to its own concept, mirroring the un-comtrade primary_value
  # pattern; a monetary amount must not bind to economic.index_value).
  - column: trade_value
    concept: economic.trade_value
    entity_type: country
    measure: value
    unit: EUR
    frequency: monthly
  # run_eurostat_hicp: restaurant-vertical wave 0 — HICP catering services
  # (CP111) price index, EU27_2020; the semantic_observations extractor
  # (scripts/restaurant_extractors/eurostat_api.py) writes it under the same
  # concept code with unit index_2015_100.
  - column: value
    concept: hicp.eu.catering.monthly
    entity_type: country
    measure: value
    unit: index_2015_100
    frequency: monthly
entities:
  - entity_type: country
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
