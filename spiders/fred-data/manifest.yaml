version: "1"
name: fred-data
label: FRED Economic Data
source_url: https://data.fred.stlouisfed.org/
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_fred_data
    description: Fetch economic data series listings from FRED (Federal Reserve Economic Data)
    frequency: on_demand
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: series_id
        type: str
        description: FRED series identifier
      - name: title
        type: str
        description: Series title
      - name: description
        type: str
        description: Series description
      - name: url
        type: str
        description: Series URL on FRED
      - name: frequency
        type: str
        description: Data frequency (Quarterly, Monthly, etc.)
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
concepts:
  - column: title
    concept: economic.series_title
    entity_type: country
    measure: value
    unit: string
    frequency: quarterly
entities:
  - entity_type: country
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
