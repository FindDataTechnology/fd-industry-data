schedule: "3 4 6 * *"
# 低频源：一次抖动就是整窗空档（月/季/年），故给 3 次重试。
backoff_limit: 3
data_period: month
# site 已退役（2026-11-14）：原为 `site: xinru-server2`，该站点已无执行器（k3s 里没有
# scraw 命名空间），源自 2026-11-06 起零产出。tencent 出口用真 spider 实跑验过：
# `success rows=24 in 11.7s`，是该源历史最好的一次（历史成功 5 次，max 24 / avg 18）
# ⇒ 海外站点 worldsteel.org 从云出口可达，不需要那台机上的 gost-egress/mihomo。
# fd-open-data-protocol compliant manifest

name: worldsteel
label: "世界钢铁协会"
description: "World Steel Association provides global steel industry data, statistics, reports, and market insights."
source_url: "https://worldsteel.org"
priority_score: 92
created_at: 2026-08-01T12:00:00

function_definitions:
  - name: fetch_worldsteel
    description: "Fetch steel industry data and reports"
    parameters:
      - name: urls
        type: array<string>
        optional: true
      - name: limit
        type: integer
        optional: true
        default: 500
    returns: array<object>

column_schemas:
  - name: source_url
    type: string
  - name: page_title
    type: string
  - name: report_title
    type: string
  - name: publish_date
    type: string
  - name: category
    type: string
  - name: download_url
    type: string
  - name: description
    type: string
  - name: scraped_at
    type: timestamp

commands:
  - name: fetch
    command: "python spider.py --urls <url1>"
  - name: dry-run
    command: "python spider.py --dry-run"
# 接入声明（change: define-ingest-revision-and-coverage, decision 4A）
revision_policy: overwrite_with_history
coverage_capability: gaps_only
