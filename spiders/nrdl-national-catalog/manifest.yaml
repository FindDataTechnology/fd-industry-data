version: "2"
name: nrdl-national-catalog
label: 国家医保药品目录条目 (NRDL national drug catalog, annual edition)
source_url: http://www.nhsa.gov.cn/art/2025/12/7/art_104_18970.html
# 官方 PDF 附件驱动：通知页与附件均 200 可下载，文本层用共享 pdftext 抽取（无 OCR）。
# 年度版 → 每年发一次；本单元在目录发布后按 schedule 重灌以取得新版条目。
schedule: "19 3 8 1 *"             # 每年 1 月 8 日 03:19（目录通常 12 月发布、次年 1 月 1 日执行）
# 低频源：一次抖动就是整窗空档（月/季/年），故给 3 次重试。
backoff_limit: 3
data_period: year
data_period_field: catalog_year   # 水位字段 = 目录年度版
# 事实定型与修订窗：目录条目绑定目录年度版（不是某月观测）。annual 粒度的
# 定型基数为次年 12-31，覆盖「次年目录发布前官方仍会调整归类」的真实节奏。
revision_policy: overwrite_with_history
finalize_grace_days: 0
scanner_mode: upstream-curated
ranking_seed: [0.95, 0.75]
# 每轮行数上限（AppSet 渲染成 --limit，chart 缺省只有 100 → 只会落 100 行）：
# 本单元是**年度全量快照**，实测 4835 行（3911 目录条目 + 892 饮片 + 32 黑名单行），
# 故取 5000 留余量。
# 注意 writer 侧还有一层落库上限（默认 1000，仅回填窗口运行会抬到 100000）——
# 若生产只落下 1000 行，那是 writer 的 cap 而不是本参数，见 tasks/说明。
limit: 5000
functions:
  - command: run_nrdl_national_catalog
    description: >
      Download the NRDL notice PDF attachment and parse all four sections
      (西药 1446 / 中成药 1335 / 谈判药品 472 / 中药饮片 892) plus the
      herbal exclusion list ((二)不得纳入基金支付范围: 31 names + 1 category). Parsing note:
      spiders/nrdl-national-catalog/spider.py — `parse_catalog_text` handles the
      clean-layout sections by TOC page ranges + `第 N 页` footers;
      `parse_negotiated_words` handles the six-column negotiated section by
      word-level bbox x-coordinates, dropping the 医保支付标准 column whole;
      `parse_herbal_slice` handles the herbal section by splitting each page's
      two side-by-side column groups on x (item numbers must be exactly 1..892,
      names must be unique), turning the □ marker into payable_standalone and
      binding wrapped notes to the nearest entry row;
      `parse_excluded_slice` parses the herbal exclusion list as free text
      (line-join for hyphen-free breaks, paren-aware splitting for aliases,
      the trailing 类目 line kept as kind='category').
      `counts` must equal the preface's declared 1446/1335/472/892 or the unit
      fails; any amount-shaped token in any field fails the run.
    frequency: annual
    parameters:
      - name: limit
        type: int
        required: false
        description: Return at most N rows (0/absent = all parsed rows). Note the runner passes its own --limit as this parameter, so a production run needs --limit above the row count (3911)
    columns:
      - name: catalog_year
        type: int
        description: 目录年度版（如 2025），本单元的水位字段
      - name: section
        type: str
        description: 目录部分（西药 / 中成药 / 谈判药品 / 中药饮片）
      - name: subsection
        type: str
        description: 谈判段内的分部（西药 / 中成药）；西药与中成药两段为 null
      - name: pricing_channel
        type: str
        description: 谈判段内的准入渠道（谈判 / 竞价）；西药与中成药两段为 null
      - name: category
        type: str
        description: 所属分类（西药为 ATC 码 + 名称，中成药为功能分类），原样保留
      - name: class_ab
        type: str
        description: 甲乙类（甲 / 乙）
      - name: item_no
        type: int
        description: 该部分内的品种编号；与 section 联合构成事实地址（三部分各自从 1 编号）
      - name: is_variant
        type: bool
        description: 是否为 ★ 剂型变体（同品种的另一种剂型，不新增品种编号）
      - name: drug_name
        type: str
        description: 药品通用名（官方写法，含盐基/酸根时按官方原样）
      - name: dosage_form
        type: str
        description: 剂型（官方写法，如 口服常释剂型 / 注射剂）；未列剂型时为 null
      - name: coverage_restriction
        type: str
        description: 医保支付范围限定（官方备注列，如「限伴有出血的胃、十二指肠溃疡。」）；无则 null。列名避开 payment 词根——本列是限制条款文本，不含金额
      - name: agreement_valid_from
        type: str
        description: 协议期起（谈判药品段专有，YYYY-MM-DD）；其他段为 null
      - name: agreement_valid_to
        type: str
        description: 协议期止（谈判药品段专有，YYYY-MM-DD）；其他段为 null。用于"哪些药今年到期"
      - name: payable_standalone
        type: bool
        description: >
          单独使用时是否由统筹基金支付。仅中药饮片段有值：备注列标注「□」的为 false
          （凡例：单独使用不予支付，且全部由这些饮片组成的处方也不予支付）；其他段与
          黑名单行为 null（不适用）
      - name: payment_scope
        type: str
        description: >
          支付范围归属（payable / excluded）。excluded 指「(二) 不得纳入基金支付范围」
          黑名单行，它们不是目录条目、没有品种编号，计数与地址都按另一套规则处理
      - name: kind
        type: str
        description: 行种类（drug / category）。category 只出现在黑名单段末尾那行
          「各种动物脏器…」，它是排除类目而不是药名
      - name: aliases
        type: str
        description: 括号内别名（列表），如 穿山甲 → [醋山甲, 炮山甲]；无别名时为 null。入方常写别名，匹配时需要
      - name: source
        type: str
        description: 数据源标识，恒为 nrdl-national-catalog
      - name: scraped_at
        type: str
        description: 采集时刻 (UTC ISO8601)
concepts: []
entities: []
