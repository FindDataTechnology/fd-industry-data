version: "2"
name: census-m3              # = spiders/census-m3/ 目录名，运行时标识符，合入后不可改名
label: US Census M3 Manufacturers' Shipments, Inventories & Orders (MTM total, 2020-01 NSA)
source_url: https://api.census.gov/data/timeseries/eits/m3
# site: tencent              # 缺省 tencent；本单元只访问 api.census.gov 公开 REST，无需换执行位
# schedule: 暂缓点亮——api.census.gov 从 tencent 站 Errno 101 不可达（2026-10-07 首爬实证），待代理出口/换站
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_census_m3
    description: Fetch 2020-01 NSA manufacturing total (category MTM) shipments/inventories/orders indicator values from Census EITS M3 API (key= query param from CENSUS_API_KEY)
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum number of indicator rows to return (16 rows for the fixed 2020-01 window)
    columns:
      - name: time
        type: string
        description: Observation month (yyyy-mm, fixed 2020-01)
      - name: category_code
        type: string
        description: M3 mnemonic category (MTM = total manufacturing; NAICS 6-digit codes are not accepted by the m3 endpoint)
      - name: data_type_code
        type: string
        description: Indicator code (VS = shipments, NO = new orders, MI/WI/FI/TI = inventories, UO = unfilled orders, IS/US = ratios, MPC* = month-over-month pct change)
      - name: seasonally_adj
        type: string
        description: Seasonal adjustment flag (fixed "no" = not seasonally adjusted)
      - name: cell_value
        type: float
        description: Indicator value (millions of USD for VS/NO/MI/WI/FI/TI/UO levels, ratio/percent for IS/US/MPC*)
      - name: time_slot_id
        type: string
        description: EITS time slot id ("0" = monthly)
      - name: url
        type: string
        description: Source request URL for the row
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: cell_value
    concept: economic.indicator_value
    entity_type: region
    measure: value
    unit: mixed
    frequency: monthly
entities:
  - entity_type: region
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
