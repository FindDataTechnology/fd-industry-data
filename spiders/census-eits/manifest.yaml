version: "2"
name: census-eits            # = spiders/census-eits/ 目录名，运行时标识符，合入后不可改名
label: US Census EITS Monthly Retail (MARTS) & Wholesale (MWTS) Sales/Inventories, 2020-01 NSA
source_url: https://api.census.gov/data/timeseries/eits/mrts
# site: tencent              # 缺省 tencent；本单元只访问 api.census.gov 公开 REST，无需换执行位
schedule: "32 4 29 * *"       # 点亮（批次二 Wave B）：monthly
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_census_eits
    description: Fetch 2020-01 NSA retail (eits/mrts, category 44X72) and wholesale (eits/mwts, category 42) indicator values from Census EITS API (key= query param from CENSUS_API_KEY)
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum number of indicator rows to return (14 rows for the fixed 2020-01 window)
    columns:
      - name: program
        type: string
        description: EITS program id (mrts = monthly retail, mwts = wholesale)
      - name: time
        type: string
        description: Observation month (yyyy-mm, fixed 2020-01)
      - name: category_code
        type: string
        description: EITS category (44X72 = retail trade & food services total, 42 = merchant wholesalers total)
      - name: data_type_code
        type: string
        description: Indicator code (SM = sales, IM = inventories, IR = inventories/sales ratio, MPC* = month-over-month pct change, E_* = sampling error)
      - name: seasonally_adj
        type: string
        description: Seasonal adjustment flag (fixed "no" = not seasonally adjusted)
      - name: cell_value
        type: float
        description: Indicator value (millions of USD for SM/IM levels, percent for MPC*/ratio codes)
      - name: time_slot_id
        type: string
        description: EITS time slot id ("0" = monthly)
      - name: url
        type: string
        description: Source request URL for the row
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: cell_value
    concept: economic.indicator_value
    entity_type: region
    measure: value
    unit: mixed
    frequency: monthly
entities:
  - entity_type: region
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
