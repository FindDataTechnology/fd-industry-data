version: "2"
name: imf-pcps                 # = spiders/imf-pcps/ 目录名，运行时标识符，合入后不可改名
label: IMF Primary Commodity Price System (PCPS)
source_url: https://data.imf.org/en/datasets/imf-res:pcps
# site: tencent              # 缺省 tencent；本单元只访问 api.imf.org 公开 SDMX REST，无需换执行位
schedule: "18 1 12 * *" # 点亮（批次二）：每月 12 日 01:18；初级商品价格指数月度
data_period: month
# 每轮行数上限。全量解析后 `rows[-limit:]` 切片（spider.py:141），**请求数是固定的**
# （种子 key 集合不随 limit 变），抬高上限不增加上游负担。
# 全集 = 3 条种子序列（PCOIL/PPOIL/PSUGA）× 各 418 期（1992-M01..2026-M10）= **1,254 行**。
# 实测过程（2026-11-11，三次，每次都踩到一个坑，都记下来）：
#   · 用镜像内 /content/spiders 直接 import 量到 **418 行** → **错**。镜像内容比 HEAD 旧，
#     那时 SEED_SERIES 只有 PCOIL 一条 key；而生产运行是 run 时 checkout 最新代码。
#     ⇒ 教训：量全集必须在**生产用的那份代码**上量，不能用镜像里的烘焙副本。
#   · 真跑 limit=600 → 恰好 600（=上限）；limit=1200 → 恰好 1200（=上限）
#     ⇒ 该源的返回值很容易正好顶到上限，必须留足余量。
# 吃默认 limit=100 时只落 100 行（7.9%），且 `rows[-limit:]` 从尾部切——丢掉的是**最早
# 的期次**（1992 起的历史），历史期次不会因下一轮运行回来。
# 取 1600（1254 的 1.28 倍余量，容纳月份增长）。落库闸：limit ≥ 1000，
# chart 会把 FD_WRITER_MAX_ITEMS 同步成同一个值（见 f934d6a）。
limit: 1600
min_rows_per_run: 30    # 粗下限（取自修复前的 p10=68 的一半）。注意原注释「p50=100」
                        # 是被默认上限截断的假象：limit 覆盖 1,254 行全集后 p50 会升到千级
                        # （见 docs/limit-truncation-sweep-2026-11-11.md）
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_imf_pcps
    description: Fetch IMF PCPS commodity price series (SDMX-ML) from api.imf.org
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum number of observation rows to return (most recent kept)
      - name: series
        type: string
        required: false
        description: "PCPS series key COUNTRY.INDICATOR.DATA_TRANSFORMATION.FREQ (default seeds G001.PCOIL.INDEX.M / G001.PPOIL.INDEX.M / G001.PSUGA.INDEX.M = World coconut oil / palm oil / sugar monthly index 2016=100); extend to other commodity codes from the DSD CL_COMMODITY codelist (palm oil is PPOIL; PPALM is invalid)"
    columns:
      - name: period
        type: string
        description: SDMX time period (monthly format, e.g. 2020-M01)
      - name: value
        type: float
        description: Observation value (index number, rounded to 6 decimals; null when missing)
      - name: series_key
        type: string
        description: Full PCPS series key (e.g. G001.PCOIL.INDEX.M)
      - name: country
        type: string
        description: Country/region code (G001 = World)
      - name: indicator
        type: string
        description: Commodity indicator code (PCOIL = coconut oil, PPOIL = palm oil, PSUGA = sugar; base quotes US$/mt per DSD, INDEX transformation rescales to 2016=100)
      - name: data_transformation
        type: string
        description: Data transformation code (INDEX = index number)
      - name: frequency
        type: string
        description: Series frequency code (M = monthly)
      - name: url
        type: string
        description: Source request URL for the row
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: value
    concept: commodity.price_index
    entity_type: region
    measure: value
    unit: index
    frequency: monthly
  - column: value
    concept: price.palm_oil.imf.monthly
    entity_type: country
    measure: value
    unit: index_2016_100
    frequency: monthly
  - column: value
    concept: price.sugar.imf.monthly
    entity_type: country
    measure: value
    unit: index_2016_100
    frequency: monthly
entities:
  - entity_type: region
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
# 接入声明（change: define-ingest-revision-and-coverage, decision 4A）
revision_policy: overwrite_with_history
coverage_capability: gaps_only
