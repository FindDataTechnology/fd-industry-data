version: "1"
name: cssn
label: 中国社会科学网
source_url: https://www.cssn.cn/
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_cssn
    description: Fetch metadata and research articles from CSSN (中国社会科学网)
    frequency: on_demand
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: title
        type: str
        description: Article or page title
      - name: description
        type: str
        description: Article or page description
      - name: url
        type: str
        description: Source URL
      - name: source
        type: str
        description: Data source name
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
concepts:
  - column: title
    concept: document.title
    entity_type: organization
    measure: value
    unit: string
    frequency: on_demand
entities:
  - entity_type: organization
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
