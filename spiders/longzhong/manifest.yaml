name: longzhong
label: 隆众资讯
source_url: https://www.oilchem.net/
description: |
  隆众资讯官方数据，包括石油化工产品价格、油气市场数据、
  化工行业统计和进出口贸易数据。覆盖原油、天然气、
  石油化工、有机化工、合成树脂、合成橡胶、化纤等品类。

authentication:
  required: false
  type: none
  notes: |
    公开页面数据无需登录。详细价格数据和深度分析报告需要付费订阅。
    Public pages accessible without login. Detailed price data and
    in-depth reports require paid subscription.

rate_limiting:
  download_delay: 2
  concurrent_requests: 1
  notes: 建议2秒延迟

anti_bot:
  method: browser_impersonation
  details: Chrome browser impersonation with stealthy headers

functions:
  - command: get_longzhong_data
    description: 获取隆众资讯石油化工数据
    category: industry-data
    frequency: daily
    parameters:
      include_market:
        type: bool
        description: 是否抓取市场供需数据
        default: true
      include_trade:
        type: bool
        description: 是否抓取进出口贸易数据
        default: true
      include_reports:
        type: bool
        description: 是否抓取行业报告
        default: true

columns:
  prices:
    date:
      type: str
      description: 日期
    product:
      type: str
      description: 产品名称
    product_cn:
      type: str
      description: 产品名称（中文）
    category:
      type: str
      description: 产品类别（oil/gas/petrochemical/organic/polymers/rubber/fiber）
    price:
      type: float
      description: 价格
    price_unit:
      type: str
      description: 价格单位（元/吨）
    price_change:
      type: float
      description: 涨跌额
    price_change_pct:
      type: float
      description: 涨跌幅（%）
    price_high:
      type: float
      description: 最高价
    price_low:
      type: float
      description: 最低价
    market_location:
      type: str
      description: 市场地区
  market:
    date:
      type: str
      description: 日期
    product:
      type: str
      description: 产品名称
    supply:
      type: float
      description: 供应量
    demand:
      type: float
      description: 需求量
    inventory:
      type: float
      description: 库存量
    operating_rate:
      type: float
      description: 开工率
    import_volume:
      type: float
      description: 进口量
    export_volume:
      type: float
      description: 出口量
    market_trend:
      type: str
      description: 市场趋势
  reports:
    date:
      type: str
      description: 发布日期
    title:
      type: str
      description: 报告标题
    category:
      type: str
      description: 类别（daily_report/weekly_report/monthly_report）
    product:
      type: str
      description: 相关产品
    summary:
      type: str
      description: 摘要

output:
  sqlite:
    path: data/longzhong.db
    tables:
      - price_data
      - market_data
      - industry_reports
  json:
    - path: output/longzhong_prices.json
      description: 价格数据
    - path: output/longzhong_market.json
      description: 市场数据
    - path: output/longzhong_reports.json
      description: 行业报告
