version: "2"
name: unido-sdmx            # = spiders/unido-sdmx/ 目录名，运行时标识符，合入后不可改名
label: UNIDO Industrial Production Index (IIP, Monthly)
source_url: https://stat.unido.org/portal/
# site: tencent              # 缺省 tencent；本单元只访问 stat.unido.org 公开 SDMX REST，无需换执行位
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_unido_sdmx
    description: Fetch monthly Indices of Industrial Production (IIP) rows from UNIDO SDMX API (seed country China 156, original index, total manufacturing)
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum number of monthly observation rows to return
    columns:
      - name: country
        type: string
        description: ISO numeric country code as sent in the SDMX key (e.g. 156 = China)
      - name: country_name
        type: string
        description: Country name resolved from the IIP datastructure enumeration (null when the structure lookup fails)
      - name: indicator
        type: string
        description: IIP indicator code (52 = Original index, 53 = Seasonally adjusted index)
      - name: classification
        type: string
        description: ISIC classification code of the series (C = Total manufacturing)
      - name: classification_name
        type: string
        description: Classification name resolved from the IIP datastructure enumeration (null when the structure lookup fails)
      - name: period
        type: string
        description: Monthly SDMX time period (YYYY MXX, e.g. 2020 M01); annual/quarterly periods are filtered out
      - name: value
        type: float
        description: Industrial production index value (indicator 52 original index)
      - name: url
        type: string
        description: Source request URL for the row
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: value
    concept: economic.index_value
    entity_type: country
    measure: value
    unit: index
    frequency: monthly
entities:
  - entity_type: country
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
