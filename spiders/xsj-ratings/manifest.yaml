version: "2"
name: xsj-ratings          # = spiders/xsj-ratings/ 目录名；合入后不可改名
label: Shanghai Xinshijie (新世纪评级) credit-rating announcements — bank tracking-rating reports
source_url: http://www.shxsj.com/
# site: 缺省 —— 官网仅 HTTP（https:443 拒连、http 200，2026-11-08 实测，见 README 证据表）
schedule: "57 9 * * 5"    # 周五 UTC 09:57 巡检（错峰由 batch6_schedule_fit 选槽）；评级报告随发行人披露节奏发布，周频足够
data_period: irregular     # 评级公告没有固定统计期：按发行人跟踪评级披露日零散发布；周巡检+按 add_time 落库
scanner_mode: upstream-curated
functions:
  - command: run_xsj_ratings
    description: >-
      Fetch Xinshijie (新世纪评级) rating announcements from the HTTP-only Vue
      SPA's JSON API (serve/api/article_api/get_cid_article): cid=50 评级公告,
      server-side keyword filter (default 银行) and rank_type filter (default
      跟踪评级), fixed 15 items/page. One row per rating announcement with the
      PDF attachment object (name + absolute url), project ratings
      (main_type/bound_type/rank_level/rank_time), the bank name derived from
      the issuer string, and an optional pdftotext first-page subject with
      inter-character spaces removed.
    frequency: weekly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum rows returned (default 200)
      - name: keyword
        type: string
        required: false
        description: Server-side keyword filter (default "银行"; empty string disables it). Measured 29993 → 1081 records.
      - name: pages
        type: int
        required: false
        description: Number of consecutive pages fetched from `page` (upstream fixed 15 records/page; default 3 = 45 candidates)
      - name: rank_type
        type: string
        required: false
        description: Server-side rating-type filter (default "跟踪评级"; measured to cut cid=50+keyword=银行 from 1081 to 824; empty string disables it)
      - name: cid
        type: int
        required: false
        description: Upstream column id (default 50 = 评级公告 root; children 51 首次评级 / 61 跟踪评级 / 207 主动评级 / 71 其他信息)
      - name: page
        type: int
        required: false
        description: Starting page, 1-based (default 1); lets golden pin a stable page while the list rolls
      - name: period
        type: string
        required: false
        description: "YYYY-MM filter on rating_date (fallback published_at); empty = no filter. Used by golden to pin a month."
      - name: pdf_text
        type: boolean
        required: false
        description: When true, download each row's PDF (≈5 MB) and fill pdf_subject via pdftotext first page after inter-character space cleanup; default false
    columns:
      - name: doc_id
        type: int
        description: Upstream article id (stable primary key of the announcement)
      - name: cid
        type: string
        description: Leaf column id (67 金融债券 for bank financial bonds)
      - name: category
        type: string
        description: Leaf column name as published (金融债券 / 二级资本债券 …)
      - name: nav_path
        type: string
        description: Navigation breadcrumb joined with "/" (评级公告/跟踪评级/金融债券)
      - name: rank_type
        type: string
        description: Rating type as published (跟踪评级 / 首次评级 / 主动评级 / --)
      - name: bank_name
        type: string
        description: Bank name parsed from the issuer string prefix after stripping a leading YYYY年 (e.g. 2023年浙江义乌农村商业银行… → 浙江义乌农村商业银行)
      - name: issuer
        type: string
        description: Issuer / bond full name as published (project.issuer)
      - name: issuer_rating
        type: string
        description: Issuer credit rating (project.main_type, e.g. AA+); upstream "--" kept as-is
      - name: bond_rating
        type: string
        description: Bond credit rating (project.bound_type, e.g. AA+/A+); upstream "--" kept as-is
      - name: outlook
        type: string
        description: Rating outlook (project.rank_level, e.g. 稳定)
      - name: rating_date
        type: string
        description: Rating date YYYY-MM-DD (project.rank_time)
      - name: published_at
        type: string
        description: Announcement publish date YYYY-MM-DD (add_time)
      - name: pdf_name
        type: string
        description: Attachment label (跟踪评级报告 / 信用评级报告 / PDF查看)
      - name: pdf_url
        type: string
        description: Absolute PDF URL (http://www.shxsj.com + /uploadfile/…); path segments are percent-encoded upstream
      - name: pdf_subject
        type: string
        description: First-page issuer name from pdftotext after inter-character space cleanup; empty unless pdf_text=true
      - name: source
        type: string
        description: Data source identifier (constant "xsj-ratings")
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: issuer_rating
    concept: banking.credit_rating
    entity_type: bank
    measure: rating
    unit: rating_grade
    frequency: irregular
entities:
  - entity_type: bank
    coverage: bank_issuers_in_scope
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
# 接入声明（change: define-ingest-revision-and-coverage, decision 4A）
revision_policy: overwrite_with_history
coverage_capability: gaps_only
