version: "1"
name: cisa
label: "中国钢铁工业协会 (China Iron and Steel Association)"
source_url: https://www.cisa.org.cn/
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
schedule: "29 1 5,15,25 * *"
# 低频源：一次抖动就是整窗空档（月/季/年），故给 3 次重试。
backoff_limit: 3
data_period: month
min_rows_per_run: 25    # runs=6 p10=60 p50=100; p10=60，取 25 — 见 docs/min-rows-coverage-baseline.md §3
# 每轮行数上限。双通道合并后 `results[:limit]` 切片（spider.py:703），且通道内部以
# `collected >= limit` 提前停。实测（2026-11-11，集群内 limit=200000）：完整全集 = **200 行**
# （chinaisa 门户 + legacy 两通道合计，换任何更高的上限都不再增加）。
# 吃默认 limit=100 时每轮只落一半（丢 50%），且 legacy 通道会先吃满额度、
# 门户通道几乎拿不到行（`results.extend(_run_cisa_legacy(...))` 先跑）。
# 取 300（200 的 1.5 倍余量）。落库闸：writer 默认 1000，不受影响。
limit: 300
functions:
  - command: run_cisa
    description: "fd-runner 唯一入口（并入两通道）：chinaisa.org.cn 门户为主（旬报/周价格/统计发布），legacy cisa.org.cn 通道异常自动吞掉记 warning"
    frequency: on_demand
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: id
        type: integer
        description: Primary key
      - name: title
        type: string
        description: Page title
      - name: description
        type: string
        description: Page description
      - name: url
        type: string
        description: Source URL
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp
  - command: get_chinaisa_data
    description: 中钢协数据门户 (chinaisa.org.cn) 统计发布与综合价格指数栏目列表：粗钢产量旬报/钢材库存旬报 + 周度八品种价格及指数
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: report_type
        type: string
        description: 稿件类型（旬报 / 周价格指数 / 统计发布）
      - name: title
        type: string
        description: 稿件标题
      - name: publish_date
        type: string
        description: 发布日期 (YYYY-MM-DD)
      - name: url
        type: string
        description: 稿件详情/附件链接
      - name: value
        type: float
        description: 数值（列表层不可解析，为空）
      - name: unit
        type: string
        description: 单位（列表层不可解析，为空）
      - name: scraped_at
        type: string
        description: ISO timestamp
      - name: source_url
        type: string
        description: 栏目列表页 URL
concepts:
  - column: title
    concept: organization.name
    entity_type: organization
    measure: value
    unit: string
    frequency: on_demand
entities:
  - entity_type: organization
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
# 接入声明（change: define-ingest-revision-and-coverage, decision 4A）
revision_policy: overwrite_with_history
coverage_capability: gaps_only
