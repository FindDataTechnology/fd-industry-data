version: '1'
name: kitco
label: Kitco Precious Metals
source_url: https://www.kitco.com
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: get_kitco_data
  description: Scrape precious and base metal price data from Kitco
  frequency: daily
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  - name: urls
    type: list
    required: false
    description: Custom URLs to scrape
  columns:
  - name: title
    type: str
    description: Metal price title
  - name: description
    type: str
    description: Description text
  - name: url
    type: str
    description: Source URL
  - name: source
    type: str
    description: Data source identifier
  - name: scraped_at
    type: str
    description: Scrape timestamp
concepts:
- column: title
  concept: metal.precious_price
  entity_type: industry
  measure: price
  unit: usd
  frequency: daily
entities:
- entity_type: industry
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
