version: '1'
name: flower-auction
label: 昆明国际花卉拍卖中心（KIFA·kifa.net）
source_url: https://www.kifa.net
# ── 复活评估留痕（add-flower-vertical 2.5，实测 2026-11-08，仍 parked）────────────
# 结论：**全站**（含首页）HTTP/2 468，雷池 SafeLine WAF 的 JS 挑战，不是端点级故障。
# 实测（带完整 Chrome 请求头 + HTTP/2 直连，非云出口，四个 URL 结果完全一致）：
#   468 · server: Tengine · content-length: 14863
#   set-cookie: sl-session=<每次新值>; SameSite=None; Secure; HttpOnly
#   正文含 /.safeline/static/favicon.png 与 challenge.rivers.chaitin.cn/challenge/v2/challenge.js
# 与旧 park 记录的差异（重要）：旧记录说「需非云出口」，本次从非云出口直连**仍然 468**，
#   故决定性闸门是**浏览器会话执行 JS 挑战**，换出口不解决；两个条件都要，只换出口无用。
# 解锁条件（全满足才可复活，成本 L）：
#   1. 具备 JS 执行与指纹能力的浏览器会话（playwright/chromium，需过 challenge v2，
#      不能只靠 impersonate=chrome 的 HTTP 指纹）；
#   2. 稳定非云出口 + 会话 cookie（sl-session 24h 有效）复用，登录态池可承载；
#   3. 挑战机理随雷池版本变动 → 复活后必须纳入健康级巡检（验证码/468 双路反馈）。
# ── 2026-11-08 二次实测（浏览器闯关成功，结论更新）──────────────────────────
# 用真实 Chromium 打开 https://www.kifa.net/：先显示
#   「Security Detection Powered By SafeLine WAF Client Verifying . . .」
#   **约 15 秒后自动放行**，落地真实首页（title=昆明国际花卉拍卖交易中心）。
# 即：**闸门不是「不可突破」，而是「必须执行 JS 挑战」**——裸 HTTP 永远拿不到。
#
# 放行后的真实数据入口（README 里说「不存在」的三条路径是错的，真实入口是 *.do）：
#   价格指数   /kIFAPriceIndex.do?method=index
#   大类走势   /breedQuotation.do?method=index
#   JSON 接口  /breedQuotation.do?method=getInfo&breed=<id>
#              id：玫瑰=111 / 康乃馨=112 / 非洲菊=120（页面 <select> 的真实取值，
#              传中文名会返回 []）
#   返回形状   [{"timeString":"20261102","avgPrice":0.32,"highestPrice":3.02}, ...]
#              实测玫瑰返回 6 天（20261102–20261107），日频。
#
# 为什么仍然 parked（这次的依据更硬）：
#   * 过挑战后的 cookie 只有 `sl-challenge-server` 与
#     `safeline-<sha256>-key`——**后者是 JS 现场算出来的挑战令牌**；
#     裸 curl 即使带上 sl-session 仍是 468（已实测），所以真爬必须常驻浏览器上下文。
#   * 也就是说「拿一次 cookie 复用」不成立：令牌与会话绑定且随挑战版本变化，
#     复活=常驻 playwright + 跟随雷池版本维护，成本远高于只读 6 天日频数据的收益。
#   * 数据增量有限：仅 3 个大类（玫瑰/康乃馨/非洲菊）的均价+最高价，6 天滚动；
#     斗南日价已按 23 个品种逐日覆盖同类现货信息。
# ⚠️ 自动化浏览器被点名拒绝（同日第三次实测，推翻了上一条「playwright 常驻」的设想）：
#   playwright 三种配置全部失败——headless / headless=False / headless=False+channel="chrome"
#   （含 ignore_default_args=["--enable-automation"]、webdriver 抹除、反节流参数、鼠标活动），
#   60 秒后页面仍停在挑战页，正文明确写：
#     「安全检测能力由 雷池 WAF 驱动 确认 客户端异常，请确认您是合法用户」
#   而应用内真实 Chrome（带用户配置）约 15 秒即放行。
#   → 结论：**它主动拒绝自动化客户端**，不是「跑不动 JS」。
# 复活条件（收紧，成本 L→XL）：
#   只接受**真实桌面浏览器会话**产出的数据（人工导出 / 浏览器扩展 / 半自动点击），
#   或放弃该源。**不要再用 playwright 硬闯**——那是检测规避，违反本项目「不逆向反爬」红线，
#   而且已经证明无效。
# 状态：parked: true，`schedule` 故意不写——复活前不得被调度。
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: run_flower_auction
  description: Fetch flower auction results, price data, and market analysis from
    KIFA (kifa.net). Parked — the whole site currently answers HTTP/2 468 with a
    SafeLine WAF JS challenge, so no run can succeed; see the header note for the
    measured evidence and the unlock conditions.
  frequency: daily
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  columns:
  - name: auction_date
    type: str
    description: Auction date
  - name: date
    type: str
    description: Price data date
  - name: flower_name
    type: str
    description: Flower name
  - name: variety
    type: str
    description: Flower variety
  - name: spec
    type: str
    description: Flower specification/grade
  - name: quantity
    type: str
    description: Auction quantity
  - name: unit
    type: str
    description: Unit of measurement (e.g. 枝)
  - name: price
    type: float
    description: Unit price
  - name: avg_price
    type: float
    description: Average price
  - name: price_high
    type: float
    description: Highest price
  - name: price_low
    type: float
    description: Lowest price
  - name: volume
    type: str
    description: Trading volume
  - name: total_volume
    type: str
    description: Total volume
  - name: transaction_rate
    type: str
    description: Transaction rate
  - name: title
    type: str
    description: Market analysis title
  - name: summary
    type: str
    description: Market analysis summary
  - name: date_range
    type: str
    description: Date range for market data
  - name: data_type
    type: str
    description: Data type (auction, price, market, detail)
  - name: url
    type: str
    description: Source URL
  - name: scraped_at
    type: str
    description: ISO timestamp of extraction
concepts:
- column: price
  concept: commodity.price
  entity_type: industry
  measure: price
  unit: currency_cny
  frequency: daily
- column: avg_price
  concept: commodity.avg_price
  entity_type: industry
  measure: price
  unit: currency_cny
  frequency: daily
- column: volume
  concept: commodity.volume
  entity_type: industry
  measure: volume
  unit: string
  frequency: daily
entities:
- entity_type: industry
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
parked: true
# 接入声明（change: define-ingest-revision-and-coverage, decision 4A）
revision_policy: overwrite_with_history
coverage_capability: gaps_only
