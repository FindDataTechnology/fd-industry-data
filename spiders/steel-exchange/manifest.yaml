name: steel-exchange
label: 期货交易所与数据平台(Steel Exchanges & Data Platforms)
source_url: https://www.shfe.com.cn/
description: 模板生成的多源抓取骨架：按 START_URLS 抓取 6 个交易所/钢铁数据平台首页，extract_data_from_page() 为占位实现、不解析任何字段（返回空列表），SOURCE_INFO 占位符未填充；具备 UA 轮换、重试与 SQLite/JSON 落盘逻辑。
start_urls:
  - https://www.shfe.com.cn/
  - https://www.mysteel.com/
  - https://www.wind.com.cn/
  - https://www.smm.cn/
  - http://www.steelhome.cn/
  - http://data.stats.gov.cn/
fields: []  # 页面解析为占位实现，代码中无可列举的具体字段
spider:
  class: SteelExchangeSpider
  download_delay: 2.0
  concurrent_requests: 2
  max_retries: 3
outputs:
  sqlite: data/exchange_data.db (table exchange_data)
  json: output/exchange_data.json
