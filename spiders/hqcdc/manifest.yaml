version: '1'
name: hqcdc
label: 全国化工产品数据信息中心 (HQCDC)
source_url: https://www.hqcdc.org.cn/
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: get_hqcdc_data
  description: Scrape chemical product data from HQCDC
  frequency: daily
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  - name: urls
    type: list
    required: false
    description: Custom URLs to scrape
  columns:
  - name: title
    type: str
    description: Chemical product or article title
  - name: description
    type: str
    description: Description text
  - name: url
    type: str
    description: Source URL
  - name: source
    type: str
    description: Data source identifier
  - name: scraped_at
    type: str
    description: Scrape timestamp
concepts:
- column: title
  concept: chemical.product_data
  entity_type: industry
  measure: value
  unit: string
  frequency: daily
entities:
- entity_type: industry
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
