version: "2"
name: mem-disaster           # = spiders/mem-disaster/ 目录名，运行时标识符，合入后不可改名
label: MEM Monthly Natural Disaster Bulletins
source_url: https://www.mem.gov.cn/gk/tjsj/
# site: tencent              # 缺省 tencent；本单元只访问 www.mem.gov.cn 公开栏目页，无需换执行位
schedule: "21 4 21 * *" # 点亮（批次二）：每月 21 日 04:21；应急管理部月度灾情通报
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_mem_disaster
    description: Fetch monthly national natural disaster bulletins from MEM statistics column (affected persons, deaths/missing, direct economic loss)
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum number of bulletin rows to parse (listing order, newest first)
      - name: month
        type: string
        required: false
        description: Filter a single month as YYYY-MM; RuntimeError when the month is not on the listing page (not yet published is normal)
    columns:
      - name: month
        type: string
        description: Bulletin month as YYYY-MM parsed from the title
      - name: title
        type: string
        description: Bulletin title (whitespace-collapsed)
      - name: publish_time
        type: string
        description: Upstream publish datetime as shown in the listing (YYYY-MM-DD HH:MM)
      - name: affected_person
        type: float
        description: Nationwide affected population in 万人次 (as printed in the summary sentence); null when absent
      - name: deaths_missing
        type: float
        description: Nationwide deaths and missing persons (人); null when absent
      - name: economic_loss
        type: float
        description: Direct economic loss normalized to 亿元 (万元 values divided by 1e4); null when absent
      - name: summary
        type: string
        description: Raw nationwide summary sentence the metrics were parsed from (traceability)
      - name: url
        type: string
        description: Bulletin article URL
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: affected_person
    concept: disaster.affected_person
    entity_type: country
    measure: value
    unit: ten_thousand_person
    frequency: monthly
entities:
  - entity_type: country
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
