version: '1'
name: github-fivethirtyeight
label: FiveThirtyEight Data (GitHub)
source_url: https://github.com/fivethirtyeight/data
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: get_github_fivethirtyeight_data
  description: Scrape FiveThirtyEight data repository listings from GitHub including
    dataset metadata
  frequency: weekly
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  - name: urls
    type: list
    required: false
    description: Custom URLs to scrape
  columns:
  - name: title
    type: str
    description: Repository or dataset title
  - name: description
    type: str
    description: Description text
  - name: url
    type: str
    description: Source URL
  - name: language
    type: str
    description: Programming language
  - name: stars
    type: str
    description: Star count
  - name: forks
    type: str
    description: Fork count
  - name: source
    type: str
    description: Data source identifier
  - name: scraped_at
    type: str
    description: Scrape timestamp
concepts:
- column: title
  concept: github.repository
  entity_type: organization
  measure: value
  unit: string
  frequency: weekly
entities:
- entity_type: organization
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
