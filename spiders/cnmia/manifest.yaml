name: cnmia
label: 中国有色金属工业协会
source_url: https://www.chinametal.org.cn/
description: |
  中国有色金属工业协会官方数据，包括有色金属统计数据、
  产量数据、进出口数据、市场价格和行业分析报告。
  覆盖铜、铝、锌、铅、镍、锡、稀土、贵金属等品种。

authentication:
  required: false
  type: none
  notes: |
    统计数据公开可获取。部分详细数据可能需要协会会员资格。
    Statistical data publicly available. Some detailed data may
    require association membership.

rate_limiting:
  download_delay: 2
  concurrent_requests: 1
  notes: 建议2秒延迟

anti_bot:
  method: browser_impersonation
  details: Chrome browser impersonation with stealthy headers

functions:
  - command: get_cnmia_data
    description: 获取有色金属行业数据
    category: industry-data
    frequency: monthly
    parameters:
      include_production:
        type: bool
        description: 是否抓取产量统计数据
        default: true
      include_trade:
        type: bool
        description: 是否抓取进出口数据
        default: true
      include_prices:
        type: bool
        description: 是否抓取价格数据
        default: true
      include_reports:
        type: bool
        description: 是否抓取行业报告
        default: true
      include_news:
        type: bool
        description: 是否抓取行业新闻
        default: true

columns:
  production:
    date:
      type: str
      description: 日期
    metal:
      type: str
      description: 金属名称
    metal_cn:
      type: str
      description: 金属名称（中文）
    category:
      type: str
      description: 类别（copper/aluminum/zinc/lead/nickel/tin/rare_earth/precious）
    production:
      type: float
      description: 产量
    production_unit:
      type: str
      description: 产量单位（万吨）
    yoy_change:
      type: float
      description: 同比变化（%）
  trade:
    date:
      type: str
      description: 日期
    metal:
      type: str
      description: 金属名称
    import_volume:
      type: float
      description: 进口量
    export_volume:
      type: float
      description: 出口量
    trade_unit:
      type: str
      description: 贸易量单位（万吨）
    import_value:
      type: float
      description: 进口额
    export_value:
      type: float
      description: 出口额
    value_unit:
      type: str
      description: 贸易额单位（亿美元）
  prices:
    date:
      type: str
      description: 日期
    metal:
      type: str
      description: 金属名称
    price:
      type: float
      description: 价格
    price_unit:
      type: str
      description: 价格单位（元/吨 或 美元/吨）
    currency:
      type: str
      description: 货币（CNY/USD）
    price_change:
      type: float
      description: 涨跌额
    price_change_pct:
      type: float
      description: 涨跌幅（%）
    market_type:
      type: str
      description: 市场类型（domestic/international/index）
  reports:
    date:
      type: str
      description: 发布日期
    title:
      type: str
      description: 报告标题
    category:
      type: str
      description: 类别（monthly_report/annual_report/analysis）
    metal:
      type: str
      description: 相关金属
    summary:
      type: str
      description: 摘要
  news:
    date:
      type: str
      description: 日期
    title:
      type: str
      description: 标题
    category:
      type: str
      description: 类别（industry/policy）
    content:
      type: str
      description: 内容摘要
    related_metals:
      type: str
      description: 相关金属

output:
  sqlite:
    path: data/cnmia.db
    tables:
      - production_data
      - trade_data
      - price_data
      - industry_reports
      - industry_news
  json:
    - path: output/cnmia_production.json
      description: 产量数据
    - path: output/cnmia_trade.json
      description: 进出口数据
    - path: output/cnmia_prices.json
      description: 价格数据
    - path: output/cnmia_reports.json
      description: 行业报告
    - path: output/cnmia_news.json
      description: 行业新闻
