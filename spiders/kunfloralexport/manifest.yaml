version: '1'
name: kunfloralexport
label: 昆明花卉出口 (Kunfloral Export)
source_url: https://www.kunfloralexport.com
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: get_kunfloralexport_data
  description: Scrape flower export trade data from Kunfloral
  frequency: daily
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  - name: urls
    type: list
    required: false
    description: Custom URLs to scrape
  columns:
  - name: title
    type: str
    description: Product or article title
  - name: description
    type: str
    description: Description text
  - name: url
    type: str
    description: Source URL
  - name: source
    type: str
    description: Data source identifier
  - name: scraped_at
    type: str
    description: Scrape timestamp
concepts:
- column: title
  concept: agriculture.flower_export
  entity_type: industry
  measure: volume
  unit: currency_cny
  frequency: daily
entities:
- entity_type: industry
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
