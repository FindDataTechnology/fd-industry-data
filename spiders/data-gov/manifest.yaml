version: "1"
name: data-gov
label: US Data.gov
source_url: https://www.data.gov/
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_data_gov
    description: Fetch metadata and dataset listings from US Data.gov portal
    frequency: on_demand
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: title
        type: str
        description: Dataset or page title
      - name: description
        type: str
        description: Dataset or page description
      - name: url
        type: str
        description: Source URL
      - name: source
        type: str
        description: Data source name
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
concepts:
  - column: title
    concept: document.title
    entity_type: country
    measure: value
    unit: string
    frequency: on_demand
entities:
  - entity_type: country
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
