# fd-open-data-protocol compliant manifest
# MCP integration metadata

name: developers
label: "WeChat Open Platform Official Documentation"
description: "Official API documentation for accessing WeChat Official Account data including message management, user info, and interaction metrics"
source_url: "https://developers.weixin.qq.com/doc/offiaccount/OA_Web_Apps/Wechat_Open_Capability.html"
priority_score: 95
created_at: 2026-08-01T01:22:55.636552

function_definitions:
  - name: fetch_developers
    description: "Fetch data from WeChat Open Platform Official Documentation"
    parameters:
      - name: urls
        type: array<string>
        description: "List of URLs to scrape"
        optional: true
        default: ["https://developers.weixin.qq.com/doc/offiaccount/OA_Web_Apps/Wechat_Open_Capability.html"]
      - name: limit
        type: integer
        description: "Maximum number of records to fetch"
        optional: true
        default: 1000
    returns: array<object>
    
  - name: query_developers
    description: "Query stored data from WeChat Open Platform Official Documentation"
    parameters:
      - name: filters
        type: object
        description: "Filter criteria"
        optional: true
      - name: limit
        type: integer
        description: "Max records to return"
        optional: true
        default: 100
    returns: array<object>

column_schemas:
  - name: source_url
    type: string
    description: "Original URL of the scraped page"
    
  - name: page_title
    type: string
    description: "HTML title of the page"
    
  - name: content_length
    type: integer
    description: "Size of page content in bytes"
    
  - name: status_code
    type: integer
    description: "HTTP status code of the request"
    
  - name: scraped_at
    type: timestamp
    description: "Timestamp when the data was collected"

commands:
  - name: fetch
    description: "Run the scraper to collect new data"
    command: "python spider.py --urls <url1> <url2>"
    
  - name: dry-run
    description: "Test scraping without saving results"
    command: "python spider.py --dry-run"
    
  - name: export-json
    description: "Export data to JSON Lines format"
    command: "python spider.py --format json"
    
  - name: export-db
    description: "Export data to SQLite database"
    command: "python spider.py --format sqlite"