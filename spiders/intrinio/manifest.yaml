version: '1'
name: intrinio
label: Intrinio Financial Data
source_url: https://www.intrinio.com/
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: get_intrinio_data
  description: Scrape financial data and API endpoint info from Intrinio
  frequency: daily
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  - name: urls
    type: list
    required: false
    description: Custom URLs to scrape
  columns:
  - name: title
    type: str
    description: Financial data title
  - name: description
    type: str
    description: Description text
  - name: url
    type: str
    description: Source URL
  - name: source
    type: str
    description: Data source identifier
  - name: scraped_at
    type: str
    description: Scrape timestamp
concepts:
- column: title
  concept: financial.market_data
  entity_type: company
  measure: value
  unit: usd
  frequency: daily
entities:
- entity_type: company
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
