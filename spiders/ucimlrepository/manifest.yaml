name: ucimlrepository
version: 1.0.0
label: UCI ML Repository
description: High-priority data source scraper for UCI ML Repository
source_url: https://archive.ics.uci.edu/api/trpc/donated_datasets.findAll?batch=1&input=%7B%220%22%3A%7B%22json%22%3A%7B%22skip%22%3A0%2C%22take%22%3A20%2C%22filter%22%3Anull%2C%22search%22%3Anull%2C%22sort%22%3Anull%7D%7D%7D
author: FindData Official
license: MIT
created_at: 2026-08-01

spider:
  class: run_spider
  module: spider.py
  entry_point: python spider.py

data_sources:
  - name: Primary Source
    url: https://archive.ics.uci.edu/api/trpc/donated_datasets.findAll?batch=1&input=%7B%220%22%3A%7B%22json%22%3A%7B%22skip%22%3A0%2C%22take%22%3A20%2C%22filter%22%3Anull%2C%22search%22%3Anull%2C%22sort%22%3Anull%7D%7D%7D
    category: main

functions:
  - name: fetch_ucimlrepository_metadata
    label: Fetch metadata
    description: Extract source metadata and data points
    parameters:
      - name: url
        type: string
        required: true
        description: Target URL to scrape
      - name: include_details
        type: boolean
        required: false
        default: false
    returns:
      - name: results
        type: array
        description: Array of extracted items

columns:
  - name: id
    type: INTEGER
    nullable: false
    description: Primary key
  - name: scraped_at
    type: TEXT
    nullable: true
    description: ISO timestamp
  - name: name
    type: TEXT
    nullable: true
    description: Dataset name
  - name: description
    type: TEXT
    nullable: true
    description: Abstract (capped at 300 chars)
  - name: url
    type: TEXT
    nullable: true
    description: Dataset page URL
  - name: type
    type: TEXT
    nullable: true
    description: Task (e.g. Classification, Regression)
  - name: instances
    type: TEXT
    nullable: true
    description: Row count
  - name: area
    type: TEXT
    nullable: true
    description: Subject area
  - name: doi
    type: TEXT
    nullable: true
    description: Dataset DOI
  - name: source_url
    type: TEXT
    nullable: true
    description: API URL the record was parsed from

commands:
  - command: "python spider.py"
    description: Run with the default API URL
    example: "cd ucimlrepository && python spider.py"

  - command: "python spider.py --urls <url1> <url2>"
    description: Run with custom URLs
    example: "python spider.py --urls https://example.com/data"
  
  - command: "python spider.py --dry-run"
    description: Dry run without saving
    example: "python spider.py --dry-run"
  
  - command: "uv run python spider.py"
    description: Run with uv package manager
    example: "uv run python spider.py --verbose"

features:
  - sqlite_storage
  - json_export
  - user_agent_rotation
  - rate_limiting
  - error_logging

settings:
  concurrent_requests: 4
  download_delay: 1.0
  robotstxt_obey: true
  user_agent_rotation: true

dependencies:
  - scrapling>=0.4.7
  - python>=3.10

last_updated: 2026-08-01
status: active
priority_score: 92
