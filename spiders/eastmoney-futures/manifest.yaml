# fd-open-data-protocol compliant manifest
# MCP integration metadata

name: eastmoney-futures
label: "东方财富期货数据"
description: "东方财富期货数据频道，提供国内四大期货交易所实时行情与持仓数据。"
source_url: "https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_FUTU_POSITIONCODE&columns=TRADE_MARKET_CODE,TRADE_CODE,TRADE_TYPE,SECURITY_CODE,IS_MAINCODE&filter=%28IS_MAINCODE%3D%221%22%29&pageNumber=1&pageSize=60&sortTypes=1,-1&sortColumns=IS_MAINCODE,SECURITY_CODE&source=WEB&client=WEB"
priority_score: 92
created_at: 2026-08-01

function_definitions:
  - name: fetch_eastmoney_futures
    description: "Fetch data from 东方财富期货数据"
    parameters:
      - name: urls
        type: array<string>
        description: "List of URLs to scrape"
        optional: true
        default: ["https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_FUTU_POSITIONCODE&columns=TRADE_MARKET_CODE,TRADE_CODE,TRADE_TYPE,SECURITY_CODE,IS_MAINCODE&filter=%28IS_MAINCODE%3D%221%22%29&pageNumber=1&pageSize=60&sortTypes=1,-1&sortColumns=IS_MAINCODE,SECURITY_CODE&source=WEB&client=WEB"]
      - name: limit
        type: integer
        description: "Maximum number of records to fetch"
        optional: true
        default: 1000
    returns: array<object>

  - name: query_eastmoney_futures
    description: "Query stored data from 东方财富期货数据"
    parameters:
      - name: filters
        type: object
        description: "Filter criteria"
        optional: true
      - name: limit
        type: integer
        description: "Max records to return"
        optional: true
        default: 100
    returns: array<object>

column_schemas:
  - name: contract
    type: string
    description: "主力合约代码 (SECURITY_CODE, 如 si2611)"
  - name: product
    type: string
    description: "品种名称 (TRADE_TYPE, 如 工业硅)"
  - name: trade_code
    type: string
    description: "交易代码 (TRADE_CODE, 如 si)"
  - name: market_code
    type: string
    description: "交易所市场代码 (TRADE_MARKET_CODE, 如 069001021)"
  - name: is_main
    type: string
    description: "是否主力合约标记 (IS_MAINCODE)"
  - name: source_url
    type: string
    description: "API URL of the parsed payload"
  - name: scraped_at
    type: timestamp
    description: "Timestamp when the data was collected"

commands:
  - name: fetch
    description: "Run the scraper to collect new data"
    command: "python spider.py --urls <url1> <url2>"
  - name: dry-run
    description: "Test scraping without saving results"
    command: "python spider.py --dry-run"
