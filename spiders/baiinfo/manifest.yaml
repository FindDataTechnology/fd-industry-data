name: baiinfo
label: 百川盈孚
source_url: https://www.baiinfo.com/
description: |
  百川盈孚官方数据，包括化工产品价格、市场分析、
  供应链数据和行业新闻。覆盖有机化工、无机化工、
  合成材料、涂料原料、特种化工等品类。

authentication:
  required: false
  type: none
  notes: |
    公开页面数据无需登录。详细价格数据和深度分析报告需要付费订阅。
    Public pages accessible without login. Detailed price data and
    in-depth reports require paid subscription.

rate_limiting:
  download_delay: 2
  concurrent_requests: 1
  notes: 建议2秒延迟

anti_bot:
  method: browser_impersonation
  details: Chrome browser impersonation with stealthy headers

functions:
  - command: get_baiinfo_data
    description: 获取百川盈孚化工行业数据
    category: industry-data
    frequency: daily
    parameters:
      include_market:
        type: bool
        description: 是否抓取市场分析数据
        default: true
      include_news:
        type: bool
        description: 是否抓取行业新闻
        default: true

columns:
  prices:
    date:
      type: str
      description: 日期
    product:
      type: str
      description: 产品名称
    product_cn:
      type: str
      description: 产品名称（中文）
    category:
      type: str
      description: 产品类别（organic/inorganic/polymers/coatings/specialty）
    price:
      type: float
      description: 价格
    price_unit:
      type: str
      description: 价格单位（元/吨）
    price_change:
      type: float
      description: 涨跌额
    price_change_pct:
      type: float
      description: 涨跌幅（%）
    price_high:
      type: float
      description: 最高价
    price_low:
      type: float
      description: 最低价
    market_location:
      type: str
      description: 市场地区
  market:
    date:
      type: str
      description: 日期
    product:
      type: str
      description: 产品名称
    supply_index:
      type: float
      description: 供应指数
    demand_index:
      type: float
      description: 需求指数
    inventory:
      type: float
      description: 库存量
    operating_rate:
      type: float
      description: 开工率
    market_trend:
      type: str
      description: 市场趋势
    analysis_text:
      type: str
      description: 分析文本
  news:
    date:
      type: str
      description: 日期
    title:
      type: str
      description: 标题
    category:
      type: str
      description: 类别（industry/company/policy）
    content:
      type: str
      description: 内容摘要
    related_products:
      type: str
      description: 相关产品

output:
  sqlite:
    path: data/baiinfo.db
    tables:
      - price_data
      - market_analysis
      - industry_news
  json:
    - path: output/baiinfo_prices.json
      description: 价格数据
    - path: output/baiinfo_market.json
      description: 市场分析
    - path: output/baiinfo_news.json
      description: 行业新闻
