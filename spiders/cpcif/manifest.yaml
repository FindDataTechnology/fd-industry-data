name: cpcif
label: 中国石油和化学工业联合会
source_url: http://www.cpcifa.org.cn/
description: |
  中国石油和化学工业联合会官方数据，包括化工生产数据、石化行业统计、
  市场分析报告和贸易数据。覆盖基础化工、石油化工、精细化工、化肥、
  合成材料等主要化工品类。

authentication:
  required: false
  type: none
  notes: |
    公开数据，无需登录。部分详细报告可能需要会员资格。
    Public data, no login required. Some detailed reports may require
    membership.

rate_limiting:
  download_delay: 3
  concurrent_requests: 1
  notes: 建议3秒延迟

anti_bot:
  method: browser_impersonation
  details: Chrome browser impersonation with stealthy headers

functions:
  - command: get_cpcif_data
    description: 获取石油化工行业数据
    category: industry-data
    frequency: monthly
    parameters:
      include_reports:
        type: bool
        description: 是否抓取行业报告
        default: true
      include_news:
        type: bool
        description: 是否抓取行业新闻
        default: true

columns:
  production:
    period:
      type: str
      description: 统计期间
    product:
      type: str
      description: 产品名称
    product_cn:
      type: str
      description: 产品名称（中文）
    category:
      type: str
      description: 产品类别
    production_volume:
      type: float
      description: 产量
    production_unit:
      type: str
      description: 产量单位（默认万吨）
    yoy_change:
      type: float
      description: 同比变化
  market:
    date:
      type: str
      description: 日期
    product:
      type: str
      description: 产品名称
    price:
      type: float
      description: 价格
    price_unit:
      type: str
      description: 价格单位（元/吨）
    market_trend:
      type: str
      description: 市场趋势
  trade:
    period:
      type: str
      description: 统计期间
    product:
      type: str
      description: 产品名称
    import_volume:
      type: float
      description: 进口量
    export_volume:
      type: float
      description: 出口量
    import_value:
      type: float
      description: 进口额
    export_value:
      type: float
      description: 出口额
  reports:
    date:
      type: str
      description: 发布日期
    title:
      type: str
      description: 报告标题
    category:
      type: str
      description: 类别

output:
  sqlite:
    path: data/cpcif.db
    tables:
      - production_data
      - market_analysis
      - trade_data
      - industry_reports
      - industry_news
  json:
    - path: output/cpcif_production.json
      description: 生产数据
    - path: output/cpcif_market.json
      description: 市场数据
    - path: output/cpcif_trade.json
      description: 贸易数据
    - path: output/cpcif_reports.json
      description: 行业报告
    - path: output/cpcif_news.json
      description: 行业新闻
