version: "2"
name: fao-food-price              # = spiders/fao-food-price/ 目录名，运行时标识符，合入后不可改名
label: FAO Food Price Index
source_url: https://www.fao.org/worldfoodsituation/foodpricesindex/en/
# site: tencent              # 缺省 tencent；本单元只访问 www.fao.org 公开页面/CSV，无需换执行位
# schedule: 不写——静默合入，点亮留给人工门
schedule: "15 1 7 * *"  # 点亮（批次二）：每月 7 日 01:15；FAO 食价指数首周发布后稳取
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_fao_food_price
    description: Fetch FAO Food Price Index values — monthly CSV (headline plus meat/dairy/cereals/oils/sugar, nominal) and/or the annual XLSX series (headline nominal + real/deflated, 1961 onward)
    frequency: monthly
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum (month, index_name) rows to return (deterministic order, earliest months first)
      - name: scope
        type: str
        required: false
        description: monthly (default, unchanged) = monthly CSV; annual = same-page XLSX annual series (1961+, nominal + real); all = both merged
    columns:
      - name: month
        type: string
        description: Index period — YYYY-MM for monthly rows (1990-01 onward), YYYY for annual rows (1961 onward)
      - name: index_name
        type: string
        description: Index series name — monthly (Food Price Index, Meat, Dairy, Cereals, Oils, Sugar) or annual (Food Price Index (nominal) / Food Price Index (real))
      - name: value
        type: float
        description: Index value (2014-2016=100 base); annual rows carry both nominal and real (deflated) series
      - name: url
        type: string
        description: Source CSV URL for the row
      - name: source
        type: string
        description: Data source identifier
      - name: scraped_at
        type: string
        description: ISO timestamp of the fetch
concepts:
  - column: value
    concept: food_price.index
    entity_type: region
    measure: value
    unit: index
    frequency: monthly
entities:
  - entity_type: region
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
