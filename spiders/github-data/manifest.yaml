version: "1"
name: github-data
label: GitHub Awesome China Data
source_url: https://github.com/awesome-china/data
scanner_mode: upstream-curated
ranking_seed: [0.5, 0.5]
functions:
  - command: run_github_data
    description: Fetch repository metadata and dataset listings from GitHub Awesome China Data
    frequency: on_demand
    parameters:
      - name: limit
        type: int
        required: false
        description: Maximum records to return
    columns:
      - name: title
        type: str
        description: Repository or dataset title
      - name: description
        type: str
        description: Repository description
      - name: url
        type: str
        description: Source URL
      - name: language
        type: str
        description: Primary programming language
      - name: stars
        type: str
        description: GitHub star count
      - name: forks
        type: str
        description: GitHub fork count
      - name: scraped_at
        type: str
        description: ISO timestamp of extraction
concepts:
  - column: title
    concept: document.title
    entity_type: organization
    measure: value
    unit: string
    frequency: on_demand
entities:
  - entity_type: organization
    coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
