version: '1'
name: isee
label: 国家生态环境数据平台 (ISEE)
source_url: https://www.isee.gov.cn/
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: get_isee_data
  description: Scrape environmental data from ISEE platform
  frequency: daily
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  - name: urls
    type: list
    required: false
    description: Custom URLs to scrape
  columns:
  - name: title
    type: str
    description: Environmental data title
  - name: description
    type: str
    description: Description text
  - name: url
    type: str
    description: Source URL
  - name: source
    type: str
    description: Data source identifier
  - name: scraped_at
    type: str
    description: Scrape timestamp
concepts:
- column: title
  concept: environment.emission_data
  entity_type: country
  measure: value
  unit: string
  frequency: daily
entities:
- entity_type: country
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
