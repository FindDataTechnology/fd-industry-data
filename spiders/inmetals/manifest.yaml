# parked 2026-11-08 (audit-ponytail 05 §1): this unit is a copy of the
# metadata template — its production entry only scrapes the homepage
# title/meta description and reports it as source data. No real parser
# exists, so it is off (parked + no schedule + enabled: false) rather
# than producing healthy-looking empty shells. Re-enable only with a
# real extractor.
version: '1'
data_period: day
site: zihan
name: inmetals
label: Inmetals Metal Prices
source_url: https://www.inmetals.com
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: run_inmetals
  description: Scrape metal price data from Inmetals
  frequency: daily
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  columns:
  - name: title
    type: str
    description: Metal product title
  - name: description
    type: str
    description: Description text
  - name: url
    type: str
    description: Source URL
  - name: source
    type: str
    description: Data source identifier
  - name: scraped_at
    type: str
    description: Scrape timestamp
concepts:
- column: title
  concept: metal.price
  entity_type: industry
  measure: price
  unit: usd
  frequency: daily
entities:
- entity_type: industry
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
parked: true
enabled: false
# 接入声明（change: define-ingest-revision-and-coverage, decision 4A）
revision_policy: overwrite_with_history
coverage_capability: gaps_only
