version: '1'
name: github-opendata-china
label: China Open Data (GitHub)
source_url: https://github.com/opendata/china-data-hub
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: get_github_opendata_china_data
  description: Scrape China open data repository listings from GitHub
  frequency: weekly
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  - name: urls
    type: list
    required: false
    description: Custom URLs to scrape
  columns:
  - name: title
    type: str
    description: Repository title
  - name: description
    type: str
    description: Description text
  - name: url
    type: str
    description: Source URL
  - name: language
    type: str
    description: Programming language
  - name: stars
    type: str
    description: Star count
  - name: forks
    type: str
    description: Fork count
  - name: scraped_at
    type: str
    description: Scrape timestamp
concepts:
- column: title
  concept: github.china_dataset
  entity_type: country
  measure: value
  unit: string
  frequency: weekly
entities:
- entity_type: country
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
