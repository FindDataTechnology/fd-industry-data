# parked 2026-11-08 (audit-ponytail 05 §1): this unit is a copy of the
# metadata template — its production entry only scrapes the homepage
# title/meta description and reports it as source data. No real parser
# exists, so it is off (parked + no schedule + enabled: false) rather
# than producing healthy-looking empty shells. Re-enable only with a
# real extractor.
version: '1'
name: chinamonitor
label: 中国监控网 (China Monitor)
source_url: https://www.chinamonitor.com.cn/
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: run_chinamonitor
  description: Fetch data from 中国监控网 (China Monitor)
  frequency: on_demand
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  columns:
  - name: id
    type: integer
    description: Primary key
  - name: title
    type: string
    description: Page title
  - name: description
    type: string
    description: Page description
  - name: url
    type: string
    description: Source URL
  - name: source
    type: string
    description: Data source identifier
  - name: scraped_at
    type: string
    description: ISO timestamp
concepts:
- column: title
  concept: organization.name
  entity_type: organization
  measure: value
  unit: string
  frequency: on_demand
entities:
- entity_type: organization
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
parked: true
enabled: false