# fd-open-data-protocol compliant manifest

name: flowers-yunnan
label: "云南省花卉产业信息网"
description: "Yunnan Flower Industry Information Network providing real-time flower pricing, market data, and industry insights for China's largest flower production base."
source_url: "https://flowers.yunnan.gov.cn"
priority_score: 89
created_at: 2026-08-01T12:00:00

function_definitions:
  - name: fetch_flowers_yunnan
    description: "Fetch flower industry data from Yunnan"
    parameters:
      - name: urls
        type: array<string>
        optional: true
      - name: limit
        type: integer
        optional: true
        default: 1000
    returns: array<object>

column_schemas:
  - name: source_url
    type: string
  - name: page_title
    type: string
  - name: flower_name
    type: string
  - name: price
    type: string
  - name: unit
    type: string
  - name: category
    type: string
  - name: origin
    type: string
  - name: publish_date
    type: string
  - name: scraped_at
    type: timestamp

commands:
  - name: fetch
    command: "python spider.py --urls <url1>"
  - name: dry-run
    command: "python spider.py --dry-run"
