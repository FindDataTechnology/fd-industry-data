version: '1'
name: metal-com
label: Metal.com Nonferrous Metals
source_url: https://www.metal.com
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: get_metal_com_data
  description: Scrape nonferrous metal price and market data from Metal.com
  frequency: daily
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  - name: urls
    type: list
    required: false
    description: Custom URLs to scrape
  columns:
  - name: title
    type: str
    description: Metal product title
  - name: description
    type: str
    description: Description text
  - name: url
    type: str
    description: Source URL
  - name: source
    type: str
    description: Data source identifier
  - name: scraped_at
    type: str
    description: Scrape timestamp
concepts:
- column: title
  concept: metal.nonferrous_price
  entity_type: industry
  measure: price
  unit: usd
  frequency: daily
entities:
- entity_type: industry
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
