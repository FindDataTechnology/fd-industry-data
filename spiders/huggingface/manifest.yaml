version: '1'
name: huggingface
label: HuggingFace Datasets
source_url: https://huggingface.co/datasets
scanner_mode: upstream-curated
ranking_seed:
- 0.5
- 0.5
functions:
- command: get_huggingface_data
  description: Scrape ML dataset listings from HuggingFace
  frequency: weekly
  parameters:
  - name: limit
    type: int
    required: false
    description: Maximum records to return
  - name: urls
    type: list
    required: false
    description: Custom URLs to scrape
  columns:
  - name: title
    type: str
    description: Dataset title
  - name: description
    type: str
    description: Description text
  - name: url
    type: str
    description: Source URL
  - name: source
    type: str
    description: Data source identifier
  - name: scraped_at
    type: str
    description: Scrape timestamp
concepts:
- column: title
  concept: ml.dataset
  entity_type: organization
  measure: value
  unit: string
  frequency: weekly
entities:
- entity_type: organization
  coverage: universe
fetch:
  module: fd_industry_data.provider:IndustryDataProvider
